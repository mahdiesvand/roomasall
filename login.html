<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ورود | عسل چت</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma, Arial;
}

body{

    min-height:100vh;
    background:#eef2f6;
    display:flex;
    justify-content:center;
    align-items:center;

}


.login-container{

    width:380px;
    background:#fff;
    padding:40px 35px;
    border-radius:12px;
    box-shadow:0 10px 35px rgba(0,0,0,.15);
    text-align:center;

}


.logo{

    font-size:36px;
    font-weight:bold;
    color:#d89b00;
    margin-bottom:10px;

}


.subtitle{

    color:#777;
    font-size:14px;
    margin-bottom:30px;

}


.input-box{

    text-align:right;
    margin-bottom:15px;

}


label{

    display:block;
    margin-bottom:6px;
    color:#555;
    font-size:14px;

}


input{

    width:100%;
    height:48px;
    border:1px solid #ddd;
    border-radius:8px;
    padding:0 15px;
    font-size:15px;
    outline:none;

}


input:focus{

    border-color:#d89b00;

}


button{

    width:100%;
    height:48px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    background:#d89b00;
    color:white;
    font-size:17px;
    cursor:pointer;

}


button:hover{

    background:#b98200;

}


.footer{

    margin-top:25px;
    color:#888;
    font-size:14px;

}


a{

    color:#d89b00;
    text-decoration:none;

}


</style>

</head>


<body>


<div class="login-container">


<div class="logo">
🍯 عسل چت
</div>


<div class="subtitle">
ورود به حساب کاربری
</div>



<div class="input-box">

<label>
ایمیل
</label>

<input 
id="email"
type="email"
placeholder="example@gmail.com">

</div>



<div class="input-box">

<label>
رمز عبور
</label>

<input 
id="password"
type="password"
placeholder="رمز عبور">

</div>



<button onclick="login()">

ورود

</button>



<div class="footer">

حساب ندارید؟

<a href="register.html">
ثبت نام
</a>

</div>


</div>



<script type="module" src="script.js"></script>


</body>

</html>
