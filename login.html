<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ورود | عسل چت</title>

<style>

*{
box-sizing:border-box;
font-family:Tahoma,Arial;
}

body{
margin:0;
height:100vh;
background:#f3f6f9;
display:flex;
justify-content:center;
align-items:center;
}


.login-box{

width:360px;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 8px 25px #0002;
text-align:center;

}


.logo{

font-size:32px;
font-weight:bold;
color:#e5a000;
margin-bottom:25px;

}


input{

width:100%;
height:45px;
margin:10px 0;
border:1px solid #ddd;
border-radius:7px;
padding:10px;
font-size:15px;

}


button{

width:100%;
height:45px;
margin-top:15px;
border:0;
border-radius:7px;
background:#e5a000;
color:white;
font-size:17px;
cursor:pointer;

}


button:hover{

background:#c88b00;

}


a{

display:block;
margin-top:20px;
color:#777;
text-decoration:none;

}

</style>

</head>


<body>


<div class="login-box">


<div class="logo">
🍯 عسل چت
</div>


<input 
id="email"
type="email"
placeholder="ایمیل">


<input 
id="password"
type="password"
placeholder="رمز عبور">


<button onclick="login()">
ورود
</button>


<a href="register.html">
ساخت حساب جدید
</a>


</div>



<script type="module" src="script.js"></script>


</body>

</html>
