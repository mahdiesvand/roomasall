<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پروفایل عسل چت</title>

<style>

body{

margin:0;
height:100vh;
font-family:tahoma;

background:#0b141a;

display:flex;
align-items:center;
justify-content:center;

color:white;

}



.profile{

width:90%;
max-width:400px;

background:#17212b;

padding:25px;

border-radius:25px;

text-align:center;

box-shadow:0 10px 30px #000;

}



h2{

color:#ffd700;

}



.avatar{

font-size:70px;

margin:20px;

}



select,
input{

width:100%;

padding:15px;

margin:10px 0;

border:none;

border-radius:25px;

background:#0b141a;

color:white;

font-size:16px;

}



button{

width:100%;

padding:15px;

border:none;

border-radius:25px;

background:#ffd700;

font-size:18px;

cursor:pointer;

}



</style>


</head>



<body>


<div class="profile">


<h2>
🍯 پروفایل عسل چت
</h2>


<div class="avatar" id="showAvatar">
🙂
</div>



<input id="name" placeholder="نام شما">



<select id="avatar" onchange="changeAvatar()">

<option>🙂</option>
<option>😎</option>
<option>👑</option>
<option>🔥</option>
<option>🍯</option>
<option>🤖</option>

</select>



<button onclick="saveProfile()">

ذخیره پروفایل

</button>


</div>




<script>


function changeAvatar(){

document.getElementById("showAvatar").innerHTML =
document.getElementById("avatar").value;

}



function saveProfile(){


let name =
document.getElementById("name").value;


let avatar =
document.getElementById("avatar").value;



localStorage.setItem("username",name);

localStorage.setItem("avatar",avatar);



location.href="chat.html";


}




let oldName =
localStorage.getItem("username");


let oldAvatar =
localStorage.getItem("avatar");



if(oldName){

document.getElementById("name").value=oldName;

}



if(oldAvatar){

document.getElementById("avatar").value=oldAvatar;

document.getElementById("showAvatar").innerHTML=oldAvatar;

}


</script>


</body>

</html>
