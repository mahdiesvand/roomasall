<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatRoom</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111827;
    font-family:tahoma;
}

.box{
    background:white;
    width:90%;
    max-width:350px;
    padding:25px;
    border-radius:20px;
    text-align:center;
}

h2{
    color:#2563eb;
}

input{
    width:90%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ccc;
    margin:15px 0;
    font-size:16px;
}

button{
    width:95%;
    padding:12px;
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:17px;
}
</style>

</head>

<body>

<div class="box">

<h2>💬 ChatRoom</h2>

<input id="username" placeholder="نام خود را وارد کنید">

<button onclick="enterChat()">ورود به چت</button>

</div>


<script>

function enterChat(){

let name=document.getElementById("username").value;

if(name==""){
alert("لطفا اسم وارد کنید");
return;
}

localStorage.setItem("user",name);

window.location="chat.html";

}

</script>

</body>
</html>
