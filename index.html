<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عسل چت</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#111,#3a0015);
    font-family:tahoma;
}


.box{

    width:90%;
    max-width:400px;
    background:#1c1c1c;
    padding:35px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 0 30px #ff0055;
}


.logo{

    font-size:40px;
    margin-bottom:15px;

}


h1{

    color:white;
    margin-bottom:10px;

}


p{

    color:#ccc;

}



input{

    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:30px;
    outline:none;
    font-size:16px;
    text-align:center;

}



button{

    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:30px;
    background:#cc0033;
    color:white;
    font-size:18px;
    cursor:pointer;

}



button:hover{

    background:#ff0055;

}


</style>

</head>


<body>


<div class="box">


<div class="logo">
🍯
</div>


<h1>
عسل چت
</h1>


<p>
به چت‌روم خوش آمدید
</p>



<input 
id="username"
placeholder="نام خود را وارد کنید"
>



<button onclick="enterChat()">
ورود به چت
</button>


</div>



<script>


function enterChat(){


let name=document.getElementById("username").value;


if(name.trim()==""){
alert("لطفاً نام خود را وارد کنید");
return;
}



localStorage.setItem("username",name);



window.location.href="chat.html";


}



</script>


</body>
</html>
