<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عسل چت</title>

<style>
body{
margin:0;
height:100vh;
background:#080808;
color:white;
display:flex;
justify-content:center;
align-items:center;
font-family:tahoma;
}

.box{
background:#151515;
padding:30px;
border-radius:20px;
width:300px;
text-align:center;
}

input{
width:90%;
padding:12px;
border:none;
border-radius:20px;
margin:10px;
background:#222;
color:white;
}

button{
padding:12px 25px;
border:none;
border-radius:20px;
background:#d6a436;
cursor:pointer;
}
</style>

</head>

<body>

<div class="box">

<h2>🍯 عسل چت</h2>

<input id="username" placeholder="نام کاربری">

<br>

<button onclick="login()">
ورود
</button>

</div>


<script>

function login(){

let user=document.getElementById("username").value;

if(user==""){
alert("نام وارد کن");
return;
}

localStorage.setItem("user",user);

location.href="chat.html";

}

</script>

</body>
</html>
