<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عسل منچ 🐝</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    background:#080604;
}

body{
    min-height:100vh;
    font-family:Tahoma,Arial,sans-serif;
    color:#fff;
    background:
    radial-gradient(
        circle at 50% -10%,
        rgba(255,193,7,.18),
        transparent 35%
    ),
    radial-gradient(
        circle at 0% 100%,
        rgba(255,140,0,.08),
        transparent 35%
    ),
    #080604;
}

.app{
    width:100%;
    max-width:680px;
    margin:auto;
    padding:10px;
}

.header{
    text-align:center;
    padding:10px 0 15px;
}

.header h1{
    font-size:30px;
    font-weight:900;
    background:
    linear-gradient(
        135deg,
        #fff1a8,
        #ffc107,
        #ff9800
    );
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.header p{
    margin-top:5px;
    color:#a99a80;
    font-size:12px;
}

/* تخته */

.board{
    position:relative;
    width:100%;
    aspect-ratio:1;
    padding:5px;

    background:
    linear-gradient(
        145deg,
        #ffd54f,
        #8d5d16,
        #ffca28
    );

    border-radius:25px;

    box-shadow:
    0 0 0 1px rgba(255,193,7,.4),
    0 15px 45px rgba(0,0,0,.65),
    0 0 45px rgba(255,179,0,.12);

    overflow:hidden;
}

.board::before{
    content:"";
    position:absolute;
    inset:5px;
    border-radius:20px;
    pointer-events:none;
    box-shadow:
    inset 0 0 25px rgba(0,0,0,.4);
    z-index:50;
}

/* خانه های رنگی */

.home{
    position:absolute;
    width:40%;
    height:40%;
    padding:7%;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
    gap:8%;
    z-index:2;
}

.home.red{
    left:0;
    top:0;
    background:
    radial-gradient(
        circle at 35% 30%,
        #ff6b5f,
        #c62828
    );
    border-radius:20px 0 0 0;
}

.home.green{
    right:0;
    top:0;
    background:
    radial-gradient(
        circle at 35% 30%,
        #65e89a,
        #159447
    );
    border-radius:0 20px 0 0;
}

.home.blue{
    left:0;
    bottom:0;
    background:
    radial-gradient(
        circle at 35% 30%,
        #65baff,
        #1970b8
    );
    border-radius:0 0 0 20px;
}

.home.yellow{
    right:0;
    bottom:0;
    background:
    radial-gradient(
        circle at 35% 30%,
        #fff176,
        #d99c00
    );
    border-radius:0 0 20px 0;
}

/* جای مهره */

.slot{
    position:relative;
    background:
    radial-gradient(
        circle at 35% 30%,
        #fff,
        #ddd
    );
    border-radius:50%;
    border:3px solid rgba(0,0,0,.25);

    box-shadow:
    inset 0 4px 7px rgba(0,0,0,.18),
    0 3px 6px rgba(0,0,0,.3);
}

/* مسیر */

.track{
    position:absolute;
    left:20%;
    top:20%;
    width:60%;
    height:60%;
    z-index:3;
}

.cell{
    position:absolute;
    width:8%;
    height:8%;

    background:
    linear-gradient(
        145deg,
        #ffffff,
        #e9e5dc
    );

    border:1px solid rgba(100,80,40,.35);
    border-radius:5px;

    box-shadow:
    inset 0 1px 2px rgba(255,255,255,.9),
    0 1px 2px rgba(0,0,0,.15);

    display:flex;
    align-items:center;
    justify-content:center;
}

.cell.safe{
    background:
    radial-gradient(
        circle,
        #fff8cf,
        #e8bd36
    );

    border:2px solid #bd8610;

    box-shadow:
    0 0 8px rgba(255,193,7,.55);
}

.cell.safe::after{
    content:"★";
    color:#9b6500;
    font-size:11px;
}

/* مرکز */

.center{
    position:absolute;
    left:40%;
    top:40%;
    width:20%;
    height:20%;
    z-index:8;

    background:
    conic-gradient(
        #e53935 0deg 90deg,
        #22b85b 90deg 180deg,
        #f4c20d 180deg 270deg,
        #2989d8 270deg 360deg
    );

    border:3px solid rgba(255,255,255,.75);

    box-shadow:
    inset 0 0 15px rgba(0,0,0,.3),
    0 0 12px rgba(255,193,7,.3);
}

/* مهره ها */

.piece{
    position:absolute;
    width:7%;
    aspect-ratio:1;
    border-radius:50%;

    border:3px solid rgba(255,255,255,.95);

    z-index:20;
    cursor:pointer;

    transition:
    left .28s cubic-bezier(.2,.8,.2,1),
    top .28s cubic-bezier(.2,.8,.2,1),
    transform .15s ease;

    box-shadow:
    inset 0 3px 4px rgba(255,255,255,.55),
    inset 0 -5px 7px rgba(0,0,0,.25),
    0 4px 9px rgba(0,0,0,.5);
}

.piece.red{
    background:
    radial-gradient(
        circle at 30% 25%,
        #ff8a80,
        #e53935 55%,
        #9f1717
    );
}

.piece.green{
    background:
    radial-gradient(
        circle at 30% 25%,
        #9affba,
        #25bd60 55%,
        #087a35
    );
}

.piece.blue{
    background:
    radial-gradient(
        circle at 30% 25%,
        #9bd7ff,
        #258fdf 55%,
        #10548c
    );
}

.piece.yellow{
    background:
    radial-gradient(
        circle at 30% 25%,
        #fffbd0,
        #ffd52e 55%,
        #c18400
    );
}

.piece.selectable{
    animation:pieceGlow 1s infinite;
}

@keyframes pieceGlow{

    0%{
        transform:scale(1);
        box-shadow:0 0 0 rgba(255,193,7,0);
    }

    50%{
        transform:scale(1.18);
        box-shadow:
        0 0 0 3px rgba(255,255,255,.7),
        0 0 20px rgba(255,193,7,.95);
    }

    100%{
        transform:scale(1);
    }

}

.piece.selected{
    transform:scale(1.25);
}

/* کنترل */

.panel{
    margin-top:14px;
    padding:15px;

    background:
    linear-gradient(
        145deg,
        #1b1710,
        #100e0a
    );

    border:
    1px solid rgba(255,193,7,.28);

    border-radius:20px;

    box-shadow:
    0 10px 30px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.04);
}

.turn{
    text-align:center;
    color:#9d927e;
    font-size:12px;
    margin-bottom:10px;
}

.turn strong{
    color:#ffd54f;
    font-size:14px;
}

.dice{
    width:76px;
    height:76px;
    margin:0 auto 12px;

    border-radius:19px;

    background:
    linear-gradient(
        145deg,
        #fff,
        #dedbd2
    );

    color:#17130c;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:40px;

    box-shadow:
    0 7px 18px rgba(0,0,0,.5),
    inset 0 2px 3px rgba(255,255,255,.9);

    border:1px solid #aaa;
}

.roll-button{
    width:100%;
    border:0;
    border-radius:14px;
    padding:15px;

    background:
    linear-gradient(
        135deg,
        #ffe082,
        #ffc107 50%,
        #e09b00
    );

    color:#211700;
    font-size:17px;
    font-weight:900;
    cursor:pointer;

    box-shadow:
    0 5px 15px rgba(255,193,7,.2),
    inset 0 1px 0 rgba(255,255,255,.6);
}

.roll-button:active{
    transform:translateY(2px) scale(.98);
}

.roll-button:disabled{
    opacity:.4;
}

.status{
    text-align:center;
    color:#a99a80;
    font-size:12px;
    margin-top:10px;
    min-height:18px;
}

/* بازیکنان */

.players{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-top:13px;
}

.player{
    padding:9px 3px;
    text-align:center;
    background:#0d0c09;
    border-radius:11px;
    font-size:10px;
    border:1px solid #29231a;
    transition:.2s;
}

.player.red{
    border-bottom:3px solid #e53935;
}

.player.green{
    border-bottom:3px solid #25bd60;
}

.player.blue{
    border-bottom:3px solid #258fdf;
}

.player.yellow{
    border-bottom:3px solid #ffd52e;
}

.player.active{
    background:#211b0d;
    transform:translateY(-2px);

    box-shadow:
    0 0 0 1px rgba(255,193,7,.45),
    0 5px 14px rgba(255,193,7,.08);
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-top:9px;
}

.stat{
    background:#0d0c09;
    border:1px solid #29231a;
    border-radius:11px;
    padding:9px;
    text-align:center;
}

.stat-title{
    color:#716957;
    font-size:10px;
}

.stat-value{
    color:#f5c84b;
    font-size:17px;
    font-weight:900;
    margin-top:4px;
}

/* مودال برد */

.win-modal{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.82);

    backdrop-filter:blur(8px);

    z-index:100;

    display:none;

    align-items:center;
    justify-content:center;
}

.win-box{
    width:88%;
    max-width:370px;

    padding:30px 24px;

    text-align:center;

    border-radius:24px;

    background:
    linear-gradient(
        145deg,
        #241d0d,
        #100e09
    );

    border:1px solid #e8b42b;

    box-shadow:
    0 20px 70px rgba(0,0,0,.7),
    0 0 35px rgba(255,193,7,.15);
}

.win-box h2{
    color:#ffd54f;
    font-size:25px;
    margin-bottom:9px;
}

.win-box p{
    color:#a99a80;
    font-size:13px;
}

.restart{
    width:100%;
    margin-top:20px;
    border:0;
    border-radius:13px;
    padding:14px;

    background:
    linear-gradient(
        135deg,
        #ffe082,
        #ffc107,
        #db9800
    );

    color:#211700;
    font-size:15px;
    font-weight:900;
}

@media(max-width:480px){

    .app{
        padding:7px;
    }

    .header h1{
        font-size:25px;
    }

    .board{
        border-radius:21px;
    }

    .panel{
        border-radius:17px;
        padding:12px;
    }

    .dice{
        width:68px;
        height:68px;
        font-size:34px;
    }

}

</style>

</head>

<body>

<div class="app">

    <div class="header">

        <h1>🐝🍯 عسل منچ</h1>

        <p>
            منچ آنلاین عسل چت
        </p>

    </div>


    <!-- تخته -->

    <div class="board" id="board">


        <!-- خانه قرمز -->

        <div class="home red">

            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>

        </div>


        <!-- خانه سبز -->

        <div class="home green">

            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>

        </div>


        <!-- خانه آبی -->

        <div class="home blue">

            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>

        </div>


        <!-- خانه زرد -->

        <div class="home yellow">

            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>

        </div>


        <!-- مسیر -->

        <div
            class="track"
            id="track"
        ></div>


        <!-- مرکز -->

        <div class="center"></div>


    </div>


    <!-- پنل بازی -->

    <div class="panel">


        <div class="turn">

            نوبت:

            <strong id="turn">
                🔴 قرمز
            </strong>

        </div>


        <div
            class="dice"
            id="dice"
        >
            🎲
        </div>


        <button
            class="roll-button"
            id="rollButton"
            onclick="rollDice()"
        >
            🎲 انداختن تاس
        </button>


        <div
            class="status"
            id="status"
        >
            🎲 برای شروع تاس بینداز
        </div>


        <!-- بازیکنان -->

        <div class="players">


            <div
                class="player red active"
                id="player-red"
            >
                🔴 قرمز
            </div>


            <div
                class="player green"
                id="player-green"
            >
                🟢 سبز
            </div>


            <div
                class="player blue"
                id="player-blue"
            >
                🔵 آبی
            </div>


            <div
                class="player yellow"
                id="player-yellow"
            >
                🟡 زرد
            </div>


        </div>


        <!-- آمار -->

        <div class="stats">


            <div class="stat">

                <div class="stat-title">
                    حرکت
                </div>

                <div
                    class="stat-value"
                    id="moveCount"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    نوبت
                </div>

                <div
                    class="stat-value"
                    id="turnNumber"
                >
                    1
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    برد
                </div>

                <div
                    class="stat-value"
                    id="winCount"
                >
                    0
                </div>

            </div>


        </div>


    </div>


</div>


<!-- پنجره برنده -->

<div
    class="win-modal"
    id="winModal"
>

    <div class="win-box">

        <h2 id="winnerText">
            🏆 برنده شد!
        </h2>

        <p>
            تبریک! بازی با موفقیت به پایان رسید.
        </p>

        <button
            class="restart"
            onclick="restartGame()"
        >
            🔄 بازی دوباره
        </button>

    </div>

    </div>

    <script>

/* =========================================
   عسل منچ — GAME ENGINE
========================================= */

const COLORS = [
    "red",
    "green",
    "blue",
    "yellow"
];

const PLAYER_NAMES = [
    "🔴 قرمز",
    "🟢 سبز",
    "🔵 آبی",
    "🟡 زرد"
];

const DICE_FACES = [
    "⚀",
    "⚁",
    "⚂",
    "⚃",
    "⚄",
    "⚅"
];


/* =========================================
   وضعیت بازی
========================================= */

let currentPlayer = 0;

let diceValue = 0;

let waitingForPiece = false;

let moveCount = 0;

let turnNumber = 1;

let gameFinished = false;


/* وضعیت مهره‌ها */

const pieces = {

    red: [-1,-1,-1,-1],

    green: [-1,-1,-1,-1],

    blue: [-1,-1,-1,-1],

    yellow: [-1,-1,-1,-1]

};


/* =========================================
   مسیر بازی
========================================= */

const path = [

    {x:40,y:5},
    {x:40,y:10},
    {x:40,y:15},

    {x:35,y:20},
    {x:30,y:20},
    {x:25,y:20},

    {x:20,y:25},
    {x:20,y:30},
    {x:20,y:35},

    {x:15,y:40},
    {x:10,y:40},
    {x:5,y:40},

    {x:5,y:45},
    {x:5,y:50},
    {x:5,y:55},

    {x:10,y:60},
    {x:15,y:60},
    {x:20,y:60},

    {x:20,y:65},
    {x:20,y:70},
    {x:20,y:75},

    {x:25,y:80},
    {x:30,y:80},
    {x:35,y:80},

    {x:40,y:85},
    {x:40,y:90},
    {x:40,y:95},

    {x:45,y:95},
    {x:50,y:95},
    {x:55,y:95},

    {x:60,y:90},
    {x:60,y:85},
    {x:60,y:80},

    {x:65,y:80},
    {x:70,y:80},
    {x:75,y:80},

    {x:80,y:75},
    {x:80,y:70},
    {x:80,y:65},

    {x:85,y:60},
    {x:90,y:60},
    {x:95,y:60},

    {x:95,y:55},
    {x:95,y:50},
    {x:95,y:45},

    {x:90,y:40},
    {x:85,y:40},
    {x:80,y:40},

    {x:80,y:35},
    {x:80,y:30},
    {x:80,y:25},

    {x:75,y:20},
    {x:70,y:20},
    {x:65,y:20},

    {x:60,y:15},
    {x:60,y:10},
    {x:60,y:5},

    {x:55,y:5},
    {x:50,y:5},
    {x:45,y:5}

];


/* =========================================
   نقطه شروع هر رنگ
========================================= */

const startIndex = {

    red:0,

    green:14,

    blue:42,

    yellow:28

};


/* =========================================
   خانه‌های امن
========================================= */

const safePositions = [

    0,
    8,
    13,
    21,
    26,
    34,
    39,
    47

];


/* =========================================
   خانه مهره‌ها
========================================= */

const homePositions = {

    red:[
        {x:11,y:11},
        {x:23,y:11},
        {x:11,y:23},
        {x:23,y:23}
    ],

    green:[
        {x:77,y:11},
        {x:65,y:11},
        {x:77,y:23},
        {x:65,y:23}
    ],

    blue:[
        {x:11,y:77},
        {x:23,y:77},
        {x:11,y:65},
        {x:23,y:65}
    ],

    yellow:[
        {x:77,y:77},
        {x:65,y:77},
        {x:77,y:65},
        {x:65,y:65}
    ]

};


/* =========================================
   ساخت مسیر
========================================= */

function createTrack(){

    const track =
        document.getElementById("track");


    if(!track){

        return;

    }


    track.innerHTML = "";


    path.forEach(
        function(position,index){

            const cell =
                document.createElement("div");


            cell.className =
                "cell";


            const left =
                (position.x - 20) / 60 * 100;


            const top =
                (position.y - 20) / 60 * 100;


            cell.style.left =
                left + "%";


            cell.style.top =
                top + "%";


            cell.dataset.index =
                index;


            if(
                safePositions.includes(index)
            ){

                cell.classList.add("safe");

            }


            track.appendChild(cell);

        }
    );

}


/* =========================================
   ساخت مهره‌ها
========================================= */

function createPieces(){

    const board =
        document.getElementById("board");


    document
        .querySelectorAll(".piece")
        .forEach(
            function(piece){

                piece.remove();

            }
        );


    COLORS.forEach(
        function(color){

            for(
                let i = 0;
                i < 4;
                i++
            ){

                const piece =
                    document.createElement("div");


                piece.className =
                    "piece " + color;


                piece.id =
                    "piece-" +
                    color +
                    "-" +
                    i;


                piece.dataset.color =
                    color;


                piece.dataset.number =
                    i;


                piece.addEventListener(
                    "click",
                    function(){

                        selectPiece(
                            color,
                            i
                        );

                    }
                );


                board.appendChild(piece);


                positionPieceHome(
                    piece,
                    color,
                    i
                );

            }

        }
    );

}


/* =========================================
   قرار دادن مهره در خانه
========================================= */

function positionPieceHome(
    piece,
    color,
    number
){

    const position =
        homePositions[color][number];


    piece.style.left =
        position.x + "%";


    piece.style.top =
        position.y + "%";

}


/* =========================================
   قرار دادن مهره روی مسیر
========================================= */

function positionPieceOnPath(
    piece,
    color,
    step
){

    const start =
        startIndex[color];


    const pathIndex =
        (start + step)
        % path.length;


    const position =
        path[pathIndex];


    piece.style.left =
        (position.x - 3.5) + "%";


    piece.style.top =
        (position.y - 3.5) + "%";

}


/* =========================================
   تاس
========================================= */

function rollDice(){

    if(gameFinished){

        return;

    }


    if(waitingForPiece){

        return;

    }


    diceValue =
        Math.floor(
            Math.random() * 6
        ) + 1;


    const dice =
        document.getElementById("dice");


    dice.textContent =
        DICE_FACES[
            diceValue - 1
        ];


    const color =
        COLORS[currentPlayer];


    const movable =
        getMovablePieces(color);


    if(movable.length === 0){

        document
            .getElementById("status")
            .textContent =
            "❌ مهره قابل حرکت نداری";


        setTimeout(
            function(){

                nextTurn();

            },
            1000
        );


        return;

    }


    waitingForPiece = true;


    movable.forEach(
        function(index){

            highlightPiece(
                color,
                index
            );

        }
    );


    if(movable.length === 1){

        document
            .getElementById("status")
            .textContent =
            "👆 مهره را انتخاب کن";

    }else{

        document
            .getElementById("status")
            .textContent =
            "👆 یکی از مهره‌ها را انتخاب کن";

    }

}


/* =========================================
   مهره‌های قابل حرکت
========================================= */

function getMovablePieces(color){

    const result = [];


    for(
        let i = 0;
        i < 4;
        i++
    ){

        const position =
            pieces[color][i];


        /* مهره داخل خانه */

        if(position === -1){

            if(diceValue === 6){

                result.push(i);

            }

            continue;

        }


        /* مهره روی مسیر */

        if(
            position + diceValue
            <= path.length
        ){

            result.push(i);

        }

    }


    return result;

}


/* =========================================
   هایلایت مهره
========================================= */

function highlightPiece(
    color,
    number
){

    const piece =
        document.getElementById(
            "piece-" +
            color +
            "-" +
            number
        );


    if(piece){

        piece.classList.add(
            "selectable"
        );

    }

}


/* =========================================
   پاک کردن هایلایت
========================================= */

function clearHighlights(){

    document
        .querySelectorAll(".piece")
        .forEach(
            function(piece){

                piece.classList.remove(
                    "selectable"
                );

                piece.classList.remove(
                    "selected"
                );

            }
        );

}


/* =========================================
   انتخاب مهره
========================================= */

function selectPiece(
    color,
    number
){

    if(gameFinished){

        return;

    }


    if(!waitingForPiece){

        return;

    }


    if(
        COLORS[currentPlayer]
        !== color
    ){

        return;

    }


    const movable =
        getMovablePieces(color);


    if(
        !movable.includes(number)
    ){

        return;

    }


    const piece =
        document.getElementById(
            "piece-" +
            color +
            "-" +
            number
        );


    piece.classList.add(
        "selected"
    );


    movePiece(
        color,
        number
    );

}


/* =========================================
   حرکت مهره
========================================= */

function movePiece(
    color,
    number
){

    const oldPosition =
        pieces[color][number];


    let newPosition;


    if(oldPosition === -1){

        newPosition = 0;

    }else{

        newPosition =
            oldPosition +
            diceValue;

    }


    if(
        newPosition > path.length
    ){

        waitingForPiece = false;

        clearHighlights();

        document
            .getElementById("status")
            .textContent =
            "❌ این مهره نمی‌تواند حرکت کند";

        return;

    }


    pieces[color][number] =
        newPosition;


    const piece =
        document.getElementById(
            "piece-" +
            color +
            "-" +
            number
        );


    if(
        newPosition === path.length
    ){

        piece.style.left =
            "46.5%";

        piece.style.top =
            "46.5%";

    }else{

        positionPieceOnPath(
            piece,
            color,
            newPosition
        );

    }


    moveCount++;


    document
        .getElementById("moveCount")
        .textContent =
        moveCount;


    waitingForPiece = false;


    clearHighlights();


    captureOpponent(
        color,
        newPosition
    );


    if(
        checkWinner(color)
    ){

        finishGame(
            color
        );

        return;

    }


    if(diceValue === 6){

        document
            .getElementById("status")
            .textContent =
            "🎉 شش آوردی! دوباره تاس بینداز";

        diceValue = 0;

        return;

    }


    diceValue = 0;


    nextTurn();

}


/* =========================================
   زدن مهره حریف
========================================= */

function captureOpponent(
    color,
    position
){

    const realIndex =
        (
            startIndex[color] +
            position
        )
        % path.length;


    if(
        safePositions.includes(
            realIndex
        )
    ){

        return;

    }


    COLORS.forEach(
        function(otherColor){

            if(
                otherColor === color
            ){

                return;

            }


            for(
                let i = 0;
                i < 4;
                i++
            ){

                const otherPosition =
                    pieces[otherColor][i];


                if(
                    otherPosition === -1
                ){

                    continue;

                }


                const otherIndex =
                    (
                        startIndex[otherColor] +
                        otherPosition
                    )
                    % path.length;


                if(
                    otherIndex ===
                    realIndex
                ){

                    pieces[otherColor][i] =
                        -1;


                    const opponentPiece =
                        document.getElementById(
                            "piece-" +
                            otherColor +
                            "-" +
                            i
                        );


                    positionPieceHome(
                        opponentPiece,
                        otherColor,
                        i
                    );


                    document
                        .getElementById("status")
                        .textContent =
                        "💥 مهره حریف زده شد!";

                }

            }

        }
    );

}


/* =========================================
   نوبت بعدی
========================================= */

function nextTurn(){

    if(gameFinished){

        return;

    }


    currentPlayer++;


    if(
        currentPlayer >=
        COLORS.length
    ){

        currentPlayer = 0;

    }


    turnNumber++;


    document
        .getElementById("turnNumber")
        .textContent =
        turnNumber;


    updateTurnUI();


    document
        .getElementById("status")
        .textContent =
        "🎲 نوبت " +
        PLAYER_NAMES[currentPlayer];


    document
        .getElementById("dice")
        .textContent =
        "🎲";


    diceValue = 0;

}


/* =========================================
   نمایش نوبت
========================================= */

function updateTurnUI(){

    document
        .getElementById("turn")
        .textContent =
        PLAYER_NAMES[currentPlayer];


    COLORS.forEach(
        function(color){

            const player =
                document.getElementById(
                    "player-" +
                    color
                );


            if(player){

                player.classList.remove(
                    "active"
                );

            }

        }
    );


    const active =
        document.getElementById(
            "player-" +
            COLORS[currentPlayer]
        );


    if(active){

        active.classList.add(
            "active"
        );

    }

}


/* =========================================
   بررسی برنده
========================================= */

function checkWinner(color){

    let finished = 0;


    for(
        let i = 0;
        i < 4;
        i++
    ){

        if(
            pieces[color][i]
            >= path.length
        ){

            finished++;

        }

    }


    return finished === 4;

}


/* =========================================
   پایان بازی
========================================= */

function finishGame(color){

    gameFinished = true;


    const name =
        PLAYER_NAMES[
            COLORS.indexOf(color)
        ];


    document
        .getElementById("winnerText")
        .textContent =
        "🏆 " +
        name +
        " برنده شد!";


    document
        .getElementById("winModal")
        .style.display =
        "flex";


    saveWin();

}


/* =========================================
   ذخیره برد
========================================= */

function saveWin(){

    const key =
        "asalLudoWins";


    let wins =
        Number(
            localStorage.getItem(key)
        ) || 0;


    wins++;


    localStorage.setItem(
        key,
        wins
    );


    document
        .getElementById("winCount")
        .textContent =
        wins;

}


/* =========================================
   شروع بازی
========================================= */

function initGame(){

    createTrack();

    createPieces();

    updateTurnUI();


    const wins =
        Number(
            localStorage.getItem(
                "asalLudoWins"
            )
        ) || 0;


    document
        .getElementById("winCount")
        .textContent =
        wins;


    document
        .getElementById("status")
        .textContent =
        "🎲 برای شروع تاس بینداز";

}


/* اجرای بازی */

initGame();

    </script>

    <script>

/* =========================================
   ادامه عسل منچ
   ذخیره و بازیابی اطلاعات
========================================= */


/* =========================================
   ذخیره وضعیت بازی
========================================= */

function saveGame(){

    const gameData = {

        currentPlayer:
            currentPlayer,

        moveCount:
            moveCount,

        turnNumber:
            turnNumber,

        pieces:
            pieces,

        gameFinished:
            gameFinished

    };


    localStorage.setItem(
        "asalLudoGame",
        JSON.stringify(gameData)
    );

}


/* =========================================
   بازیابی وضعیت
========================================= */

function loadGame(){

    const saved =
        localStorage.getItem(
            "asalLudoGame"
        );


    if(!saved){

        return false;

    }


    try{

        const data =
            JSON.parse(saved);


        if(
            !data ||
            !data.pieces
        ){

            return false;

        }


        currentPlayer =
            data.currentPlayer || 0;


        moveCount =
            data.moveCount || 0;


        turnNumber =
            data.turnNumber || 1;


        gameFinished =
            data.gameFinished || false;


        COLORS.forEach(
            function(color){

                if(
                    Array.isArray(
                        data.pieces[color]
                    )
                ){

                    pieces[color] =
                        data.pieces[color];

                }

            }
        );


        document
            .getElementById("moveCount")
            .textContent =
            moveCount;


        document
            .getElementById("turnNumber")
            .textContent =
            turnNumber;


        createPieces();


        updateTurnUI();


        if(gameFinished){

            document
                .getElementById("status")
                .textContent =
                "🏆 بازی قبلی تمام شده است.";

        }else{

            document
                .getElementById("status")
                .textContent =
                "💾 بازی قبلی بازیابی شد.";

        }


        return true;

    }catch(error){

        console.log(
            "خطا در بازیابی:",
            error
        );


        return false;

    }

}


/* =========================================
   ذخیره خودکار
========================================= */

setInterval(
    function(){

        if(!gameFinished){

            saveGame();

        }

    },
    2000
);


/* =========================================
   ذخیره بعد از حرکت
========================================= */

const originalMovePiece =
    movePiece;


/* =========================================
   بازی جدید
========================================= */

function restartGame(){

    document
        .getElementById("winModal")
        .style.display =
        "none";


    currentPlayer = 0;

    diceValue = 0;

    waitingForPiece = false;

    moveCount = 0;

    turnNumber = 1;

    gameFinished = false;


    COLORS.forEach(
        function(color){

            pieces[color] =
                [-1,-1,-1,-1];

        }
    );


    localStorage.removeItem(
        "asalLudoGame"
    );


    document
        .getElementById("moveCount")
        .textContent =
        "0";


    document
        .getElementById("turnNumber")
        .textContent =
        "1";


    document
        .getElementById("dice")
        .textContent =
        "🎲";


    document
        .getElementById("status")
        .textContent =
        "🎲 برای شروع تاس بینداز";


    createPieces();

    updateTurnUI();

}


/* =========================================
   بستن مودال با کلیک بیرون
========================================= */

document
    .getElementById("winModal")
    .addEventListener(
        "click",
        function(event){

            if(
                event.target ===
                this
            ){

                this.style.display =
                    "none";

            }

        }
    );


/* =========================================
   دکمه ESC
========================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            document
                .getElementById(
                    "winModal"
                )
                .style.display =
                "none";

        }

    }
);


/* =========================================
   جلوگیری از انتخاب ناخواسته
========================================= */

document.addEventListener(
    "dragstart",
    function(event){

        event.preventDefault();

    }
);


/* =========================================
   شروع نهایی
========================================= */

loadGame();


/* =========================================
   ذخیره قبل از خروج
========================================= */

window.addEventListener(
    "beforeunload",
    function(){

        saveGame();

    }
);

</script>
