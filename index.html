<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عسل چت | ورود به چت روم</title>

<meta name="description" content="عسل چت، چت روم فارسی">
<meta name="theme-color" content="#17120b">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Tahoma, Arial, sans-serif;
    background:
        radial-gradient(circle at 50% 15%, rgba(255,190,60,.16), transparent 35%),
        linear-gradient(145deg,#090705,#171008 45%,#080604);
    color:#fff;
    overflow-x:hidden;
}

/* پس زمینه */
body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
        radial-gradient(circle, rgba(255,193,7,.08) 1px, transparent 1px);
    background-size:28px 28px;
    opacity:.35;
}

/* صفحه اصلی */
.page{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px 15px;
}

/* کارت ورود */
.login-card{
    width:100%;
    max-width:430px;
    position:relative;
    padding:32px 25px 28px;
    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(43,31,16,.96),
            rgba(16,12,8,.98)
        );

    border:1px solid rgba(255,193,7,.28);

    box-shadow:
        0 30px 80px rgba(0,0,0,.65),
        inset 0 1px 0 rgba(255,255,255,.05);

    backdrop-filter:blur(15px);
}

/* درخشش بالای کارت */
.login-card::before{
    content:"";
    position:absolute;
    top:-1px;
    left:15%;
    right:15%;
    height:2px;
    background:linear-gradient(
        90deg,
        transparent,
        #ffc107,
        #ffe082,
        #ffc107,
        transparent
    );
    border-radius:100%;
}

/* لوگو */
.logo{
    width:82px;
    height:82px;
    margin:0 auto 16px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ffe082,
            #ffca28 40%,
            #b87500 100%
        );

    border:3px solid rgba(255,255,255,.15);

    box-shadow:
        0 0 35px rgba(255,193,7,.28),
        inset 0 3px 8px rgba(255,255,255,.3);

    font-size:43px;
}

/* عنوان */
.title{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#ffd54f;
    letter-spacing:.3px;
}

.subtitle{
    text-align:center;
    margin-top:8px;
    margin-bottom:27px;

    color:#b9b0a3;
    font-size:13px;
}

/* عنوان فیلد */
.field-label{
    display:block;
    margin:0 4px 9px;

    color:#ded5c7;
    font-size:13px;
}

/* ورودی */
.input{
    width:100%;
    height:52px;

    padding:0 17px;

    border-radius:15px;
    border:1px solid rgba(255,193,7,.18);

    background:rgba(255,255,255,.055);

    color:#fff;
    outline:none;

    font-family:Tahoma,Arial,sans-serif;
    font-size:15px;

    transition:.25s;
}

.input::placeholder{
    color:#82796d;
}

.input:focus{
    border-color:#ffc107;

    background:rgba(255,193,7,.055);

    box-shadow:
        0 0 0 3px rgba(255,193,7,.08),
        0 0 25px rgba(255,193,7,.08);
}

/* فاصله */
.field{
    margin-bottom:19px;
}

/* کپچا */
.captcha-box{
    display:flex;
    gap:10px;
    align-items:center;
}

.captcha-image{
    height:52px;
    min-width:125px;

    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        repeating-linear-gradient(
            25deg,
            #332510 0px,
            #332510 3px,
            #5b431d 3px,
            #5b431d 6px
        );

    border:1px solid rgba(255,193,7,.22);

    color:#ffe082;
    font-weight:bold;
    letter-spacing:4px;
    font-size:18px;

    user-select:none;
}

/* جنسیت */
.select{
    width:100%;
    height:52px;

    padding:0 15px;

    border-radius:15px;

    border:1px solid rgba(255,193,7,.18);

    background:#1c140b;
    color:#fff;

    outline:none;

    font-family:Tahoma,Arial,sans-serif;
    font-size:14px;
}

.select:focus{
    border-color:#ffc107;
}

/* دکمه */
.login-btn{
    width:100%;
    height:55px;

    margin-top:5px;

    border:0;
    border-radius:17px;

    background:
        linear-gradient(
            135deg,
            #ffe082,
            #ffc107 45%,
            #d88b00
        );

    color:#241600;

    font-family:Tahoma,Arial,sans-serif;
    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 10px 28px rgba(255,193,7,.18);

    transition:.25s;
}

.login-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 14px 35px rgba(255,193,7,.28);
}

.login-btn:active{
    transform:translateY(0);
}

/* پیام */
.message{
    min-height:22px;
    margin-top:15px;

    text-align:center;

    color:#ffcf66;
    font-size:12px;
}

/* قوانین */
.rules{
    margin-top:24px;
    padding:16px;

    border-radius:16px;

    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.06);

    color:#91887c;
    font-size:10px;
    line-height:2;
    text-align:right;
}

.rules strong{
    color:#d6c8b2;
    font-size:11px;
}

/* پایین کارت */
.footer{
    margin-top:20px;

    text-align:center;

    color:#665d52;
    font-size:10px;
}

.footer span{
    color:#b88618;
}

/* موبایل */
@media(max-width:420px){

    .page{
        padding:15px 10px;
    }

    .login-card{
        padding:28px 18px 22px;
        border-radius:24px;
    }

    .logo{
        width:72px;
        height:72px;
        font-size:37px;
    }

    .title{
        font-size:25px;
    }

    .captcha-box{
        flex-direction:column;
    }

    .captcha-image{
        width:100%;
    }

}
</style>
</head>

<body>

<div class="page">

    <main class="login-card">

        <div class="logo">🍯</div>

        <h1 class="title">عسل چت</h1>

        <p class="subtitle">
            به جمع دوستان عسل چت خوش آمدید
        </p>

        <form id="loginForm">

            <!-- نام کاربر -->
            <div class="field">

                <label class="field-label">
                    نام شما
                </label>

                <input
                    id="username"
                    class="input"
                    type="text"
                    maxlength="20"
                    autocomplete="off"
                    placeholder="نام خود را وارد کنید"
                    required
                >

            </div>


            <!-- کپچا -->
            <div class="field">

                <label class="field-label">
                    کد امنیتی
                </label>

                <div class="captcha-box">

                    <div
                        class="captcha-image"
                        id="captchaCode"
                    ></div>

                    <input
                        id="captchaInput"
                        class="input"
                        type="text"
                        inputmode="numeric"
                        maxlength="4"
                        autocomplete="off"
                        placeholder="کد تصویر"
                        required
                    >

                </div>

            </div>


            <!-- جنسیت -->
            <div class="field">

                <label class="field-label">
                    جنسیت
                </label>

                <select
                    id="gender"
                    class="select"
                >
                    <option value="male">
                        پسر
                    </option>

                    <option value="female">
                        دختر
                    </option>
                </select>

            </div>


            <!-- دکمه -->
            <button
                id="loginButton"
                class="login-btn"
                type="submit"
            >
                ورود به عسل چت
            </button>

            <div
                id="message"
                class="message"
            ></div>

        </form>


        <!-- قوانین -->
        <div class="rules">

            <strong>
                قوانین ورود به عسل چت
            </strong>

            <br>

            • استفاده از نام‌های نامناسب ممنوع است.

            <br>

            • احترام به سایر کاربران الزامی است.

            <br>

            • ارسال محتوای نامناسب یا مزاحمت برای کاربران ممنوع است.

            <br>

            • رعایت قوانین سایت و مقررات مربوط الزامی است.

        </div>


        <div class="footer">
            © 2026
            <span>عسل چت</span>
            — تمامی حقوق محفوظ است
        </div>

    </main>

</div>


<script>

/* =========================
   CAPTCHA
========================= */

let captchaValue = "";


function generateCaptcha(){

    captchaValue =
        Math.floor(
            1000 + Math.random() * 9000
        ).toString();

    document.getElementById("captchaCode")
        .textContent = captchaValue;

}


generateCaptcha();


/* =========================
   ورود
========================= */

const loginForm =
    document.getElementById("loginForm");

const message =
    document.getElementById("message");


loginForm.addEventListener(
    "submit",
    function(event){

        event.preventDefault();

        const username =
            document.getElementById("username")
            .value
            .trim();

        const captcha =
            document.getElementById("captchaInput")
            .value
            .trim();


        /* بررسی نام */

        if(username.length < 2){

            message.textContent =
                "لطفاً یک نام معتبر وارد کنید.";

            return;

        }


        /* بررسی کپچا */

        if(captcha !== captchaValue){

            message.textContent =
                "کد امنیتی اشتباه است.";

            generateCaptcha();

            document.getElementById("captchaInput")
                .value = "";

            return;

        }


        /* ذخیره موقت نام */

        localStorage.setItem(
            "asalchat_username",
            username
        );


        localStorage.setItem(
            "asalchat_gender",
            document.getElementById("gender").value
        );


        message.textContent =
            "ورود با موفقیت انجام شد.";


        /*
          فعلاً اینجا فقط ورود آزمایشی است.
          در مرحله بعد همین قسمت را
          به Firebase و صفحه چت وصل می‌کنیم.
        */

    }
);

</script>

</body>
</html>
