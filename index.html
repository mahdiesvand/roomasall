<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#080706"
>

<title>عسل گیم | دنیای بازی</title>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


html,
body{
    width:100%;
    min-height:100%;
}


body{

    min-height:100vh;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    color:#fff;

    background:#070605;

    overflow-x:hidden;

}


/* =====================================================
   BACKGROUND
===================================================== */

.background{

    position:fixed;

    inset:0;

    z-index:-10;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 50% 45%,
            rgba(255,193,7,.13),
            transparent 32%
        ),

        radial-gradient(
            circle at 10% 20%,
            rgba(255,150,0,.08),
            transparent 25%
        ),

        radial-gradient(
            circle at 90% 80%,
            rgba(255,193,7,.06),
            transparent 25%
        ),

        #070605;

}


/* نور مرکزی */

.background::after{

    content:"";

    position:absolute;

    inset:0;

    background:
        radial-gradient(
            ellipse at center,
            transparent 20%,
            rgba(0,0,0,.72) 85%
        );

}


/* =====================================================
   GAME BACKGROUND ART
===================================================== */

.game-art{

    position:absolute;

    left:50%;

    top:50%;

    width:720px;

    height:720px;

    transform:
        translate(-50%,-50%)
        rotate(-4deg);

    opacity:.12;

    filter:
        blur(1.5px)
        saturate(.65);

}


/* صفحه منچ */

.ludo{

    position:absolute;

    left:50%;

    top:50%;

    width:430px;

    height:430px;

    transform:
        translate(-50%,-50%)
        rotate(2deg);

    border-radius:38px;

    background:

        conic-gradient(
            #d83b35 0 25%,
            #35a85c 0 50%,
            #e3b82f 0 75%,
            #3785c4 0 100%
        );

    border:10px solid #c08a1b;

    box-shadow:
        0 0 60px rgba(255,193,7,.18),
        0 30px 80px rgba(0,0,0,.7);

}


.ludo::before{

    content:"";

    position:absolute;

    inset:18%;

    border-radius:50%;

    background:

        repeating-conic-gradient(
            rgba(255,255,255,.7) 0deg 7deg,
            transparent 7deg 15deg
        );

    opacity:.28;

}


.ludo::after{

    content:"";

    position:absolute;

    left:35%;

    top:35%;

    width:30%;

    height:30%;

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            #ffd54f,
            #b87508
        );

    box-shadow:
        0 0 30px rgba(255,193,7,.3);

}


/* =====================================================
   GAME ICONS
===================================================== */

.icon{

    position:absolute;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:55px;

    opacity:.6;

    filter:
        blur(.3px)
        grayscale(.25);

    text-shadow:
        0 10px 25px rgba(0,0,0,.8);

}


.card1{
    top:7%;
    left:9%;
    transform:rotate(-18deg);
}

.card2{
    bottom:8%;
    right:8%;
    transform:rotate(17deg);
}

.ps{
    top:13%;
    right:5%;
    transform:rotate(12deg);
}

.dice{
    bottom:11%;
    left:8%;
    transform:rotate(-15deg);
}

.chess{
    top:49%;
    left:2%;
    font-size:45px;
}

.controller{
    bottom:38%;
    right:2%;
    font-size:50px;
}

.cards{
    top:30%;
    right:2%;
    font-size:42px;
}

.target{
    bottom:4%;
    left:45%;
    font-size:45px;
}


/* =====================================================
   FLOATING PARTICLES
===================================================== */

.particle{

    position:absolute;

    width:4px;

    height:4px;

    border-radius:50%;

    background:#ffd54f;

    opacity:.45;

    box-shadow:
        0 0 12px #ffc107;

    animation:
        float 7s infinite ease-in-out;

}


.p1{
    left:14%;
    top:30%;
}

.p2{
    left:82%;
    top:25%;
    animation-delay:2s;
}

.p3{
    left:22%;
    top:75%;
    animation-delay:4s;
}

.p4{
    left:75%;
    top:70%;
    animation-delay:1s;
}


@keyframes float{

    0%,
    100%{
        transform:translateY(0);
        opacity:.25;
    }

    50%{
        transform:translateY(-25px);
        opacity:.7;
    }

}


/* =====================================================
   MAIN
===================================================== */

.page{

    min-height:100vh;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    padding:
        25px
        16px;

}


/* =====================================================
   BRAND
===================================================== */

.brand{

    text-align:center;

    margin-bottom:24px;

}


.logo{

    width:78px;

    height:78px;

    margin:
        0 auto
        14px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:25px;

    font-size:40px;

    background:

        linear-gradient(
            145deg,
            #ffe082,
            #ffc107 45%,
            #c88700
        );

    box-shadow:

        0 0 0 1px
            rgba(255,255,255,.15),

        0 12px 35px
            rgba(255,174,0,.22),

        inset 0 2px 5px
            rgba(255,255,255,.65);

}


.brand h1{

    font-size:34px;

    font-weight:900;

    letter-spacing:-1px;

    background:

        linear-gradient(
            135deg,
            #fff4bc,
            #ffd54f,
            #ffab00
        );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

}


.brand p{

    margin-top:8px;

    color:#a89c87;

    font-size:13px;

}


/* =====================================================
   LOGIN CARD
===================================================== */

.login-card{

    width:100%;

    max-width:430px;

    padding:28px;

    border-radius:28px;

    background:

        linear-gradient(
            145deg,
            rgba(32,27,19,.92),
            rgba(12,10,8,.94)
        );

    border:
        1px solid
        rgba(255,193,7,.25);

    box-shadow:

        0 30px 80px
            rgba(0,0,0,.7),

        0 0 45px
            rgba(255,193,7,.06),

        inset 0 1px 0
            rgba(255,255,255,.07);

    backdrop-filter:
        blur(18px);

}


/* خط طلایی */

.login-card::before{

    content:"";

    display:block;

    width:70px;

    height:3px;

    margin:
        -28px
        auto
        25px;

    border-radius:10px;

    background:

        linear-gradient(
            90deg,
            transparent,
            #ffc107,
            transparent
        );

}


/* =====================================================
   WELCOME
===================================================== */

.welcome{

    text-align:center;

    margin-bottom:24px;

}


.welcome h2{

    font-size:21px;

    margin-bottom:8px;

}


.welcome p{

    color:#8f8677;

    font-size:12px;

    line-height:1.8;

}


/* =====================================================
   INPUT
===================================================== */

.input-label{

    display:block;

    color:#c8bda8;

    font-size:12px;

    margin-bottom:8px;

}


.input-box{

    position:relative;

}


.input-box span{

    position:absolute;

    right:15px;

    top:50%;

    transform:
        translateY(-50%);

    font-size:18px;

}


.input{

    width:100%;

    height:56px;

    border-radius:15px;

    border:
        1px solid
        #342d20;

    outline:none;

    padding:
        0
        45px
        0
        15px;

    color:#fff;

    font-family:inherit;

    font-size:14px;

    background:
        rgba(5,5,4,.72);

    transition:.25s;

}


.input::placeholder{

    color:#625b50;

}


.input:focus{

    border-color:#d99f18;

    box-shadow:
        0 0 0 3px
        rgba(255,193,7,.08);

}


/* =====================================================
   ENTER BUTTON
===================================================== */

.enter-button{

    width:100%;

    height:58px;

    margin-top:16px;

    border:0;

    border-radius:16px;

    cursor:pointer;

    font-family:inherit;

    font-size:16px;

    font-weight:900;

    color:#211600;

    background:

        linear-gradient(
            135deg,
            #ffe082,
            #ffc107 45%,
            #e29b00
        );

    box-shadow:

        0 10px 25px
            rgba(255,174,0,.18),

        inset 0 1px 0
            rgba(255,255,255,.7);

    transition:
        transform .15s,
        box-shadow .15s;

}


.enter-button:hover{

    box-shadow:

        0 14px 32px
            rgba(255,174,0,.28),

        inset 0 1px 0
            rgba(255,255,255,.7);

}


.enter-button:active{

    transform:
        translateY(2px)
        scale(.985);

}


/* =====================================================
   FEATURES
===================================================== */

.features{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:7px;

    margin-top:18px;

}


.feature{

    padding:
        10px
        5px;

    text-align:center;

    border-radius:12px;

    background:
        rgba(255,255,255,.025);

    border:
        1px solid
        rgba(255,255,255,.045);

}


.feature-icon{

    font-size:18px;

    margin-bottom:4px;

}


.feature span{

    display:block;

    color:#756d60;

    font-size:9px;

}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    margin-top:20px;

    text-align:center;

    color:#514b42;

    font-size:10px;

}


.footer strong{

    color:#8e7441;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:480px){

    .page{

        padding:
            18px
            12px;

    }


    .game-art{

        width:600px;

        height:600px;

    }


    .ludo{

        width:360px;

        height:360px;

    }


    .icon{

        font-size:42px;

    }


    .brand h1{

        font-size:29px;

    }


    .logo{

        width:68px;

        height:68px;

        font-size:34px;

    }


    .login-card{

        padding:23px 19px;

        border-radius:24px;

    }

}


@media(max-height:700px){

    .page{

        justify-content:
            flex-start;

        padding-top:20px;

    }


    .brand{

        margin-bottom:15px;

    }


    .logo{

        width:58px;

        height:58px;

        font-size:29px;

        margin-bottom:8px;

    }


    .brand h1{

        font-size:25px;

    }


    .login-card{

        padding:20px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="background">


    <div class="game-art">


        <!-- منچ بزرگ محو -->

        <div class="ludo"></div>


        <!-- بازی‌های کوچک -->

        <div class="icon card1">
            🃏
        </div>


        <div class="icon card2">
            ♠️
        </div>


        <div class="icon ps">
            🎮
        </div>


        <div class="icon dice">
            🎲
        </div>


        <div class="icon chess">
            ♟️
        </div>


        <div class="icon controller">
            🕹️
        </div>


        <div class="icon cards">
            🂡
        </div>


        <div class="icon target">
            🎯
        </div>


    </div>


    <!-- ذرات -->

    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>


</div>



<!-- =====================================================
     PAGE
===================================================== -->

<main class="page">


    <!-- برند -->

    <div class="brand">


        <div class="logo">
            🐝
        </div>


        <h1>
            عسل گیم
        </h1>


        <p>
            دنیای بازی‌ها، یکجا
        </p>


    </div>



    <!-- کارت ورود -->

    <section class="login-card">


        <div class="welcome">

            <h2>
                🎮 خوش اومدی!
            </h2>

            <p>
                برای ورود به دنیای عسل گیم
                نام بازیکنت رو وارد کن
            </p>

        </div>



        <label
            class="input-label"
            for="playerName"
        >
            نام بازیکن
        </label>



        <div class="input-box">


            <span>
                👤
            </span>


            <input
                id="playerName"
                class="input"
                type="text"
                maxlength="20"
                autocomplete="off"
                placeholder="مثلاً Mahdi"
            >


        </div>



        <button
            class="enter-button"
            onclick="enterGame()"
        >

            ورود به عسل گیم
            <span> 🚀</span>

        </button>



        <!-- امکانات -->

        <div class="features">


            <div class="feature">

                <div class="feature-icon">
                    🎮
                </div>

                <span>
                    بازی‌های جذاب
                </span>

            </div>


            <div class="feature">

                <div class="feature-icon">
                    🏆
                </div>

                <span>
                    رکورد و امتیاز
                </span>

            </div>


            <div class="feature">

                <div class="feature-icon">
                    ⭐
                </div>

                <span>
                    امکانات PRO
                </span>

            </div>


        </div>


    </section>



    <!-- فوتر -->

    <div class="footer">

        © 2026
        <strong>
            عسل گیم
        </strong>

        •
        همه بازی‌ها در یکجا 🍯

    </div>


</main>



<script>

/* =====================================================
   ورود بازیکن
===================================================== */

function enterGame(){

    const input =
        document.getElementById(
            "playerName"
        );


    const name =
        input.value.trim();


    if(!name){

        input.focus();

        input.style.borderColor =
            "#e0a400";


        input.placeholder =
            "اول نامت رو وارد کن 😉";


        setTimeout(
            function(){

                input.style.borderColor =
                    "";

            },
            1200
        );

        return;

    }


    /* ذخیره نام */

    localStorage.setItem(
        "playerName",
        name
    );


    /* رفتن به صفحه بازی */

    window.location.href =
        "game.html";

}


/* =====================================================
   Enter روی کیبورد
===================================================== */

document
    .getElementById("playerName")
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter"
            ){

                enterGame();

            }

        }
    );


/* =====================================================
   نمایش نام قبلی
===================================================== */

window.addEventListener(
    "DOMContentLoaded",
    function(){

        const savedName =
            localStorage.getItem(
                "playerName"
            );


        if(savedName){

            document
                .getElementById(
                    "playerName"
                )
                .value =
                savedName;

        }

    }
);

</script>


</body>

</html>
