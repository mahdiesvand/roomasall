<style>

.message-box{
    display:flex;
    flex-direction:column;
}

.message-name{
    font-size:12px;
    color:#d4af37;
    margin-bottom:5px;
}

.message-time{
    font-size:10px;
    opacity:.6;
    margin-top:5px;
    text-align:left;
}

.mymsg .message-name{
    color:#111;
}

.online{
    font-size:12px;
    text-align:center;
    padding:5px;
    background:#181818;
    color:#aaa;
}

.footer{
    display:flex;
    background:#151515;
    padding:8px;
}

.footer input{
    background:#333;
    color:white;
}

.footer button{
    cursor:pointer;
}

.empty{
    text-align:center;
    opacity:.5;
    margin-top:40px;
}

</style>


<div class="online">
🟢 آنلاین
</div>


<script type="module">


import { db } from "./firebase.js";


import {
ref,
push,
onChildAdded,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";



const box=document.getElementById("messages");

const input=document.getElementById("messageInput");



let username=localStorage.getItem("username");



if(!username){

username=prompt("نام خود را وارد کنید");


if(!username){

username="کاربر";

}


localStorage.setItem("username",username);


}



const messagesRef=ref(db,"messages");




function showTime(t){


let d=new Date(t);


return d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");


}




window.sendMessage=function(){


let text=input.value.trim();



if(text=="") return;



push(messagesRef,{

name:username,

text:text,

time:Date.now()

});



input.value="";



};





input.addEventListener("keydown",function(e){


if(e.key==="Enter"){

sendMessage();

}


});





onChildAdded(messagesRef,function(snapshot){



let data=snapshot.val();



let div=document.createElement("div");



div.className="message";



if(data.name===username){

div.classList.add("mymsg");

}



div.innerHTML=`

<div class="message-name">

${data.name}

</div>


<div class="message-box">

${data.text}

</div>


<div class="message-time">

${showTime(data.time)}

</div>

`;



box.appendChild(div);



box.scrollTop=box.scrollHeight;



});



  </script>
