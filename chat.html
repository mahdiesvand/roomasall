<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0d0d">
<title>عسل چت 🍯</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080a0a;--panel:#0d1111;--panel2:#111515;--line:#332710;
  --gold:#f5b91b;--gold2:#d99300;--text:#f4f1e9;--muted:#8f918f;
  --green:#25d366;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
font-family:Tahoma,"Segoe UI",sans-serif}
button,input{font:inherit}
button{cursor:pointer;border:0}
.app{height:100dvh;display:grid;grid-template-columns:310px minmax(0,1fr) 280px;background:
radial-gradient(circle at 50% 10%,rgba(245,185,27,.06),transparent 35%),#080a0a;position:relative}
.app:before{content:"";position:absolute;left:0;right:0;top:0;height:55px;background:linear-gradient(180deg,#e9a900 0 12px,transparent 12px);opacity:.9;clip-path:polygon(0 0,100% 0,100% 25%,96% 28%,94% 13%,90% 25%,84% 18%,80% 33%,75% 20%,68% 29%,62% 15%,55% 27%,48% 17%,42% 30%,36% 20%,29% 32%,24% 14%,18% 28%,12% 16%,7% 27%,0 18%);pointer-events:none;z-index:5}
.side,.users,.chat{min-width:0;min-height:0}
.side{border:1px solid var(--line);border-radius:22px 0 0 22px;background:linear-gradient(180deg,#0d1111,#090b0b);margin:3px 0 3px 3px;display:flex;flex-direction:column;overflow:hidden}
.profile{padding:18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);margin-top:15px}
.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#292d2c;border:1px solid #555}
.profile b{font-size:16px}.status{font-size:12px;color:var(--muted);margin-top:5px}.dot{display:inline-block;width:10px;height:10px;background:var(--green);border-radius:50%;margin-left:5px;box-shadow:0 0 8px #25d366}
.menu{padding:14px}
.menuBtn{height:58px;border-radius:13px;width:100%;background:#151919;color:#ddd;border:1px solid #493716;margin-bottom:12px}
.menuBtn.active{background:linear-gradient(135deg,#ffd33e,#e7a800);color:#15120a;font-weight:bold}
.menuBtn span{margin-left:8px;font-size:21px}
.privateTitle{padding:10px 18px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-weight:bold}
.add{font-size:25px;color:var(--gold)}
.private{overflow:auto;flex:1}
.privateItem{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #171b1b}
.privateItem img{width:48px;height:48px;border-radius:50%;object-fit:cover}
.privateItem .ptext{flex:1;min-width:0}.privateItem b{display:block}.privateItem small{display:block;color:#8c8d8c;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:11px;color:#8d8d8d}
.badge{background:var(--gold);color:#17130a;border-radius:50%;min-width:22px;height:22px;display:grid;place-items:center;font-size:11px;font-weight:bold}
.bottomBtns{display:flex;gap:8px;padding:12px}.bottomBtns button{flex:1;height:50px;background:#111515;border:1px solid #222827;color:white;border-radius:12px;font-size:22px}

.chat{margin:3px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;background:#080b0b}
.topbar{height:94px;display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);background:#0c1010;margin-top:0}
.brand{font-size:28px;color:var(--gold);font-weight:bold}
.roomInfo{display:flex;align-items:center;gap:12px}
.roomIcon{width:52px;height:52px;border-radius:15px;background:#2a2110;display:grid;place-items:center;font-size:30px;color:var(--gold)}
.roomInfo b{font-size:19px}.roomInfo small{display:block;color:#8c8e8d;margin-top:5px}
.chatOnline{font-size:14px}.chatOnline .dot{margin-right:6px}
.messages{flex:1;overflow-y:auto;padding:22px 22px 12px;display:flex;flex-direction:column;gap:16px;background:
radial-gradient(circle at 20% 30%,rgba(255,194,37,.035),transparent 20%),
radial-gradient(circle at 80% 70%,rgba(255,194,37,.025),transparent 20%),
repeating-linear-gradient(45deg,rgba(245,185,27,.012) 0 2px,transparent 2px 18px)}
.date{text-align:center;color:#b0a894;background:#111515;border:1px solid #30291b;border-radius:20px;padding:6px 13px;font-size:11px;align-self:center}
.msg{display:flex;gap:9px;max-width:78%;align-items:flex-end}
.msg.me{align-self:flex-start;flex-direction:row-reverse}
.msg img{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none}
.bubble{padding:10px 13px;border-radius:15px;background:#121717;border:1px solid #252c2b;box-shadow:0 3px 12px #0005}
.me .bubble{background:linear-gradient(145deg,#e9a900,#ffc72d);color:#17130a;border-color:#ffcf43}
.name{font-size:12px;color:var(--gold);font-weight:bold;margin-bottom:6px}
.me .name{color:#4d3500}
.text{font-size:14px;line-height:1.8;word-break:break-word}
.meta{text-align:left;font-size:10px;color:#8b8c88;margin-top:3px}
.me .meta{color:#59480e}
.empty{margin:auto;text-align:center;color:#777;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .honey{font-size:65px}.empty b{font-size:15px;color:#999}.empty span{font-size:13px;color:#666}
.composer{padding:12px 15px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;background:#0b0f0f}
.iconBtn{width:52px;height:52px;border-radius:14px;background:#171b1b;border:1px solid #40351f;color:var(--gold);font-size:24px}
#messageInput{flex:1;min-width:0;height:52px;border-radius:14px;border:1px solid #292d2c;background:#151919;color:white;padding:0 17px;outline:none}
#messageInput:focus{border-color:#8b6517;box-shadow:0 0 0 2px #8b651722}
.send{width:58px;height:52px;border-radius:14px;background:linear-gradient(135deg,#ffd43b,#e7a900);color:#17130a;font-size:25px;font-weight:bold}
.users{margin:3px 3px 3px 0;border:1px solid var(--line);border-radius:0 22px 22px 0;background:#0d1111;display:flex;flex-direction:column;overflow:hidden}
.usersHead{padding:27px 22px 20px;border-bottom:1px solid var(--line);font-size:18px;font-weight:bold}
.usersHead span{color:#28d977;font-size:13px;margin-right:5px}
.userList{overflow:auto;flex:1}
.user{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid #1b1f1f}
.user img{width:52px;height:52px;border-radius:50%;object-fit:cover}
.user b{display:block}.user small{color:#858986;display:block;margin-top:5px}.user small:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#25d366;margin-left:5px}
.crown{margin-right:auto;color:#ffc52b;font-size:20px}
.usersFoot{padding:22px;text-align:center;border-top:1px solid var(--line);color:#777}
.usersFoot strong{display:block;color:var(--gold);font-size:18px;margin-bottom:10px}
.logout{position:absolute;top:23px;right:25px;z-index:10;background:transparent;color:#eee;font-size:15px}
#toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);background:#222;color:#fff;border:1px solid #6d5015;padding:10px 18px;border-radius:12px;display:none;z-index:100}
@media(max-width:900px){
 .app{grid-template-columns:1fr}
 .side{display:none}.users{display:none}
 .chat{margin:0;border-radius:0;border-left:0;border-right:0}
 .topbar{height:82px;padding:10px 14px}.brand{font-size:21px}
 .roomIcon{width:44px;height:44px;font-size:24px}.roomInfo b{font-size:16px}
 .messages{padding:14px 10px}.msg{max-width:88%}
 .composer{padding:8px}.iconBtn{width:46px;height:46px}.send{width:52px;height:46px}#messageInput{height:46px}
 .logout{top:20px;left:14px;right:auto;font-size:0}.logout:after{content:"↪";font-size:24px}
}
</style>
</head>

<body>
<div class="app">

<aside class="side">
  <div class="profile">
    <img id="profileAvatar" class="avatar" src="" alt="">
    <div><b id="profileName">مهمان</b><div class="status"><i class="dot"></i> آنلاین</div></div>
  </div>

  <div class="menu">
    <button class="menuBtn active"><span>👥</span> اتاق عمومی</button>
    <button class="menuBtn" id="searchBtn"><span>🔎</span> جستجو در کاربران</button>
  </div>

  <div class="privateTitle">پیام‌های خصوصی <span class="add">＋</span></div>
  <div class="private" id="privateList">
    <div class="privateItem">
      <img src="" alt="">
      <div class="ptext"><b>پیام خصوصی</b><small>برای شروع یک کاربر را انتخاب کنید</small></div>
    </div>
  </div>

  <div class="bottomBtns">
    <button>⚙️</button><button>🌙</button><button>ⓘ</button>
  </div>
</aside>

<main class="chat">
  <button class="logout" id="logoutBtn">خروج 🚪</button>

  <header class="topbar">
    <div class="roomInfo">
      <div class="roomIcon">#</div>
      <div><b>اتاق عمومی</b><small>به اتاق عمومی عسل چت خوش آمدید 🍯</small></div>
    </div>
    <div class="chatOnline"><i class="dot"></i><span id="onlineCount">0</span> نفر آنلاین</div>
    <div class="brand">🍯 عسل چت</div>
  </header>

  <section class="messages" id="messages">
    <div class="empty" id="emptyState">
      <div class="honey">🍯</div>
      <b>هنوز پیامی ارسال نشده</b>
      <span>اولین پیام را بفرست!</span>
    </div>
  </section>

  <form class="composer" id="composer">
    <button type="button" class="iconBtn" id="attachBtn">📎</button>
    <button type="button" class="iconBtn" id="emojiBtn">😊</button>
    <input id="messageInput" autocomplete="off" placeholder="پیام خود را بنویسید..." maxlength="2000">
    <button class="send" type="submit">➤</button>
    <input id="fileInput" type="file" accept="image/*" hidden>
  </form>
</main>

<aside class="users">
  <div class="usersHead">کاربران آنلاین <span id="usersHeadCount">(0)</span></div>
  <div class="userList" id="userList">
    <div style="padding:25px;color:#777;text-align:center" id="loadingUsers">در حال دریافت...</div>
  </div>
  <div class="usersFoot">
    <strong>🍯 عسل چت</strong>
    نسخه 1.0.0
  </div>
</aside>

</div>
<div id="toast"></div>

<script type="module">
/*
=========================================================
  عسل چت - نسخه کامل
  فقط اطلاعات Firebase خودت را در firebaseConfig وارد کن.
=========================================================
*/

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getDatabase, ref, push, set, onValue, onChildAdded,
  onDisconnect, serverTimestamp, query, orderByChild, limitToLast
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

/* ================= FIREBASE CONFIG =================
   این قسمت را با config پروژه Firebase خودت عوض کن.
   config را از Firebase Console > Project settings > Your apps
   کپی کن.
====================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBmV0ikTOiXmtibjuXgJ4PhIbJcTxkhP5A",
  authDomain: "roomasal.firebaseapp.com",
  databaseURL: "https://roomasal-default-rtdb.firebaseio.com",
  projectId: "roomasal",
  storageBucket: "roomasal.firebasestorage.app",
  messagingSenderId: "74039115594",
  appId: "1:74039115594:web:18fb78cfe77207f18c4bb3",
  measurementId: "G-T9W22HHGBF"
};

const firebaseReady =
  firebaseConfig.apiKey !== "YOUR_API_KEY" &&
  firebaseConfig.databaseURL.indexOf("YOUR_PROJECT") === -1;

let db = null;
if(firebaseReady){
  const app = initializeApp(firebaseConfig);
  db = getDatabase(app);
}

/* ================= USER ================= */
const username =
  localStorage.getItem("username") ||
  localStorage.getItem("name") ||
  "مهمان";

const avatar =
  localStorage.getItem("avatar") ||
  "https://ui-avatars.com/api/?name=" +
  encodeURIComponent(username) +
  "&background=f5b91b&color=111&size=128";

document.getElementById("profileName").textContent = username;
document.getElementById("profileAvatar").src = avatar;

/* ================= HELPERS ================= */
const messagesEl = document.getElementById("messages");
const emptyState = document.getElementById("emptyState");
const input = document.getElementById("messageInput");
const userList = document.getElementById("userList");
const onlineCount = document.getElementById("onlineCount");
const usersHeadCount = document.getElementById("usersHeadCount");
const toast = document.getElementById("toast");

function showToast(text){
  toast.textContent = text;
  toast.style.display = "block";
  clearTimeout(window.__toast);
  window.__toast = setTimeout(()=>toast.style.display="none",2500);
}

function timeText(ts){
  if(!ts) return new Date().toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"});
  return new Date(ts).toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"});
}

function escapeHTML(str){
  return String(str).replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

function renderMessage(data){
  if(!data || !data.text) return;

  emptyState?.remove();

  const mine = data.uid === getClientId();
  const row = document.createElement("div");
  row.className = "msg" + (mine ? " me" : "");

  const img = document.createElement("img");
  img.src = data.avatar || avatar;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML =
    '<div class="name">'+escapeHTML(data.name || "کاربر")+'</div>'+
    '<div class="text">'+escapeHTML(data.text).replace(/\n/g,"<br>")+'</div>'+
    '<div class="meta">'+timeText(data.time)+(mine ? " ✓✓" : "")+'</div>';

  row.append(img,bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function getClientId(){
  let id = localStorage.getItem("asalChatClientId");
  if(!id){
    id = crypto.randomUUID ? crypto.randomUUID() :
      Date.now().toString(36)+Math.random().toString(36).slice(2);
    localStorage.setItem("asalChatClientId",id);
  }
  return id;
}

/* ================= DEMO FALLBACK =================
   اگر config هنوز وارد نشده باشد، ظاهر سایت کار می‌کند
   و پیام‌ها در همین مرورگر ذخیره می‌شوند.
=================================================== */
const LOCAL_KEY = "asal_chat_messages_v1";

function loadLocal(){
  const arr = JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]");
  messagesEl.innerHTML = "";
  if(!arr.length){
    messagesEl.appendChild(emptyState);
    return;
  }
  arr.forEach(renderMessage);
}

function saveLocal(data){
  const arr = JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]");
  arr.push(data);
  localStorage.setItem(LOCAL_KEY,JSON.stringify(arr.slice(-200)));
}

/* ================= SEND ================= */
document.getElementById("composer").addEventListener("submit",async e=>{
  e.preventDefault();

  const text = input.value.trim();
  if(!text) return;

  const data = {
    uid:getClientId(),
    name:username,
    avatar,
    text,
    time:Date.now()
  };

  input.value = "";

  try{
    if(firebaseReady && db){
      await push(ref(db,"messages"),{
        ...data,
        time:serverTimestamp()
      });
    }else{
      saveLocal(data);
      renderMessage(data);
    }
  }catch(err){
    console.error(err);
    saveLocal(data);
    renderMessage(data);
    showToast("اتصال Firebase برقرار نشد؛ پیام محلی ذخیره شد.");
  }
});

/* ================= RECEIVE MESSAGES ================= */
if(firebaseReady && db){
  const messagesQuery = query(
    ref(db,"messages"),
    orderByChild("time"),
    limitToLast(200)
  );

  let firstLoad = true;

  onValue(messagesQuery,snap=>{
    messagesEl.innerHTML = "";
    const values = [];
    snap.forEach(child=>{
      values.push(child.val());
    });

    if(!values.length){
      messagesEl.appendChild(emptyState);
    }else{
      values.forEach(renderMessage);
    }

    firstLoad = false;
  },err=>{
    console.error(err);
    showToast("خطا در خواندن پیام‌ها از Firebase");
  });
}else{
  loadLocal();
}

/* ================= ONLINE USERS ================= */
function renderUsers(data){
  userList.innerHTML = "";
  const users = Object.values(data || {});

  onlineCount.textContent = users.length;
  usersHeadCount.textContent = "(" + users.length + ")";

  if(!users.length){
    userList.innerHTML =
      '<div style="padding:25px;color:#777;text-align:center">کاربری آنلاین نیست</div>';
    return;
  }

  users.sort((a,b)=>{
    if(a.name === username) return -1;
    if(b.name === username) return 1;
    return String(a.name).localeCompare(String(b.name));
  });

  users.forEach((u,i)=>{
    const div = document.createElement("div");
    div.className = "user";
    div.innerHTML =
      '<img src="'+escapeHTML(u.avatar || ("https://ui-avatars.com/api/?name="+encodeURIComponent(u.name||"کاربر")+"&background=f5b91b&color=111"))+'">'+
      '<div><b>'+escapeHTML(u.name || "کاربر")+'</b><small>آنلاین</small></div>'+
      (i===0 ? '<div class="crown">♛</div>' : '');
    userList.appendChild(div);
  });
}

if(firebaseReady && db){
  const myOnlineRef = ref(db,"online/"+getClientId());

  set(myOnlineRef,{
    name:username,
    avatar,
    time:serverTimestamp()
  });

  onDisconnect(myOnlineRef).remove();

  onValue(ref(db,"online"),snap=>{
    renderUsers(snap.val());
  },err=>{
    console.error(err);
    document.getElementById("loadingUsers").textContent="خطا در دریافت کاربران";
  });
}else{
  renderUsers({
    [getClientId()]:{name:username,avatar}
  });
}

/* ================= EMOJI ================= */
document.getElementById("emojiBtn").addEventListener("click",()=>{
  input.value += (input.value ? " " : "") + "😊";
  input.focus();
});

/* ================= FILE ================= */
document.getElementById("attachBtn").addEventListener("click",()=>{
  document.getElementById("fileInput").click();
});

document.getElementById("fileInput").addEventListener("change",e=>{
  const file = e.target.files[0];
  if(!file) return;

  if(!file.type.startsWith("image/")){
    showToast("فقط فایل تصویری انتخاب کنید.");
    return;
  }

  showToast("برای ارسال واقعی عکس، Firebase Storage را هم فعال کنید.");
});

/* ================= SEARCH ================= */
document.getElementById("searchBtn").addEventListener("click",()=>{
  const q = prompt("نام کاربر را وارد کنید:");
  if(q){
    const items = document.querySelectorAll(".user");
    let found = false;
    items.forEach(x=>{
      const ok = x.innerText.toLowerCase().includes(q.toLowerCase());
      x.style.display = ok ? "flex" : "none";
      if(ok) found=true;
    });
    if(!found) showToast("کاربری با این نام پیدا نشد.");
  }
});

/* ================= LOGOUT ================= */
document.getElementById("logoutBtn").addEventListener("click",()=>{
  localStorage.removeItem("username");
  localStorage.removeItem("name");
  location.href="index.html";
});

/* Enter برای ارسال */
input.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    document.getElementById("composer").requestSubmit();
  }
});

/* پیام وضعیت */
if(!firebaseReady){
  setTimeout(()=>{
    showToast("حالت آزمایشی فعال است؛ برای چت بین چند گوشی Firebase را وارد کن.");
  },900);
}
</script>
</body>
</html>
