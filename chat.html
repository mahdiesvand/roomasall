<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عسل چت</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
height:100vh;
font-family:tahoma;
background:#0b141a;
color:white;

}



.chat{

height:100vh;
max-width:600px;
margin:auto;
display:flex;
flex-direction:column;

background:#0b141a;

}




/* هدر */

.header{

height:75px;

display:flex;
flex-direction:column;

align-items:center;
justify-content:center;

background:

linear-gradient(
135deg,
#8f6500,
#ffd700,
#8f6500
);


color:#111;

font-size:24px;

font-weight:bold;

box-shadow:0 3px 15px #000;

}



#profile{

font-size:12px;

color:#333;

}


.header span{

font-size:12px;

color:#075e54;

font-weight:bold;

}





/* محیط پیام */

.messages{

flex:1;

padding:15px;

overflow-y:auto;


/* پس زمینه عسل */

background:

radial-gradient(
circle,
rgba(255,215,0,.08) 2px,
transparent 2px
);

background-size:35px 35px;

}





.message{

position:relative;

padding:12px 16px;

border-radius:20px;

margin-bottom:12px;

max-width:80%;

width:fit-content;

font-size:15px;

line-height:1.5;

animation:show .25s;

box-shadow:

0 3px 10px rgba(0,0,0,.4);

}




.message b{

display:block;

font-size:13px;

margin-bottom:5px;

color:#ffd700;

}



.message small{

display:block;

text-align:left;

font-size:10px;

opacity:.6;

margin-top:6px;

}



/* پیام خودم */

.message.mine{

margin-left:auto;

background:

linear-gradient(
135deg,
#ffd700,
#d9a900
);


color:#111;

border-bottom-right-radius:5px;

}



.message.mine b{

color:#000;

}




/* پیام دیگران */

.message.other{

margin-right:auto;

background:

linear-gradient(
135deg,
#202b36,
#263746
);


color:white;

border-bottom-left-radius:5px;

}






/* نوار ارسال */

.input{

display:flex;

padding:10px;

background:#17212b;

align-items:center;

border-top:1px solid #333;

}



.input input{

flex:1;

padding:14px;

border:none;

outline:none;

border-radius:30px;

background:#0b141a;

color:white;

font-size:15px;

}



.input button{

margin-right:8px;

width:50px;

height:50px;

border:none;

border-radius:50%;


background:

linear-gradient(
135deg,
#ffd700,
#b8860b
);


font-size:21px;

cursor:pointer;

}



.input button:active{

transform:scale(.9);

}




@keyframes show{

from{

opacity:0;

transform:translateY(15px);

}


to{

opacity:1;

transform:translateY(0);

}

}


</style>


</head>



<body>



<div class="chat">


<div class="header">

🍯 عسل چت

<div id="profile"></div>


<span id="online">
🟢 آنلاین
</span>

</div>





<div class="messages" id="messages">

</div>





<div class="input">


<input 
type="file" 
id="imageInput" 
accept="image/*"
style="display:none"
>



<button onclick="document.getElementById('imageInput').click()">

📷

</button>




<input id="text" placeholder="پیام بنویسید...">




<button onclick="sendMessage()">

➤

</button>


</div>


</div>






<script>

let user = localStorage.getItem("username");

if(!user){

window.location.href="index.html";

}

</script>



<script type="module" src="online.js"></script>

<script type="module" src="app.js"></script>


</body>

</html>
