<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<meta
    name="theme-color"
    content="#0b0c0b"
>

<title>عسل چت 🍯</title>


<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background:#080908;
    color:#fff;

    -webkit-tap-highlight-color:transparent;
}

button,
input,
textarea{
    font-family:inherit;
}


/* =========================================================
   APP
========================================================= */

#app{

    width:100%;
    height:100dvh;

    display:flex;
    flex-direction:column;

    background:

        radial-gradient(
            circle at 50% 0%,
            rgba(255,193,7,.08),
            transparent 38%
        ),

        #080908;
}


/* =========================================================
   HEADER
========================================================= */

.chat-header{

    height:64px;
    min-height:64px;

    display:flex;
    align-items:center;

    padding:
        0 14px;

    background:

        linear-gradient(
            135deg,
            #171712,
            #0e0f0d
        );

    border-bottom:
        1px solid
        rgba(255,193,7,.15);

    box-shadow:
        0 3px 18px
        rgba(0,0,0,.45);

    position:relative;

    z-index:10;
}


/* =========================================================
   LOGO
========================================================= */

.logo{

    width:42px;
    height:42px;

    flex:0 0 42px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:23px;

    background:

        linear-gradient(
            145deg,
            #ffc107,
            #d99500
        );

    box-shadow:

        0 0 18px
        rgba(255,193,7,.25);

    margin-left:10px;

    cursor:pointer;

    user-select:none;
}


/* =========================================================
   HEADER INFO
========================================================= */

.header-info{

    flex:1;

    min-width:0;
}

.header-title{

    font-size:17px;

    font-weight:bold;

    color:#ffd45a;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.header-status{

    margin-top:4px;

    font-size:11px;

    color:#8f948d;

    display:flex;

    align-items:center;

    gap:5px;
}

.online-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#42d96b;

    box-shadow:

        0 0 8px
        rgba(66,217,107,.65);
}


/* =========================================================
   HEADER BUTTONS
========================================================= */

.header-actions{

    display:flex;

    align-items:center;

    gap:6px;
}

.header-btn{

    width:38px;
    height:38px;

    border:0;
    outline:0;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#ddd;

    background:
        rgba(255,255,255,.05);

    font-size:18px;

    cursor:pointer;

    transition:.2s;
}

.header-btn:active{

    transform:scale(.9);

    background:
        rgba(255,193,7,.14);
}


/* =========================================================
   CHAT AREA
========================================================= */

.chat-area{

    flex:1;

    position:relative;

    overflow:hidden;

    display:flex;

    flex-direction:column;

    background:

        radial-gradient(
            circle at 20% 20%,
            rgba(255,193,7,.025),
            transparent 25%
        ),

        radial-gradient(
            circle at 80% 70%,
            rgba(255,193,7,.018),
            transparent 28%
        ),

        #090a09;
}


/* =========================================================
   HONEY BACKGROUND
========================================================= */

.honey-bg{

    position:absolute;

    inset:0;

    pointer-events:none;

    opacity:.7;

    background-image:

        radial-gradient(
            circle,
            rgba(255,193,7,.045) 1px,
            transparent 1.5px
        );

    background-size:
        28px 28px;
}


/* =========================================================
   MESSAGES
========================================================= */

#messages{

    flex:1;

    overflow-y:auto;
    overflow-x:hidden;

    padding:
        14px
        10px
        95px;

    position:relative;

    z-index:2;

    scroll-behavior:smooth;
}

#messages::-webkit-scrollbar{

    width:4px;
}

#messages::-webkit-scrollbar-track{

    background:transparent;
}

#messages::-webkit-scrollbar-thumb{

    background:#383a34;

    border-radius:10px;
}


/* =========================================================
   EMPTY CHAT
========================================================= */

.empty-chat{

    width:100%;
    height:100%;

    display:flex;

    align-items:center;
    justify-content:center;

    text-align:center;

    color:#777b73;

    padding:30px;
}

.empty-box{

    max-width:280px;
}

.empty-icon{

    font-size:48px;

    margin-bottom:12px;
}

.empty-title{

    font-size:17px;

    color:#d0d0ca;

    margin-bottom:7px;
}

.empty-text{

    font-size:12px;

    line-height:2;

    color:#777b73;
}


/* =========================================================
   MESSAGE
========================================================= */

.message-row{

    width:100%;

    display:flex;

    margin-bottom:8px;

    animation:
        messageIn
        .2s
        ease;
}

.message-row.me{

    justify-content:flex-start;
}

.message-row.other{

    justify-content:flex-end;
}

@keyframes messageIn{

    from{

        opacity:0;

        transform:
            translateY(5px);
    }

    to{

        opacity:1;

        transform:
            translateY(0);
    }
}


/* =========================================================
   MESSAGE BUBBLE
========================================================= */

.message-bubble{

    max-width:78%;

    padding:
        9px
        12px;

    border-radius:15px;

    position:relative;

    word-break:break-word;

    line-height:1.7;

    font-size:14px;
}

.message-row.me
.message-bubble{

    background:

        linear-gradient(
            145deg,
            #272820,
            #1d1e1a
        );

    border-bottom-right-radius:4px;

    border:
        1px solid
        rgba(255,255,255,.035);
}

.message-row.other
.message-bubble{

    background:

        linear-gradient(
            145deg,
            #5b4208,
            #3c2d08
        );

    border-bottom-left-radius:4px;

    border:
        1px solid
        rgba(255,193,7,.10);
}


/* =========================================================
   MESSAGE NAME
========================================================= */

.message-name{

    font-size:11px;

    color:#ffc928;

    margin-bottom:3px;

    font-weight:bold;
}


/* =========================================================
   MESSAGE TEXT
========================================================= */

.message-text{

    color:#f0f0eb;

    white-space:pre-wrap;
}


/* =========================================================
   MESSAGE TIME
========================================================= */

.message-time{

    font-size:9px;

    color:#888b84;

    margin-top:3px;

    text-align:left;
}


/* =========================================================
   INPUT AREA
========================================================= */

.input-area{

    position:absolute;

    right:0;
    bottom:0;
    left:0;

    z-index:20;

    padding:

        8px
        9px
        calc(
            8px +
            env(
                safe-area-inset-bottom
            )
        );

    background:

        linear-gradient(
            to top,
            #080908 75%,
            transparent
        );
}

.input-box{

    width:100%;

    min-height:48px;

    display:flex;

    align-items:flex-end;

    gap:7px;

    padding:6px;

    border-radius:25px;

    background:#171914;

    border:
        1px solid
        rgba(255,193,7,.13);

    box-shadow:

        0 5px 25px
        rgba(0,0,0,.45);
}


/* =========================================================
   INPUT BUTTON
========================================================= */

.input-btn{

    flex:
        0 0 40px;

    width:40px;
    height:40px;

    border:0;
    outline:0;

    border-radius:50%;

    background:
        rgba(255,255,255,.045);

    color:#aaa;

    font-size:18px;

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.input-btn:active{

    transform:scale(.9);

    background:
        rgba(255,193,7,.14);

    color:#ffc107;
}


/* =========================================================
   MESSAGE INPUT
========================================================= */

#messageInput{

    flex:1;

    min-width:0;

    min-height:36px;

    max-height:110px;

    resize:none;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    font-size:14px;

    line-height:1.6;

    padding:
        7px
        5px;

    overflow-y:auto;
}

#messageInput::placeholder{

    color:#6f726b;
}


/* =========================================================
   SEND
========================================================= */

.send-btn{

    flex:
        0 0 40px;

    width:40px;
    height:40px;

    border:0;
    outline:0;

    border-radius:50%;

    background:

        linear-gradient(
            145deg,
            #ffc107,
            #d99500
        );

    color:#16130a;

    font-size:18px;

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    box-shadow:

        0 3px 12px
        rgba(255,193,7,.22);
}

.send-btn:active{

    transform:scale(.9);
}

.send-btn:disabled{

    opacity:.45;

    cursor:not-allowed;
}


/* =========================================================
   CONNECTION
========================================================= */

.connection-status{

    position:absolute;

    top:10px;

    left:50%;

    transform:
        translateX(-50%);

    z-index:30;

    padding:
        5px
        12px;

    border-radius:20px;

    font-size:10px;

    color:#aaa;

    background:
        rgba(20,21,18,.9);

    border:
        1px solid
        rgba(255,255,255,.05);

    backdrop-filter:
        blur(8px);

    opacity:0;

    pointer-events:none;

    transition:.3s;
}

.connection-status.show{

    opacity:1;
}

.connection-status.online{

    color:#55d978;
}

.connection-status.offline{

    color:#ff6969;
}


/* =========================================================
   PROFILE OVERLAY
========================================================= */

.profile-overlay{

    position:fixed;

    inset:0;

    z-index:200;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        rgba(0,0,0,.72);

    backdrop-filter:
        blur(5px);

    opacity:0;

    pointer-events:none;

    transition:.25s;
}

.profile-overlay.show{

    opacity:1;

    pointer-events:auto;
}


/* =========================================================
   PROFILE BOX
========================================================= */

.profile-box{

    width:100%;

    max-width:360px;

    padding:
        22px
        18px;

    border-radius:22px;

    background:

        linear-gradient(
            145deg,
            #1b1c16,
            #0d0e0c
        );

    border:
        1px solid
        rgba(255,193,7,.16);

    box-shadow:

        0 15px 50px
        rgba(0,0,0,.65);

    text-align:center;
}


/* =========================================================
   PROFILE AVATAR
========================================================= */

.profile-avatar{

    position:relative;

    overflow:hidden;

    cursor:pointer;

    width:82px;
    height:82px;

    margin:
        0 auto
        12px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:

        linear-gradient(
            145deg,
            #ffc107,
            #9b6900
        );

    color:#17130a;

    font-size:32px;

    font-weight:bold;

    box-shadow:

        0 0 25px
        rgba(255,193,7,.18);
}

.profile-avatar img{

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
}

.avatar-camera{

    position:absolute;

    right:2px;
    bottom:2px;

    width:27px;
    height:27px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#ffc107;

    color:#17130a;

    font-size:13px;

    border:
        2px solid
        #11120f;
}


/* =========================================================
   PROFILE TITLE
========================================================= */

.profile-title{

    color:#ffd45a;

    font-size:18px;

    font-weight:bold;

    margin-bottom:18px;
}


/* =========================================================
   PROFILE LABEL
========================================================= */

.profile-label{

    display:block;

    text-align:right;

    color:#999d94;

    font-size:11px;

    margin-bottom:6px;
}


/* =========================================================
   PROFILE NAME
========================================================= */

#profileName{

    width:100%;

    height:45px;

    padding:
        0 13px;

    border-radius:12px;

    border:
        1px solid
        rgba(255,255,255,.08);

    outline:none;

    background:#11120f;

    color:#fff;

    font-size:14px;

    text-align:right;
}


/* =========================================================
   PROFILE ACTIONS
========================================================= */

.profile-actions{

    display:flex;

    gap:8px;

    margin-top:16px;
}

.profile-action{

    flex:1;

    height:43px;

    border:0;

    outline:0;

    border-radius:12px;

    cursor:pointer;
}

.profile-save{

    background:

        linear-gradient(
            145deg,
            #ffc107,
            #d99500
        );

    color:#18140a;

    font-weight:bold;
}

.profile-cancel{

    background:
        rgba(255,255,255,.06);

    color:#ddd;
}

.profile-hint{

    margin-top:12px;

    color:#6f736b;

    font-size:10px;

    line-height:1.8;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:360px){

    .chat-header{

        height:58px;

        min-height:58px;

        padding:
            0 9px;
    }

    .logo{

        width:38px;
        height:38px;

        font-size:20px;
    }

    .header-title{

        font-size:15px;
    }

    .message-bubble{

        max-width:84%;

        font-size:13px;
    }

    .input-area{

        padding-left:6px;
        padding-right:6px;
    }
}

</style>

</head>


<body>


<div id="app">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="chat-header">


    <div
        class="logo"
        id="logo"
        title="پروفایل">

        🍯

    </div>


    <div class="header-info">

        <div class="header-title">

            عسل چت

        </div>


        <div class="header-status">

            <span

            </span>

            <span id="onlineStatus">

    </div>

        <button

            class="header-btn"

        </button>


    </div>


</header>



<!-- =====================================================

===================================================== -->

<main class="chat-area">


    <div class="honey-bg"></div>


    <div
        id="connectionStatus"
        class="connection-status">

    </div>


    <div id="messages">


        <div class="empty-chat">


            <div class="empty-box">


                <div class="empty-icon">

                    🍯

                </div>


                <div class="empty-title">

                    به عسل چت خوش آمدید

                </div>


                <div class="empty-text">

                    پیام خود را بنویسید
                    و گفتگو را شروع کنید.

                </div>


            </div>


        </div>


    </div>



    <!-- INPUT -->

    <div class="input-area">


        <div class="input-box">


            <button
                class="input-btn"
                id="attachBtn"
                type="button">

                📎

            </button>


            <textarea
                id="messageInput"
                rows="1"
                maxlength="2000"
                placeholder="پیام خود را بنویسید..."
                autocomplete="off">
            </textarea>


            <button
                class="send-btn"
                id="sendBtn"
                type="button"
                disabled>

                ➤

            </button>


        </div>


    </div>


</main>


</div>



<!-- =====================================================
     PROFILE
===================================================== -->

<div
    class="profile-overlay"
    id="profileOverlay">


    <div class="profile-box">


        <div
            class="profile-avatar"
            id="profileAvatar">


            <span id="avatarLetter">

                م

            </span>


            <span class="avatar-camera">

                📷

            </span>


        </div>


        <div class="profile-title">

            پروفایل من

        </div>


        <label
            class="profile-label"
            for="profileName">

            نام نمایشی

        </label>


        <input
            id="profileName"
            type="text"
            maxlength="30"
            autocomplete="off"
            placeholder="نام خود را وارد کنید">


        <div class="profile-actions">


            <button
                class="profile-action profile-cancel"
                id="profileCancel"
                type="button">

                انصراف

            </button>


            <button
                class="profile-action profile-save"
                id="profileSave"
                type="button">

                ذخیره

            </button>


        </div>


        <div class="profile-hint">

            برای تغییر عکس، روی تصویر پروفایل بزنید.

        </div>


    </div>


</div>



<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {

    initializeApp

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {

    getDatabase,
    ref,
    push,
    onChildAdded,
    onValue,
    serverTimestamp,
    onDisconnect,
    set,
    remove

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


import {

    getStorage,
    ref as storageRef,
    uploadBytes,
    getDownloadURL

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";



/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyBmV0ikTOiXmtibjuXgJ4PhIbJcTxkhP5A",

    authDomain:
        "roomasal.firebaseapp.com",

    databaseURL:
        "https://roomasal-default-rtdb.firebaseio.com",

    projectId:
        "roomasal",

    storageBucket:
        "roomasal.firebasestorage.app",

    messagingSenderId:
        "74039115594",

    appId:
        "1:74039115594:web:18fb78cfe77207f18c4bb3",

    measurementId:
        "G-T9W22HHGBF"

};



/* =====================================================
   START FIREBASE
===================================================== */

const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getDatabase(app);


const storage =
    getStorage(app);



/* =====================================================
   ELEMENTS
===================================================== */

const messageInput =
    document.getElementById(
        "messageInput"
    );


const sendBtn =
    document.getElementById(
        "sendBtn"
    );


const messages =
    document.getElementById(
        "messages"
    );


const onlineStatus =
    document.getElementById(
        "onlineStatus"
    );


const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );


const exitBtn =
    document.getElementById(
        "exitBtn"
    );


const attachBtn =
    document.getElementById(
        "attachBtn"
    );


const usersBtn =
    document.getElementById(
        "usersBtn"
    );


const logo =
    document.getElementById(
        "logo"
    );


/* =====================================================
   PROFILE ELEMENTS
===================================================== */

const profileOverlay =
    document.getElementById(
        "profileOverlay"
    );


const profileName =
    document.getElementById(
        "profileName"
    );


const profileAvatar =
    document.getElementById(
        "profileAvatar"
    );


const avatarLetter =
    document.getElementById(
        "avatarLetter"
    );


const profileSave =
    document.getElementById(
        "profileSave"
    );


const profileCancel =
    document.getElementById(
        "profileCancel"
    );



/* =====================================================
   USER
===================================================== */

let username =
    localStorage.getItem(
        "username"
    );


if(
    !username ||
    !username.trim()
){

    username =
        "مهمان";

    localStorage.setItem(
        "username",
        username
    );

}


username =
    username.trim();



/* =====================================================
   ROOM
===================================================== */

const ROOM_NAME =
    "asal-chat";


const messagesRef =
    ref(
        db,
        "rooms/" +
        ROOM_NAME +
        "/messages"
    );


const onlineUsersRef =
    ref(
        db,
        "rooms/" +
        ROOM_NAME +
        "/online"
    );


const connectedRef =
    ref(
        db,
        ".info/connected"
    );



/* =====================================================
   ONLINE REF
===================================================== */

function makeSafeUsername(
    name
){

    return name
        .replace(
            /[.#$[\]/]/g,
            "_"
        )
        .substring(
            0,
            40
        );

}


let onlineRef =
    ref(
        db,
        "rooms/" +
        ROOM_NAME +
        "/online/" +
        makeSafeUsername(
            username
        )
    );



/* =====================================================
   STATUS
===================================================== */

function showStatus(
    text,
    type="online",
    duration=1500
){

    connectionStatus.textContent =
        text;

    connectionStatus.classList.remove(
        "online",
        "offline"
    );

    connectionStatus.classList.add(
        "show",
        type
    );


    if(duration){

        setTimeout(
            function(){

                connectionStatus.classList.remove(
                    "show"
                );

            },
            duration
        );

    }

}



/* =====================================================
   INPUT RESIZE
===================================================== */

function resizeInput(){

    messageInput.style.height =
        "auto";


    messageInput.style.height =
        Math.min(
            messageInput.scrollHeight,
            110
        ) +
        "px";

}



/* =====================================================
   SEND BUTTON
===================================================== */

function updateSendButton(){

    sendBtn.disabled =
        messageInput.value
            .trim()
            .length === 0;

}



/* =====================================================
   CONNECTION
===================================================== */

onValue(
    connectedRef,
    async function(
        snapshot
    ){

        if(
            snapshot.val() === true
        ){

            onlineStatus.textContent =
                "آنلاین";


            showStatus(
                "متصل شد",
                "online"
            );


            try{

                await set(
                    onlineRef,
                    {

                        name:
                            username,

                        avatar:
                            localStorage.getItem(
                                "profileAvatar"
                            ) || "",

                        time:
                            serverTimestamp()

                    }
                );


                onDisconnect(
                    onlineRef
                ).remove();


            }catch(error){

                console.error(
                    "Online error:",
                    error
                );

            }


        }else{

            onlineStatus.textContent =
                "قطع اتصال";


            showStatus(
                "اتصال به سرور قطع شد",
                "offline",
                0
            );

        }

    }
);

/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

    const text =
        messageInput.value.trim();


    if(!text){

        return;

    }


    if(
        text.length > 2000
    ){

        alert(
            "پیام خیلی طولانی است."
        );

        return;

    }


    sendBtn.disabled =
        true;


    try{

        await push(
            messagesRef,
            {

                name:
                    username,

                text:
                    text,

                time:
                    serverTimestamp(),

                createdAt:
                    Date.now()

            }
        );


        messageInput.value =
            "";


        resizeInput();

        updateSendButton();


    }catch(error){

        console.error(
            "Firebase send error:",
            error
        );


        alert(
            "پیام ارسال نشد.\n\n" +
            "Realtime Database و قوانین Firebase را بررسی کنید."
        );


        updateSendButton();

    }

}



/* =====================================================
   RECEIVE MESSAGE
===================================================== */

onChildAdded(
    messagesRef,
    function(
        snapshot
    ){

        const data =
            snapshot.val();


        if(!data){

            return;

        }


        addFirebaseMessage(

            data.name ||
                "مهمان",

            data.text ||
                "",

            data.time,

            data.createdAt

        );

    }
);



/* =====================================================
   RENDER MESSAGE
===================================================== */

function addFirebaseMessage(

    name,

    text,

    firebaseTime,

    createdAt

){

    const empty =
        messages.querySelector(
            ".empty-chat"
        );


    if(empty){

        empty.remove();

    }


    const mine =
        name === username;


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message-row " +
        (
            mine
                ? "me"
                : "other"
        );


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "message-bubble";


    const nameElement =
        document.createElement(
            "div"
        );


    nameElement.className =
        "message-name";


    nameElement.textContent =
        name;


    const textElement =
        document.createElement(
            "div"
        );


    textElement.className =
        "message-text";


    textElement.textContent =
        text;


    const timeElement =
        document.createElement(
            "div"
        );


    timeElement.className =
        "message-time";


    let date;


    if(
        typeof firebaseTime ===
        "number"
    ){

        date =
            new Date(
                firebaseTime
            );

    }else{

        date =
            new Date(
                createdAt ||
                Date.now()
            );

    }


    timeElement.textContent =
        date.toLocaleTimeString(
            "fa-IR",
            {

                hour:
                    "2-digit",

                minute:
                    "2-digit"

            }
        );


    bubble.appendChild(
        nameElement
    );


    bubble.appendChild(
        textElement
    );


    bubble.appendChild(
        timeElement
    );


    row.appendChild(
        bubble
    );


    messages.appendChild(
        row
    );


    requestAnimationFrame(
        function(){

            messages.scrollTop =
                messages.scrollHeight;

        }
    );

}

===================================================== */

function updateProfileAvatar(){

    const name =
        profileName.value.trim() ||
        username ||
        "م";


    if(
        !profileAvatar.querySelector(
            "img"
        )
    ){

        avatarLetter.textContent =
            name.charAt(0);


        avatarLetter.style.display =
            "block";

    }

}



function showProfileAvatar(
    url
){

    if(!url){

        return;

    }


    let image =
        profileAvatar.querySelector(
            "img"
        );


    if(!image){

        image =
            document.createElement(
                "img"
            );


        profileAvatar.insertBefore(
            image,
            profileAvatar.firstChild
        );

    }


    image.src =
        url;


    avatarLetter.style.display =
        "none";

}



function openProfile(){

    profileName.value =
        username;


    const savedAvatar =
        localStorage.getItem(
            "profileAvatar"
        );


    if(savedAvatar){

        showProfileAvatar(
            savedAvatar
        );

    }else{

        updateProfileAvatar();

    }


    profileOverlay.classList.add(
        "show"
    );


    setTimeout(
        function(){

            profileName.focus();

        },
        100
    );

}



function closeProfile(){

    profileOverlay.classList.remove(
        "show"
    );

}

);


profileCancel.addEventListener(
    "click",
    closeProfile
);


profileName.addEventListener(
    "input",
    updateProfileAvatar
);


profileOverlay.addEventListener(

);

profileSave.addEventListener(
    "click",
    async function(){

        const newName =
            profileName.value.trim();


        if(!newName){

            alert(
                "لطفاً یک نام وارد کنید."
            );

            return;

        }


        if(
            newName.length < 2
        ){

            alert(
                "نام باید حداقل ۲ حرف باشد."
            );

            return;

        }


        if(
            newName.length > 30
        ){

            alert(
                "نام نمی‌تواند بیشتر از ۳۰ حرف باشد."
            );

            return;

        }


        const oldOnlineRef =
            onlineRef;


        username =
            newName;


        localStorage.setItem(
            "username",
            username
        );


        onlineRef =
            ref(
                db,
                "rooms/" +
                ROOM_NAME +
                "/online/" +
                makeSafeUsername(
                    username
                )
            );


        try{

            await remove(
                oldOnlineRef
            );


            await set(
                onlineRef,
                {

                    name:
                        username,

                    avatar:
                        localStorage.getItem(
                            "profileAvatar"
                        ) || "",

                    time:
                        serverTimestamp()

                }
            );


            onDisconnect(
                onlineRef
            ).remove();


        }catch(error){

            console.error(
                "Profile error:",
                error
            );

        }


        closeProfile();


        alert(
            "پروفایل با موفقیت ذخیره شد ✓"
        );

    }
);



/* =====================================================
   PROFILE PHOTO
===================================================== */

const avatarInput =
    document.createElement(
        "input"
    );


avatarInput.type =
    "file";


avatarInput.accept =
    "image/*";


avatarInput.style.display =
    "none";


document.body.appendChild(
    avatarInput
);


profileAvatar.addEventListener(
    "click",
    function(){

        avatarInput.click();

    }
);



const savedAvatar =
    localStorage.getItem(
        "profileAvatar"
    );


if(savedAvatar){

    showProfileAvatar(
        savedAvatar
    );

}



avatarInput.addEventListener(
    "change",
    async function(){

        const file =
            avatarInput.files[0];


        if(!file){

            return;

        }


        if(
            !file.type.startsWith(
                "image/"
            )
        ){

            alert(
                "فقط فایل تصویری انتخاب کنید."
            );

            avatarInput.value =
                "";

            return;

        }


        if(
            file.size >
            5 * 1024 * 1024
        ){

            alert(
                "حجم عکس نباید بیشتر از ۵ مگابایت باشد."
            );

            avatarInput.value =
                "";

            return;

        }


        try{

            profileAvatar.style.opacity =
                ".5";


            const fileName =
                "avatar_" +
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .substring(
                        2,
                        8
                    );


            const fileRef =
                storageRef(
                    storage,
                    "avatars/" +
                    ROOM_NAME +
                    "/" +
                    fileName
                );


            const result =
                await uploadBytes(
                    fileRef,
                    file
                );


            const url =
                await getDownloadURL(
                    result.ref
                );


            localStorage.setItem(
                "profileAvatar",
                url
            );


            showProfileAvatar(
                url
            );


            await set(
                onlineRef,
                {

                    name:
                        username,

                    avatar:
                        url,

                    time:
                        serverTimestamp()

                }
            );


            alert(
                "عکس پروفایل ذخیره شد ✓"
            );


        }catch(error){

            console.error(
                "Avatar error:",
                error
            );


            alert(
                "آپلود عکس انجام نشد.\n\n" +
                "Firebase Storage را بررسی کنید."
            );

        }finally{

            profileAvatar.style.opacity =
                "1";


            avatarInput.value =
                "";

        }

    }
);
