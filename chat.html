<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ChatRoom</title>

<style>

body{
    margin:0;
    background:#e5e7eb;
    font-family:tahoma;
}

.header{
    background:#2563eb;
    color:white;
    padding:15px;
    text-align:center;
    font-size:20px;
}

.chat{
    height:75vh;
    padding:15px;
    overflow-y:auto;
}

.message{
    background:white;
    padding:10px;
    margin:10px;
    border-radius:15px;
    max-width:70%;
}

.me{
    background:#2563eb;
    color:white;
    margin-right:auto;
}

.inputbox{
    position:fixed;
    bottom:0;
    width:100%;
    background:white;
    padding:10px;
    display:flex;
}

input{
    flex:1;
    padding:12px;
    border-radius:20px;
    border:1px solid #ccc;
    font-size:16px;
}

button{
    margin-right:8px;
    border:0;
    background:#2563eb;
    color:white;
    padding:10px 18px;
    border-radius:20px;
}

</style>

</head>


<body>


<div class="header">
💬 ChatRoom
</div>


<div class="chat" id="chat">

</div>



<div class="inputbox">

<input id="message" placeholder="پیام بنویس...">

<button onclick="sendMessage()">ارسال</button>

</div>



<script>

let username = localStorage.getItem("user");

if(!username){

window.location="index.html";

}



function sendMessage(){

let text=document.getElementById("message").value;

if(text=="") return;


let box=document.createElement("div");

box.className="message me";

box.innerHTML=
"<b>"+username+"</b><br>"+text;


document.getElementById("chat").appendChild(box);


document.getElementById("message").value="";


}


</script>


</body>

</html>
