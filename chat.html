<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عسل چت</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
height:100vh;
background:#111;
font-family:tahoma;

}


.chat{

height:100vh;
max-width:600px;
margin:auto;
display:flex;
flex-direction:column;
background:#eee;

}



.header{

background:#cc0033;
color:white;
padding:18px;
text-align:center;
font-size:22px;
font-weight:bold;

}



.messages{

flex:1;
padding:15px;
overflow-y:auto;

}



.message{

background:white;
padding:12px;
border-radius:15px;
margin-bottom:10px;
width:fit-content;
max-width:80%;

}



.input{

display:flex;
padding:10px;
background:#ddd;

}



.input input{

flex:1;
padding:14px;
border:none;
border-radius:25px;
outline:none;

}



.input button{

margin-right:10px;
padding:12px 20px;
border:none;
border-radius:25px;
background:#cc0033;
color:white;

}



</style>


</head>



<body>



<div class="chat">


<div class="header">
🍯😍😎 عسل چت
</div>



<div class="messages" id="messages">

</div>




<div class="input">


<input id="text" placeholder="پیام بنویسید...">


<button onclick="sendMessage()">
ارسال
</button>


</div>



</div>
<script>

let user = localStorage.getItem("username");

if(!user){

    window.location.href="index.html";

}

</script>

<script type="module" src="app.js"></script>

</body>

</html>
