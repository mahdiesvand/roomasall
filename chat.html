<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>چت روم</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="chat-box">

    <div class="header">
        💬 چت روم
        <span id="user"></span>
    </div>

    <div id="messages" class="messages"></div>

    <div class="send-box">
        <input id="message" type="text" placeholder="پیام بنویس...">
        <button onclick="sendMessage()">ارسال</button>
    </div>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";


const firebaseConfig = {
  apiKey: "API_KEY_خودت",
  authDomain: "AUTH_DOMAIN_خودت",
  databaseURL: "DATABASE_URL_خودت",
  projectId: "PROJECT_ID_خودت",
  storageBucket: "STORAGE_BUCKET_خودت",
  messagingSenderId: "SENDER_ID_خودت",
  appId: "APP_ID_خودت"
};


const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


let username = localStorage.getItem("username");

if(!username){
    window.location.href="index.html";
}

document.getElementById("user").innerHTML = username;


const messagesRef = ref(db,"messages");


window.sendMessage = function(){

    let text = document.getElementById("message").value.trim();

    if(text==="") return;

    push(messagesRef,{
        name: username,
        text: text
    });

    document.getElementById("message").value="";
}



onChildAdded(messagesRef,(data)=>{

    let msg = data.val();

    let box = document.getElementById("messages");

    box.innerHTML += `
    <div class="message">
        <b>${msg.name}</b><br>
        ${msg.text}
    </div>
    `;

    box.scrollTop = box.scrollHeight;

});


</script>

</body>
</html>
