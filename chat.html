<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>چت روم</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:tahoma;
}

.header{
    background:#cc0033;
    padding:15px;
    text-align:center;
}

#messages{
    height:400px;
    overflow:auto;
    padding:15px;
}

.box{
    position:fixed;
    bottom:10px;
    width:100%;
    text-align:center;
}

input{
    width:70%;
    padding:12px;
    border-radius:8px;
    border:0;
}

button{
    padding:12px;
    background:#cc0033;
    color:white;
    border:0;
    border-radius:8px;
}
</style>

</head>

<body>

<div class="header">
چت روم
</div>


<div id="messages">
</div>


<div class="box">
<input id="message" placeholder="پیام بنویس...">
<button onclick="send()">ارسال</button>
</div>


<script>

let user=localStorage.getItem("username");

if(!user){
window.location="index.html";
}


function send(){

let text=document.getElementById("message").value;

if(text=="") return;


document.getElementById("messages").innerHTML +=
"<p><b>"+user+"</b>: "+text+"</p>";


document.getElementById("message").value="";

}

</script>


</body>
</html>
