/* =========================================================
   RESET
========================================================= */

*{

    margin:0;
    padding:0;
}

html,

   APP
========================================================= */

#app{

        radial-gradient(

            transparent 38%

        #080908;
}

/* =========================================================
   HEADER
========================================================= */

.chat-header{
    height:64px;
    min-height:64px;

    display:flex;
    align-items:center;

    padding:0 12px;

    background:
        linear-gradient(

    z-index:20;
}

.logo{
    width:43px;
    height:43px;

    flex:0 0 43px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #ffc107,
            #c98600

    box-shadow:
        0 0 20px
        rgba(255,193,7,.25);

    cursor:pointer;

    user-select:none;

.header-info{
    flex:1;
    min-width:0;

    margin-right:10px;
}

.header-title{
    color:#ffd45a;

    font-size:17px;
    font-weight:bold;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.header-status{
    display:flex;
    align-items:center;
    gap:5px;

    margin-top:4px;

    color:#8d928a;

    font-size:10px;
}

.online-dot{

.header-actions{
    display:flex;

.header-btn{

    height:38px;

    outline:0;

    border-radius:50%;

    background:

    font-size:17px;

    cursor:pointer;
}

.header-btn:active{
    transform:scale(.91);

    background:

}

/* =========================================================
   CHAT AREA
========================================================= */

.chat-area{
    flex:1;

    min-height:0;

    position:relative;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(255,193,7,.025),
            transparent 25%
        ),
        radial-gradient(
            circle at 80% 75%,
            rgba(255,193,7,.02),
            transparent 30%
        ),
        #090a09;
}

/* =========================================================
   HONEY BACKGROUND
========================================================= */

.honey-bg{
    position:absolute;

    inset:0;

    pointer-events:none;

    opacity:.7;

    background-image:
        radial-gradient(
            circle,
            rgba(255,193,7,.055) 1px,
            transparent 1.6px
        );

    background-size:28px 28px;
}

/* =========================================================
   MESSAGES
========================================================= */

#messages{
    position:relative;

    z-index:2;

    width:100%;
    height:100%;

    overflow-y:auto;
    overflow-x:hidden;

    padding:
        14px
        10px
        92px;

    scroll-behavior:smooth;
}

#messages::-webkit-scrollbar{
    width:4px;
}

#messages::-webkit-scrollbar-track{
    background:transparent;
}

#messages::-webkit-scrollbar-thumb{
    background:#383a34;
    border-radius:10px;
}

/* =========================================================
   EMPTY
========================================================= */

.empty-chat{
    min-height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:30px;
}

.empty-box{
    max-width:280px;
}

.empty-icon{
    font-size:52px;

    margin-bottom:12px;

        drop-shadow(
            0 0 15px
            rgba(255,193,7,.15)

}

.empty-title{
    color:#deded8;

    font-size:17px;
    font-weight:bold;

    margin-bottom:8px;
}

.empty-text{
    color:#777b73;

    font-size:12px;

    line-height:2;
}

/* =========================================================
   MESSAGE
========================================================= */

.message-row{
    width:100%;

    display:flex;

    margin-bottom:8px;

        messageIn
        .2s

}

.message-row.me{
    justify-content:flex-start;
}

.message-row.other{
    justify-content:flex-end;
}

@keyframes messageIn{

    from{

    to{

}

.message-row.me

    background:

            #292a22,

    border:

        rgba(255,255,255,.035);

    border-bottom-right-radius:4px;
}

.message-row.other
.message-bubble{

    background:
        linear-gradient(
            145deg,
            #5a4208,
            #3c2d08

    border:
        1px solid
        rgba(255,193,7,.11);

    border-bottom-left-radius:4px;
}

.message-name{
    color:#ffc928;

    font-size:10px;

    font-weight:bold;

    margin-bottom:3px;
}

.message-text{
    color:#f2f2ed;

    white-space:pre-wrap;
}

.message-time{
    color:#858981;

    font-size:9px;

    margin-top:3px;

    text-align:left;
}

/* =========================================================
   INPUT
========================================================= */

.input-area{

    bottom:0;

========================================================= */

    margin-bottom:6px;

    height:45px;

/* =========================================================

========================================================= */

.users-overlay{

    inset:0;

    z-index:150;

    background:
        rgba(0,0,0,.7);

    opacity:0;

    pointer-events:none;

    transition:.25s;
}

.users-overlay.show{

/* =========================================================

========================================================= */

/* =========================================================

        .substring(

            40
        );

}

let safeUser =
    makeSafeUserId(
        username
    );

let onlineRef =
    ref(
        db,
        "rooms/" +
        ROOM_NAME +
        "/online/" +
        safeUser
    );


/* =====================================================
   CONNECTION
===================================================== */

onValue(
    connectedRef,
    snapshot => {

        if(
            snapshot.val() === true
        ){

            onlineStatus.textContent =
                "آنلاین";

            connectionStatus.textContent =
                "متصل شد";

            connectionStatus.classList
                .remove(
                    "offline"
                );

            connectionStatus.classList
                .add(
                    "show",
                    "online"
                );

            setTimeout(
                () => {

                    connectionStatus.classList
                        .remove(
                            "show"
                        );

                },
                1500
            );

        }else{

            onlineStatus.textContent =
                "قطع اتصال";

            connectionStatus.textContent =
                "اتصال به سرور قطع شد";

            connectionStatus.classList
                .remove(
                    "online"
                );

            connectionStatus.classList
                .add(
                    "show",
                    "offline"
                );

        }

    }
);


/* =====================================================
   ONLINE USER
===================================================== */

function registerOnlineUser(){

    set(
        onlineRef,
        {
            name:
                username,

            avatar:
                localStorage.getItem(
                    "profileAvatar"
                ) || "",

            time:
                serverTimestamp()
        }
    );

    onDisconnect(
        onlineRef
    ).remove();

}

onValue(
    connectedRef,
    snapshot => {

        if(
            snapshot.val() === true
        ){

            registerOnlineUser();

        }

    }
);


/* =====================================================
   ONLINE USERS LIST
===================================================== */

onValue(
    onlineUsersRef,
    snapshot => {

        const data =
            snapshot.val();

        usersList.innerHTML =
            "";

        if(!data){

            usersList.innerHTML =
                `<div class="no-users">
                    هیچ کاربری آنلاین نیست
                </div>`;

            onlineStatus.textContent =
                "۰ نفر آنلاین";

            return;

        }

        const users =
            Object.values(data);

        onlineStatus.textContent =
            users.length +
            " نفر آنلاین";

        users.forEach(
            user => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "user-item";

                const avatar =
                    document.createElement(
                        "div"
                    );

                avatar.className =
                    "user-avatar";

                if(user.avatar){

                    const img =
                        document.createElement(
                            "img"
                        );

                    img.src =
                        user.avatar;

                    img.style.width =
                        "100%";

                    img.style.height =
                        "100%";

                    img.style.objectFit =
                        "cover";

                    img.style.borderRadius =
                        "50%";

                    avatar.appendChild(
                        img
                    );

                }else{

                    avatar.textContent =
                        (
                            user.name ||
                            "م"
                        ).charAt(0);

                }

                const info =
                    document.createElement(
                        "div"
                    );

                info.className =
                    "user-info";

                const name =
                    document.createElement(
                        "div"
                    );

                name.className =
                    "user-name";

                name.textContent =
                    user.name ||
                    "مهمان";

                const status =
                    document.createElement(
                        "div"
                    );

                status.className =
                    "user-online";

                status.textContent =
                    "● آنلاین";

                info.appendChild(
                    name
                );

                info.appendChild(
                    status
                );

                item.appendChild(
                    avatar
                );

                item.appendChild(
                    info
                );

                usersList.appendChild(
                    item
                );

            }
        );

    }
);


/* =====================================================
   RESIZE INPUT
===================================================== */

function resizeInput(){

    messageInput.style.height =
        "auto";

    messageInput.style.height =
        Math.min(
            messageInput.scrollHeight,
            110
        ) +
        "px";

}

messageInput.addEventListener(
    "input",
    resizeInput
);


/* =====================================================
   BUTTON STATE
===================================================== */

function updateSendButton(){

    sendBtn.disabled =
        messageInput.value
            .trim()
            .length === 0;

}

messageInput.addEventListener(
    "input",
    updateSendButton
);

updateSendButton();


/* =====================================================
   SEND WITH ENTER
===================================================== */

messageInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

    const text =
        messageInput.value.trim();

    if(!text){
        return;
    }

    if(
        text.length >
        2000
    ){

        alert(
            "پیام نمی‌تواند بیشتر از ۲۰۰۰ کاراکتر باشد."
        );

        return;

    }

    sendBtn.disabled =
        true;

    try{

        await push(
            messagesRef,
            {
                name:
                    username,

                text:
                    text,

                time:
                    serverTimestamp(),

                createdAt:
                    Date.now()
            }
        );

        messageInput.value =
            "";

        resizeInput();

        updateSendButton();

    }catch(error){

        console.error(
            error
        );

        alert(
            "پیام ارسال نشد. اتصال Firebase یا Rules را بررسی کن."
        );

        updateSendButton();

    }

}


/* =====================================================
   RECEIVE MESSAGES
===================================================== */

onChildAdded(
    messagesRef,
    snapshot => {

        const data =
            snapshot.val();

        if(!data){
            return;
        }

        renderMessage(
            data
        );

    }
);


/* =====================================================
   RENDER MESSAGE
===================================================== */

function renderMessage(data){

    const empty =
        messages.querySelector(
            ".empty-chat"
        );

    if(empty){
        empty.remove();
    }

    const mine =
        data.name === username;

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "message-row " +
        (
            mine
                ? "me"
                : "other"
        );

    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "message-bubble";

    const name =
        document.createElement(
            "div"
        );

    name.className =
        "message-name";

    name.textContent =
        data.name ||
        "مهمان";

    const text =
        document.createElement(
            "div"
        );

    text.className =
        "message-text";

    text.textContent =
        data.text ||
        "";

    const time =
        document.createElement(
            "div"
        );

    time.className =
        "message-time";

    let date;

    if(
        typeof data.time ===
        "number"
    ){

        date =
            new Date(
                data.time
            );

    }else{

        date =
            new Date(
                data.createdAt ||
                Date.now()
            );

    }

    time.textContent =
        date.toLocaleTimeString(
            "fa-IR",
            {
                hour:
                    "2-digit",

                minute:
                    "2-digit"
            }
        );

    bubble.appendChild(
        name
    );

    bubble.appendChild(
        text
    );

    bubble.appendChild(
        time
    );

    row.appendChild(
        bubble
    );

    messages.appendChild(
        row
    );

    requestAnimationFrame(
        () => {

            messages.scrollTop =
                messages.scrollHeight;

        }
    );

}


/* =====================================================
   SEND BUTTON
===================================================== */

sendBtn.addEventListener(
    "click",
    sendMessage
);


/* =====================================================
   USERS PANEL
===================================================== */

usersBtn.addEventListener(
    "click",
    () => {

        usersOverlay.classList
            .add(
                "show"
            );

    }
);

usersClose.addEventListener(
    "click",
    () => {

        usersOverlay.classList
            .remove(
                "show"
            );

    }
);

usersOverlay.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            usersOverlay
        ){

            usersOverlay.classList
                .remove(
                    "show"
                );

        }

    }
);


/* =====================================================
   PROFILE
===================================================== */

function updateAvatar(){

    const saved =
        localStorage.getItem(
            "profileAvatar"
        );

    if(saved){

        profileAvatar.innerHTML =
            "";

        const img =
            document.createElement(
                "img"
            );

        img.src =
            saved;

        profileAvatar.appendChild(
            img
        );

        return;

    }

    profileAvatar.innerHTML =
        "";

    const span =
        document.createElement(
            "span"
        );

    span.id =
        "avatarLetter";

    span.textContent =
        (
            profileName.value.trim() ||
            username ||
            "م"
        ).charAt(0);

    profileAvatar.appendChild(
        span
    );

}

profileOpen.addEventListener(
    "click",
    () => {

        profileName.value =
            username;

        updateAvatar();

        profileOverlay.classList
            .add(
                "show"
            );

        setTimeout(
            () => {
                profileName.focus();
            },
            100
        );

    }
);

profileCancel.addEventListener(
    "click",
    () => {

        profileOverlay.classList
            .remove(
                "show"
            );

    }
);

profileOverlay.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            profileOverlay
        ){

            profileOverlay.classList
                .remove(
                    "show"
                );

        }

    }
);


/* =====================================================
   PROFILE NAME PREVIEW
===================================================== */

profileName.addEventListener(
    "input",
    () => {

        if(
            !localStorage.getItem(
                "profileAvatar"
            )
        ){

            updateAvatar();

        }

    }
);


/* =====================================================
   PROFILE PHOTO
===================================================== */

const avatarInput =
    document.createElement(
        "input"
    );

avatarInput.type =
    "file";

avatarInput.accept =
    "image/*";

avatarInput.style.display =
    "none";

document.body.appendChild(
    avatarInput
);

profileAvatar.addEventListener(
    "click",
    () => {

        avatarInput.click();

    }
);

avatarInput.addEventListener(
    "change",
    async () => {

        const file =
            avatarInput.files[0];

        if(!file){
            return;
        }

        if(
            !file.type.startsWith(
                "image/"
            )
        ){

            alert(
                "فقط عکس انتخاب کنید."
            );

            return;

        }

        if(
            file.size >
            5 * 1024 * 1024
        ){

            alert(
                "حجم عکس نباید بیشتر از ۵ مگابایت باشد."
            );

            avatarInput.value =
                "";

            return;

        }

        try{

            profileAvatar.style.opacity =
                ".5";

            const fileName =
                "avatar_" +
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .substring(
                        2,
                        8
                    ) +
                ".jpg";

            const fileRef =
                storageRef(
                    storage,
                    "avatars/" +
                    ROOM_NAME +
                    "/" +
                    fileName
                );

            const uploaded =
                await uploadBytes(
                    fileRef,
                    file
                );

            const url =
                await getDownloadURL(
                    uploaded.ref
                );

            localStorage.setItem(
                "profileAvatar",
                url
            );

            updateAvatar();

            await set(
                onlineRef,
                {
                    name:
                        username,

                    avatar:
                        url,

                    time:
                        serverTimestamp()
                }
            );

            alert(
                "عکس پروفایل ذخیره شد ✓"
            );

        }catch(error){

            console.error(
                "Avatar error:",
                error
            );

            alert(
                "آپلود عکس انجام نشد. Storage را بررسی کن."
            );

        }finally{

            profileAvatar.style.opacity =
                "1";

            avatarInput.value =
                "";

        }

    }
);


/* =====================================================
   SAVE PROFILE
===================================================== */

profileSave.addEventListener(
    "click",
    async () => {

        const newName =
            profileName.value.trim();

        if(!newName){

            alert(
                "لطفاً نام وارد کن."
            );

            return;

        }

        if(
            newName.length <
            2
        ){

            alert(
                "نام حداقل باید ۲ حرف باشد."
            );

            return;

        }

        if(
            newName.length >
            30
        ){

            alert(
                "نام نباید بیشتر از ۳۰ حرف باشد."
            );

            return;

        }

        username =
            newName;

        localStorage.setItem(
            "username",
            username
        );

        const oldOnlineRef =
            onlineRef;

        safeUser =
            makeSafeUserId(
                username
            );

        onlineRef =
            ref(
                db,
                "rooms/" +
                ROOM_NAME +
                "/online/" +
                safeUser
            );

        try{

            await remove(
                oldOnlineRef
            );

            registerOnlineUser();

        }catch(error){

            console.error(
                error
            );

        }

        profileOverlay.classList
            .remove(
                "show"
            );

        alert(
            "پروفایل ذخیره شد ✓"
        );

    }
);


/* =====================================================
   ATTACHMENT
===================================================== */

attachBtn.addEventListener(
    "click",
    () => {

        alert(
            "ارسال عکس در مرحله بعد به پیام‌ها اضافه می‌شود 🍯"
        );

    }
);


/* =====================================================
   EXIT
===================================================== */

exitBtn.addEventListener(
    "click",
    async () => {

        const ok =
            confirm(
                "آیا می‌خواهی از عسل چت خارج شوی؟"
            );

        if(!ok){
            return;
        }

        try{

            await remove(
                onlineRef
            );

        }catch(error){

            console.error(
                error
            );

        }

        localStorage.removeItem(
            "username"
        );

        window.location.href =
            "index.html";

    }
);


/* =====================================================
   ESC
===================================================== */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key !==
            "Escape"
        ){

            return;

        }

        profileOverlay.classList
            .remove(
                "show"
            );

        usersOverlay.classList
            .remove(
                "show"
            );

    }
);


/* =====================================================
   VISIBILITY
===================================================== */

document.addEventListener(
    "visibilitychange",
    () => {

        if(
            document.visibilityState ===
            "visible"
        ){

            registerOnlineUser();

        }

    }
);

updateAvatar();

console.log(

);

);
