<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="theme-color" content="#0b0c0b">

<title>عسل چت 🍯</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% -20%,
            rgba(255,190,0,.08),
            transparent 35%
        ),
        #090b0a;
    color:#f5f5f5;
    font-family:
        Tahoma,
        Arial,
        sans-serif;
}

/* =========================================================
   VARIABLES
========================================================= */

:root{

    --bg:#090b0a;
    --panel:#0d100f;
    --panel2:#111413;
    --panel3:#171a18;

    --gold:#f4b914;
    --gold2:#ffcf3b;
    --gold3:#d99800;

    --text:#f5f5f5;
    --muted:#929292;

    --border:
        rgba(255,193,7,.20);

    --green:#1dcc57;

    --danger:#e74c3c;

    --bubble:#161918;

    --mybubble:
        linear-gradient(
            145deg,
            #ffc928,
            #e2a700
        );

}

/* =========================================================
   APP
========================================================= */

.app{
    width:100%;
    height:100vh;

    display:grid;

    grid-template-columns:
        330px
        minmax(430px,1fr)
        330px;

    grid-template-rows:
        100px
        1fr;

    background:#090b0a;

    overflow:hidden;
}

/* =========================================================
   TOP HEADER
========================================================= */

.topbar{

    grid-column:
        1 / 4;

    grid-row:1;

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    border-bottom:
        1px solid var(--border);

    background:
        linear-gradient(
            180deg,
            #0e100f,
            #0b0d0c
        );

    box-shadow:
        0 2px 25px rgba(0,0,0,.5);

    z-index:20;

}

/* =========================================================
   HONEY DRIPS
========================================================= */

.honey-decoration{

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:62px;

    pointer-events:none;

    overflow:hidden;

}

.honey-decoration::before{

    content:"";

    position:absolute;

    top:-20px;
    left:18%;

    width:64%;

    height:42px;

    background:
        linear-gradient(
            180deg,
            #ffca27,
            #d89500
        );

    border-radius:
        0 0 45px 45px;

    box-shadow:
        0 10px 18px rgba(255,184,0,.15);

}

.drip{

    position:absolute;

    top:0;

    width:25px;

    height:65px;

    background:
        linear-gradient(
            180deg,
            #ffc928,
            #d89600
        );

    border-radius:
        0 0 18px 18px;

    box-shadow:
        0 5px 12px rgba(255,184,0,.2);

}

.drip:nth-child(1){
    left:18%;
    height:62px;
}

.drip:nth-child(2){
    left:31%;
    height:35px;
}

.drip:nth-child(3){
    left:70%;
    height:58px;
}

.drip:nth-child(4){
    left:77%;
    height:30px;
}

.drip:nth-child(5){
    left:87%;
    height:45px;
}

/* =========================================================
   BRAND
========================================================= */

.brand{

    position:relative;

    z-index:5;

    display:flex;

    align-items:center;

    gap:12px;

    color:var(--gold2);

    font-size:30px;

    font-weight:bold;

    text-shadow:
        0 2px 12px rgba(255,193,7,.25);

}

.brand-icon{

    width:45px;
    height:45px;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:38px;

}

.brand small{

    display:block;

    font-size:11px;

    color:#777;

    text-align:center;

    margin-top:2px;

}

/* =========================================================
   LOGOUT
========================================================= */

.logout-btn{

    position:absolute;

    left:25px;

    top:0;

    height:100px;

    display:flex;

    align-items:center;

    gap:10px;

    border:0;

    background:transparent;

    color:#eee;

    font-size:17px;

    cursor:pointer;

    z-index:10;

}

.logout-btn:hover{
    color:var(--gold2);
}

.logout-icon{
    font-size:27px;
}

/* =========================================================
   USER MINI PROFILE
========================================================= */

.mini-profile{

    position:absolute;

    right:18px;

    top:9px;

    width:290px;

    height:82px;

    border:
        1px solid rgba(255,193,7,.27);

    border-radius:18px;

    display:flex;

    align-items:center;

    gap:13px;

    padding:10px 14px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(0,0,0,.15)
        );

    box-shadow:
        inset 0 0 25px rgba(255,193,7,.025);

}

.avatar{

    width:55px;
    height:55px;

    flex-shrink:0;

    border-radius:50%;

    object-fit:cover;

    border:
        2px solid rgba(255,255,255,.25);

    background:#252827;

}

.mini-info{

    display:flex;

    flex-direction:column;

    gap:5px;

}

.mini-name{

    font-size:16px;

    font-weight:bold;

}

.online-text{

    color:#aaa;

    font-size:12px;

    display:flex;

    align-items:center;

    gap:6px;

}

.online-dot{

    width:12px;
    height:12px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
        0 0 8px rgba(29,204,87,.6);

}

/* =========================================================
   LEFT SIDEBAR
========================================================= */

.sidebar-left{

    grid-column:1;
    grid-row:2;

    border-right:
        1px solid var(--border);

    background:
        linear-gradient(
            180deg,
            #101211,
            #0b0d0c
        );

    display:flex;

    flex-direction:column;

    overflow:hidden;

}

/* =========================================================
   LEFT NAV
========================================================= */

.left-nav{

    padding:18px 20px 8px;

}

.nav-button{

    width:100%;

    height:64px;

    border-radius:14px;

    border:
        1px solid transparent;

    background:transparent;

    color:#ddd;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 18px;

    font-family:inherit;

    font-size:17px;

    cursor:pointer;

    transition:.2s;

}

.nav-button:hover{

    background:
        rgba(255,193,7,.08);

}

.nav-button.active{

    background:
        linear-gradient(
            145deg,
            #ffc72b,
            #dda000
        );

    color:#17130a;

    box-shadow:
        0 5px 18px rgba(255,193,7,.13);

}

.nav-right{

    display:flex;

    align-items:center;

    gap:12px;

}

.nav-icon{

    font-size:26px;

}

.nav-title{

    font-weight:bold;

}

/* =========================================================
   SEARCH
========================================================= */

.search-box{

    margin:8px 20px 14px;

    height:62px;

    border:
        1px solid rgba(255,255,255,.08);

    border-radius:14px;

    background:#151817;

    display:flex;

    align-items:center;

    padding:0 15px;

    gap:12px;

}

.search-box input{

    width:100%;

    border:0;

    outline:0;

    background:transparent;

    color:white;

    font-family:inherit;

    font-size:14px;

}

.search-box input::placeholder{

    color:#777;

}

.search-icon{

    font-size:24px;

    color:#eee;

}

/* =========================================================
   PRIVATE TITLE
========================================================= */

.private-title{

    height:60px;

    padding:
        0 22px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    border-bottom:
        1px solid rgba(255,255,255,.08);

    color:#eee;

    font-size:17px;

}

.plus{

    font-size:29px;

    color:#fff;

}

/* =========================================================
   CHAT LIST
========================================================= */

.chat-list{

    flex:1;

    overflow-y:auto;

}

.chat-list::-webkit-scrollbar,
.online-list::-webkit-scrollbar,
.messages::-webkit-scrollbar{

    width:5px;

}

.chat-list::-webkit-scrollbar-thumb,
.online-list::-webkit-scrollbar-thumb,
.messages::-webkit-scrollbar-thumb{

    background:#3b3d3c;

    border-radius:10px;

}

.chat-item{

    height:103px;

    padding:14px 20px;

    display:flex;

    align-items:center;

    gap:14px;

    border-bottom:
        1px solid rgba(255,255,255,.055);

    cursor:pointer;

    transition:.18s;

}

.chat-item:hover{

    background:
        rgba(255,193,7,.055);

}

.chat-item.active{

    background:
        rgba(255,193,7,.08);

}

.chat-avatar{

    width:55px;
    height:55px;

    border-radius:50%;

    object-fit:cover;

    flex-shrink:0;

}

.chat-info{

    flex:1;

    min-width:0;

}

.chat-top{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:8px;

    margin-bottom:9px;

}

.chat-name{

    font-size:16px;

    font-weight:bold;

}

.chat-time{

    color:#aaa;

    font-size:11px;

}

.chat-preview{

    color:#aaa;

    font-size:13px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.unread{

    width:26px;
    height:26px;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #ffc928,
            #e4a500
        );

    color:#17130a;

    display:flex;

    align-items:center;
    justify-content:center;

    font-weight:bold;

    font-size:12px;

}

/* =========================================================
   LEFT BOTTOM
========================================================= */

.left-bottom{

    height:88px;

    padding:15px 22px;

    display:flex;

    gap:7px;

    border-top:
        1px solid rgba(255,255,255,.08);

}

.bottom-btn{

    flex:1;

    border:
        1px solid rgba(255,255,255,.06);

    border-radius:14px;

    background:#151817;

    color:#eee;

    font-size:25px;

    cursor:pointer;

}

.bottom-btn:hover{

    background:#1d201e;

    color:var(--gold2);

}

/* =========================================================
   CENTER
========================================================= */

.chat-center{

    grid-column:2;
    grid-row:2;

    min-width:0;

    display:flex;

    flex-direction:column;

    background:#0b0e0d;

    position:relative;

}

/* =========================================================
   CHAT HEADER
========================================================= */

.chat-header{

    height:96px;

    flex-shrink:0;

    border-bottom:
        1px solid var(--border);

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0 18px;

    background:
        linear-gradient(
            180deg,
            #101311,
            #0d100f
        );

    z-index:5;

}

.room-info{

    display:flex;

    align-items:center;

    gap:13px;

}

.room-hash{

    width:58px;
    height:58px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:14px;

    color:#ffc329;

    background:
        rgba(255,193,7,.10);

    border:
        1px solid rgba(255,193,7,.10);

    font-size:36px;

}

.room-title{

    display:flex;

    flex-direction:column;

    gap:7px;

}

.room-title strong{

    font-size:18px;

}

.room-title span{

    color:#9a9a9a;

    font-size:12px;

}

.room-online{

    display:flex;

    align-items:center;

    gap:12px;

    color:#eee;

    font-size:15px;

}

.room-online-dot{

    width:14px;
    height:14px;

    border-radius:50%;

    background:#1dcc57;

    box-shadow:
        0 0 9px rgba(29,204,87,.55);

}

.room-people{

    width:52px;
    height:52px;

    border:0;

    border-radius:14px;

    background:#252825;

    color:#fff;

    font-size:26px;

}

/* =========================================================
   MESSAGES AREA
========================================================= */

.messages{

    flex:1;

    overflow-y:auto;

    padding:
        20px 22px 25px;

    position:relative;

    background-color:#0d1110;

    background-image:

        radial-gradient(
            circle at 10px 10px,
            rgba(255,193,7,.07) 1px,
            transparent 2px
        ),

        linear-gradient(
            60deg,
            transparent 45%,
            rgba(255,193,7,.035) 46%,
            transparent 47%
        ),

        linear-gradient(
            -60deg,
            transparent 45%,
            rgba(255,193,7,.035) 46%,
            transparent 47%
        );

    background-size:
        30px 30px,
        42px 42px,
        42px 42px;

}

/* =========================================================
   DATE
========================================================= */

.date-separator{

    width:max-content;

    margin:
        0 auto 20px;

    padding:
        8px 15px;

    border-radius:20px;

    background:
        rgba(18,20,19,.88);

    border:
        1px solid rgba(255,255,255,.06);

    color:#bbb;

    font-size:12px;

    box-shadow:
        0 4px 12px rgba(0,0,0,.2);

}

/* =========================================================
   MESSAGE ROW
========================================================= */

.message-row{

    display:flex;

    align-items:flex-end;

    gap:9px;

    margin-bottom:18px;

    width:100%;

}

.message-row.other{

    justify-content:flex-start;

}

.message-row.mine{

    justify-content:flex-end;

}

.message-avatar{

    width:47px;
    height:47px;

    border-radius:50%;

    object-fit:cover;

    flex-shrink:0;

    border:
        1px solid rgba(255,255,255,.16);

}

.message{

    max-width:70%;

    min-width:120px;

    padding:
        12px 15px 8px;

    border-radius:13px;

    position:relative;

    background:
        linear-gradient(
            145deg,
            #171a19,
            #131615
        );

    border:
        1px solid rgba(255,255,255,.10);

    box-shadow:
        0 5px 16px rgba(0,0,0,.22);

}

.message.mine{

    background:
        linear-gradient(
            145deg,
            #ffc72b,
            #dfa300
        );

    color:#211a08;

    border:
        1px solid #ffca32;

    border-bottom-right-radius:4px;

}

.message.other{

    border-bottom-left-radius:4px;

}

.message-name{

    color:#eeb32c;

    font-size:14px;

    font-weight:bold;

    margin-bottom:7px;

}

.message.mine .message-name{

    color:#574000;

}

.message-text{

    font-size:15px;

    line-height:1.8;

    word-break:break-word;

}

.message-meta{

    display:flex;

    justify-content:flex-end;

    align-items:center;

    gap:5px;

    margin-top:3px;

    color:#aaa;

    font-size:10px;

}

.message.mine .message-meta{

    color:#5f4a08;

}

.checks{

    font-size:14px;

}

/* =========================================================
   SYSTEM MESSAGE
========================================================= */

.system-message{

    width:max-content;

    max-width:80%;

    margin:
        12px auto 20px;

    padding:
        9px 16px;

    border-radius:20px;

    background:
        rgba(10,12,11,.85);

    border:
        1px solid rgba(255,193,7,.10);

    color:#ccc;

    font-size:12px;

}

/* =========================================================
   INPUT
========================================================= */

.input-area{

    min-height:93px;

    flex-shrink:0;

    padding:
        13px 16px;

    border-top:
        1px solid var(--border);

    background:
        #0e1110;

    display:flex;

    align-items:center;

    gap:9px;

}

.tool-btn{

    width:52px;
    height:52px;

    flex-shrink:0;

    border-radius:14px;

    border:
        1px solid rgba(255,255,255,.07);

    background:#1a1d1b;

    color:#f2b800;

    font-size:26px;

    cursor:pointer;

}

.tool-btn:hover{

    background:#222623;

}

.message-input{

    flex:1;

    min-width:0;

    height:54px;

    border:
        1px solid rgba(255,255,255,.08);

    background:
        #191b1a;

    color:#fff;

    border-radius:15px;

    outline:0;

    padding:
        0 18px;

    font-family:inherit;

    font-size:14px;

}

.message-input:focus{

    border-color:
        rgba(255,193,7,.3);

}

.message-input::placeholder{

    color:#777;

}

.send-btn{

    width:76px;
    height:58px;

    flex-shrink:0;

    border:0;

    border-radius:14px;

    background:
        linear-gradient(
            145deg,
            #ffca28,
            #dfa000
        );

    color:#16130b;

    font-size:29px;

    cursor:pointer;

    box-shadow:
        0 5px 17px rgba(255,193,7,.16);

}

.send-btn:active{

    transform:scale(.96);

}

/* =========================================================
   RIGHT SIDEBAR
========================================================= */

.sidebar-right{

    grid-column:3;
    grid-row:2;

    border-left:
        1px solid var(--border);

    background:
        linear-gradient(
            180deg,
            #101311,
            #0b0d0c
        );

    display:flex;

    flex-direction:column;

    overflow:hidden;

}

/* =========================================================
   ONLINE HEADER
========================================================= */

.online-header{

    height:99px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-bottom:
        1px solid rgba(255,255,255,.08);

    font-size:18px;

}

.online-count{

    color:#27d76a;

    margin-right:7px;

}

/* =========================================================
   ONLINE LIST
========================================================= */

.online-list{

    flex:1;

    overflow-y:auto;

}

.online-user{

    min-height:100px;

    padding:
        15px 24px;

    display:flex;

    align-items:center;

    gap:15px;

    border-bottom:
        1px solid rgba(255,255,255,.065);

    cursor:pointer;

}

.online-user:hover{

    background:
        rgba(255,193,7,.045);

}

.online-avatar-wrap{

    position:relative;

}

.online-avatar{

    width:58px;
    height:58px;

    border-radius:50%;

    object-fit:cover;

    border:
        1px solid rgba(255,255,255,.16);

}

.online-status{

    position:absolute;

    width:13px;
    height:13px;

    bottom:2px;
    right:1px;

    border-radius:50%;

    background:#1dcc57;

    border:
        2px solid #101311;

}

.online-info{

    flex:1;

    display:flex;

    flex-direction:column;

    gap:6px;

}

.online-name{

    font-size:16px;

    font-weight:bold;

}

.online-state{

    color:#aaa;

    font-size:12px;

    display:flex;

    align-items:center;

    gap:7px;

}

.crown{

    font-size:25px;

    margin-right:auto;

}

/* =========================================================
   RIGHT FOOTER
========================================================= */

.right-footer{

    height:145px;

    border-top:
        1px solid rgba(255,255,255,.08);

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:8px;

}

.footer-logo{

    color:#ffc52b;

    font-size:21px;

    font-weight:bold;

}

.version{

    color:#aaa;

    font-size:12px;

}

/* =========================================================
   EMOJI PANEL
========================================================= */

.emoji-panel{

    position:absolute;

    bottom:86px;

    right:85px;

    width:260px;

    padding:15px;

    border:
        1px solid rgba(255,193,7,.2);

    border-radius:16px;

    background:#171a18;

    box-shadow:
        0 15px 40px rgba(0,0,0,.5);

    display:none;

    grid-template-columns:
        repeat(6,1fr);

    gap:7px;

    z-index:30;

}

.emoji-panel.show{

    display:grid;

}

.emoji-item{

    width:32px;
    height:32px;

    border:0;

    background:transparent;

    font-size:22px;

    cursor:pointer;

    border-radius:7px;

}

.emoji-item:hover{

    background:#282c29;

}

/* =========================================================
   IMAGE PREVIEW
========================================================= */

.image-preview{

    position:absolute;

    bottom:90px;

    right:20px;

    width:230px;

    padding:8px;

    border-radius:15px;

    background:#171a18;

    border:
        1px solid rgba(255,193,7,.2);

    display:none;

    z-index:30;

}

.image-preview img{

    width:100%;

    max-height:170px;

    object-fit:cover;

    border-radius:10px;

}

.preview-close{

    position:absolute;

    left:7px;
    top:7px;

    width:27px;
    height:27px;

    border:0;

    border-radius:50%;

    background:#000b;

    color:#fff;

}

/* =========================================================
   MODAL
========================================================= */

.modal{

    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.72);

    display:none;

    align-items:center;
    justify-content:center;

    z-index:100;

    padding:20px;

}

.modal.show{

    display:flex;

}

.modal-card{

    width:min(420px,100%);

    background:
        linear-gradient(
            180deg,
            #171a18,
            #0e100f
        );

    border:
        1px solid rgba(255,193,7,.22);

    border-radius:22px;

    padding:25px;

    box-shadow:
        0 20px 70px rgba(0,0,0,.6);

}

.modal-title{

    color:#ffc52a;

    font-size:20px;

    margin-bottom:20px;

}

.modal-close{

    float:left;

    border:0;

    background:transparent;

    color:#aaa;

    font-size:24px;

}

/* =========================================================
   TOAST
========================================================= */

.toast{

    position:fixed;

    bottom:25px;

    left:50%;

    transform:
        translate(-50%,30px);

    opacity:0;

    pointer-events:none;

    padding:
        12px 20px;

    border-radius:14px;

    background:#1d211f;

    border:
        1px solid rgba(255,193,7,.2);

    color:#eee;

    transition:.25s;

    z-index:200;

}

.toast.show{

    opacity:1;

    transform:
        translate(-50%,0);

}

/* =========================================================
   LOADING
========================================================= */

.loading{

    position:absolute;

    inset:0;

    display:none;

    align-items:center;

    justify-content:center;

    background:
        rgba(9,11,10,.7);

    z-index:50;

}

.loading.show{

    display:flex;

}

.loader{

    width:44px;
    height:44px;

    border:
        4px solid rgba(255,193,7,.15);

    border-top-color:#ffc52b;

    border-radius:50%;

    animation:
        spin .8s linear infinite;

}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}

/* =========================================================
   MOBILE
========================================================= */

.mobile-menu-btn{

    display:none;

    position:absolute;

    right:15px;

    top:28px;

    width:45px;
    height:45px;

    border:0;

    border-radius:12px;

    background:#202421;

    color:#fff;

    font-size:23px;

    z-index:50;

}
