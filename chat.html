<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="theme-color" content="#0b0c0b">

<title>عسل چت 🍯</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background:#080908;
    color:#fff;

    -webkit-tap-highlight-color:transparent;
}

/* =========================================================
   APP
========================================================= */

#app{
    width:100%;
    height:100dvh;

    display:flex;
    flex-direction:column;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(255,193,7,.08),
            transparent 38%
        ),
        #080908;
}

/* =========================================================
   HEADER
========================================================= */

.chat-header{
    height:64px;
    min-height:64px;

    display:flex;
    align-items:center;

    padding:0 12px;

    background:
        linear-gradient(
            135deg,
            #181812,
            #0d0e0c
        );

    border-bottom:
        1px solid
        rgba(255,193,7,.15);

    box-shadow:
        0 3px 18px
        rgba(0,0,0,.45);

    position:relative;
    z-index:50;
}

.logo{
    width:42px;
    height:42px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:23px;

    background:
        linear-gradient(
            145deg,
            #ffc107,
            #d99500
        );

    box-shadow:
        0 0 18px
        rgba(255,193,7,.25);

    margin-left:10px;

    cursor:pointer;

    flex-shrink:0;
}

.header-info{
    flex:1;
    min-width:0;
}

.header-title{
    font-size:17px;
    font-weight:bold;

    color:#ffd45a;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.header-status{
    margin-top:4px;

    font-size:11px;

    color:#8f948d;

    display:flex;
    align-items:center;
    gap:5px;
}

.online-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#42d96b;

    box-shadow:
        0 0 8px
        rgba(66,217,107,.65);
}

.header-actions{
    display:flex;
    align-items:center;
    gap:6px;
}

.header-btn{
    width:38px;
    height:38px;

    border:none;
    outline:none;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#ddd;

    background:
        rgba(255,255,255,.05);

    font-size:18px;

    cursor:pointer;

    transition:.2s;
}

.header-btn:active{
    transform:scale(.9);

    background:
        rgba(255,193,7,.14);
}

/* =========================================================
   CHAT AREA
========================================================= */

.chat-area{
    flex:1;

    position:relative;

    overflow:hidden;

    display:flex;
    flex-direction:column;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,193,7,.025),
            transparent 25%
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(255,193,7,.018),
            transparent 28%
        ),
        #090a09;
}

.honey-bg{
    position:absolute;
    inset:0;

    pointer-events:none;

    opacity:.7;

    background-image:
        radial-gradient(
            circle,
            rgba(255,193,7,.045) 1px,
            transparent 1.5px
        );

    background-size:28px 28px;
}

/* =========================================================
   MESSAGES
========================================================= */

#messages{
    flex:1;

    overflow-y:auto;
    overflow-x:hidden;

    padding:
        14px
        10px
        90px;

    position:relative;
    z-index:2;

    scroll-behavior:smooth;
}

#messages::-webkit-scrollbar{
    width:4px;
}

#messages::-webkit-scrollbar-track{
    background:transparent;
}

#messages::-webkit-scrollbar-thumb{
    background:#383a34;
    border-radius:10px;
}

/* =========================================================
   EMPTY
========================================================= */

.empty-chat{
    width:100%;
    min-height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    color:#777b73;

    padding:30px;
}

.empty-box{
    max-width:280px;
}

.empty-icon{
    font-size:48px;
    margin-bottom:12px;
}

.empty-title{
    font-size:17px;
    color:#d0d0ca;
    margin-bottom:7px;
}

.empty-text{
    font-size:12px;
    line-height:2;
    color:#777b73;
}

/* =========================================================
   MESSAGE
========================================================= */

.message-row{
    width:100%;

    display:flex;

    margin-bottom:8px;

    animation:
        messageIn .2s ease;
}

.message-row.me{
    justify-content:flex-start;
}

.message-row.other{
    justify-content:flex-end;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateY(5px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.message-bubble{
    max-width:78%;

    padding:
        9px
        12px;

    border-radius:15px;

    position:relative;

    word-break:break-word;

    line-height:1.7;

    font-size:14px;
}

.message-row.me .message-bubble{

    background:
        linear-gradient(
            145deg,
            #272820,
            #1d1e1a
        );

    border-bottom-right-radius:4px;

    border:
        1px solid
        rgba(255,255,255,.035);
}

.message-row.other .message-bubble{

    background:
        linear-gradient(
            145deg,
            #5b4208,
            #3c2d08
        );

    border-bottom-left-radius:4px;

    border:
        1px solid
        rgba(255,193,7,.10);
}

.message-name{
    font-size:11px;

    color:#ffc928;

    margin-bottom:3px;

    font-weight:bold;
}

.message-text{
    color:#f0f0eb;

    white-space:pre-wrap;
}

.message-time{
    font-size:9px;

    color:#888b84;

    margin-top:3px;

    text-align:left;
}

/* =========================================================
   IMAGE MESSAGE
========================================================= */

.chat-image{
    display:block;

    width:auto;
    max-width:240px;
    max-height:320px;

    border-radius:12px;

    margin-top:5px;

    object-fit:cover;

    cursor:pointer;
}

/* =========================================================
   INPUT
========================================================= */

.input-area{
    position:absolute;

    right:0;
    bottom:0;
    left:0;

    z-index:20;

    padding:
        8px
        9px
        calc(8px + env(safe-area-inset-bottom));

    background:
        linear-gradient(
            to top,
            #080908 75%,
            transparent
        );
}

.input-box{
    width:100%;

    min-height:48px;

    display:flex;
    align-items:flex-end;

    gap:7px;

    padding:6px;

    border-radius:25px;

    background:#171914;

    border:
        1px solid
        rgba(255,193,7,.13);

    box-shadow:
        0 5px 25px
        rgba(0,0,0,.45);
}

.input-btn{
    flex:0 0 38px;

    width:38px;
    height:38px;

    border:none;
    outline:none;

    border-radius:50%;

    background:
        rgba(255,255,255,.045);

    color:#aaa;

    font-size:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:.2s;
}

.input-btn:active{
    transform:scale(.9);

    background:
        rgba(255,193,7,.14);

    color:#ffc107;
}

#messageInput{
    flex:1;

    min-width:0;

    max-height:110px;

    min-height:36px;

    resize:none;

    border:none;
    outline:none;

    background:transparent;

    color:#fff;

    font-family:inherit;

    font-size:14px;

    line-height:1.6;

    padding:
        7px
        5px;

    overflow-y:auto;
}

#messageInput::placeholder{
    color:#6f726b;
}

.send-btn{
    flex:0 0 40px;

    width:40px;
    height:40px;

    border:none;
    outline:none;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #ffc107,
            #d99500
        );

    color:#16130a;

    font-size:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    box-shadow:
        0 3px 12px
        rgba(255,193,7,.22);

    transition:.2s;
}

.send-btn:active{
    transform:scale(.9);
}

.send-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

/* =========================================================
   CONNECTION
========================================================= */

.connection-status{
    position:absolute;

    top:10px;
    left:50%;

    transform:translateX(-50%);

    z-index:30;

    padding:
        5px
        12px;

    border-radius:20px;

    font-size:10px;

    color:#aaa;

    background:
        rgba(20,21,18,.9);

    border:
        1px solid
        rgba(255,255,255,.05);

    backdrop-filter:blur(8px);

    opacity:0;

    pointer-events:none;

    transition:.3s;
}

.connection-status.show{
    opacity:1;
}

.connection-status.online{
    color:#55d978;
}

.connection-status.offline{
    color:#ff6969;
}

/* =========================================================
   PROFILE OVERLAY
========================================================= */

.profile-overlay{
    position:fixed;

    inset:0;

    z-index:200;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        rgba(0,0,0,.72);

    backdrop-filter:blur(5px);

    opacity:0;

    pointer-events:none;

    transition:.25s;
}

.profile-overlay.show{
    opacity:1;
    pointer-events:auto;
}

.profile-box{
    width:100%;
    max-width:360px;

    padding:22px 18px;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            #1b1c16,
            #0d0e0c
        );

    border:
        1px solid
        rgba(255,193,7,.16);

    box-shadow:
        0 15px 50px
        rgba(0,0,0,.65);

    text-align:center;
}

.profile-avatar{
    position:relative;

    width:82px;
    height:82px;

    margin:0 auto 12px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #ffc107,
            #9b6900
        );

    color:#17130a;

    font-size:32px;

    font-weight:bold;

    overflow:hidden;

    cursor:pointer;

    box-shadow:
        0 0 25px
        rgba(255,193,7,.18);
}

.profile-avatar img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
}

.avatar-camera{
    position:absolute;

    right:2px;
    bottom:2px;

    width:27px;
    height:27px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#ffc107;

    color:#17130a;

    font-size:13px;

    border:
        2px solid
        #11120f;
}

.profile-title{
    color:#ffd45a;

    font-size:18px;

    font-weight:bold;

    margin-bottom:18px;
}

.profile-label{
    display:block;

    text-align:right;

    color:#999d94;

    font-size:11px;

    margin-bottom:6px;
}

#profileName{
    width:100%;

    height:45px;

    padding:0 13px;

    border-radius:12px;

    border:
        1px solid
        rgba(255,255,255,.08);

    outline:none;

    background:#11120f;

    color:#fff;

    font-family:inherit;

    font-size:14px;

    text-align:right;
}

#profileName:focus{
    border-color:
        rgba(255,193,7,.45);
}

.profile-actions{
    display:flex;

    gap:8px;

    margin-top:16px;
}

.profile-action{
    flex:1;

    height:43px;

    border:0;
    outline:0;

    border-radius:12px;

    font-family:inherit;

    cursor:pointer;
}

.profile-save{
    background:
        linear-gradient(
            145deg,
            #ffc107,
            #d99500
        );

    color:#18140a;

    font-weight:bold;
}

.profile-cancel{
    background:
        rgba(255,255,255,.06);

    color:#ddd;
}

.profile-hint{
    margin-top:12px;

    color:#6f736b;

    font-size:10px;

    line-height:1.8;
}

/* =========================================================
   USERS PANEL
========================================================= */

.users-overlay{
    position:fixed;

    inset:0;

    z-index:180;

    background:
        rgba(0,0,0,.65);

    opacity:0;

    pointer-events:none;

    transition:.2s;
}

.users-overlay.show{
    opacity:1;
    pointer-events:auto;
}

.users-panel{
    position:absolute;

    top:0;
    right:0;

    width:310px;
    max-width:88%;

    height:100%;

    background:
        linear-gradient(
            160deg,
            #181912,
            #0c0d0b
        );

    border-left:
        1px solid
        rgba(255,193,7,.13);

    box-shadow:
        -10px 0 35px
        rgba(0,0,0,.5);

    transform:translateX(100%);

    transition:.25s;

    display:flex;

    flex-direction:column;
}

.users-overlay.show .users-panel{
    transform:translateX(0);
}

.users-header{
    min-height:64px;

    padding:0 15px;

    display:flex;

    align-items:center;

    border-bottom:
        1px solid
        rgba(255,255,255,.06);
}

.users-title{
    flex:1;

    color:#ffd45a;

    font-size:16px;

    font-weight:bold;
}

.close-users{
    width:38px;
    height:38px;

    border:0;

    border-radius:50%;

    background:
        rgba(255,255,255,.05);

    color:#ddd;

    font-size:18px;
}

#usersList{
    flex:1;

    overflow-y:auto;

    padding:10px;
}

.user-item{
    display:flex;

    align-items:center;

    gap:10px;

    padding:9px;

    margin-bottom:6px;

    border-radius:13px;

    background:
        rgba(255,255,255,.035);
}

.user-avatar{
    width:38px;
    height:38px;

    flex-shrink:0;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #ffc107,
            #9b6900
        );

    color:#17130a;

    font-weight:bold;

    overflow:hidden;
}

.user-avatar img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.user-name{
    flex:1;

    color:#eee;

    font-size:13px;

    overflow:hidden;

    text-overflow:ellipsis;
}

.user-online{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#42d96b;

    box-shadow:
        0 0 7px
        rgba(66,217,107,.6);
}

.no-users{
    text-align:center;

    color:#777;

    font-size:12px;

    padding:30px 10px;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:360px){

    .chat-header{
        height:58px;
        min-height:58px;
        padding:0 9px;
    }

    .logo{
        width:38px;
        height:38px;
        font-size:20px;
    }

    .header-title{
        font-size:15px;
    }

    .message-bubble{
        max-width:84%;
        font-size:13px;
    }

}

@supports(padding:max(0px)){

    .input-area{
        padding-bottom:
            max(
                8px,
                env(safe-area-inset-bottom)
            );
    }

}

::selection{
    background:#9d7600;
    color:#fff;
}

</style>
</head>


<body>

<div id="app">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="chat-header">

        <div
            class="logo"
            id="profileOpen"
            title="پروفایل">
            🍯
        </div>

        <div class="header-info">

            <div class="header-title">
                عسل چت
            </div>

            <div class="header-status">

                <span class="online-dot"></span>

                <span id="onlineStatus">

                </span>

            </div>

        </div>

        <div class="header-actions">

            <button
                class="header-btn"
                id="usersBtn"
                type="button"
                title="کاربران آنلاین">
                👥
            </button>

            <button
                class="header-btn"
                id="exitBtn"
                type="button"
                title="خروج">
                ⎋
            </button>

        </div>

    </header>


    <!-- =====================================================

    ====================================================== -->

    <main class="chat-area">

                    </div>

                    <div class="empty-text">

                    </div>

                </div>

            </div>

        </div>


        <!-- =================================================
             INPUT
        ================================================== -->

        <div class="input-area">

            <div class="input-box">

                <button
                    class="input-btn"
                    id="attachBtn"
                    type="button"
                    title="ارسال عکس">
                    📎
                </button>

                <textarea
                    id="messageInput"
                    rows="1"
                    maxlength="2000"
                    placeholder="پیام خود را بنویسید..."
                    autocomplete="off">
                </textarea>

                <button
                    class="send-btn"
                    id="sendBtn"
                    type="button">
                    ➤
                </button>

            </div>

        </div>

    </main>

</div>


<!-- =========================================================
     PROFILE
========================================================= -->

<div
    class="profile-overlay"
    id="profileOverlay">

    <div class="profile-box">

        <div
            class="profile-avatar"
            id="profileAvatar">

            <span id="avatarLetter">
                م
            </span>

            <div class="avatar-camera">
                📷
            </div>

        </div>

        <div class="profile-title">
            پروفایل من
        </div>

        <label
            class="profile-label"
            for="profileName">
            نام نمایشی
        </label>

        <input
            id="profileName"
            type="text"
            maxlength="30"
            autocomplete="off"
            placeholder="نام خود را وارد کنید">

        <div class="profile-actions">

            <button
                class="profile-action profile-cancel"
                id="profileCancel"
                type="button">
                انصراف
            </button>

            <button
                class="profile-action profile-save"
                id="profileSave"
                type="button">
                ذخیره
            </button>

        </div>

        <div class="profile-hint">
            روی عکس بزن تا تصویر پروفایل انتخاب کنی.
        </div>

    </div>

</div>


<!-- =========================================================
     USERS
========================================================= -->

<div
    class="users-overlay"
    id="usersOverlay">

    <div class="users-panel">

        <div class="users-header">

            <div class="users-title">
                کاربران آنلاین 👥
            </div>

            <button
                class="close-users"
                id="closeUsers"
                type="button">
                ✕
            </button>

        </div>

        <div id="usersList">

            <div class="no-users">
                در حال دریافت کاربران...
            </div>

        </div>

    </div>

</div>

const profileOverlay =
    document.getElementById(
        "profileOverlay"
    );

const profileAvatar =
    document.getElementById(
        "profileAvatar"
    );

const avatarLetter =
    document.getElementById(
        "avatarLetter"
    );

const profileName =
    document.getElementById(
        "profileName"
    );

const profileSave =
    document.getElementById(
        "profileSave"
    );

const profileCancel =
    document.getElementById(
        "profileCancel"
    );


/* =========================================================
   USERS ELEMENTS
========================================================= */

const usersOverlay =
    document.getElementById(
        "usersOverlay"
    );

const usersList =
    document.getElementById(
        "usersList"
    );

const closeUsers =
    document.getElementById(
        "closeUsers"
    );


/* =========================================================
   USER
========================================================= */

let username =
    localStorage.getItem(
        "username"
    );

if(
    !username ||
    !username.trim()
){

    username =
        "مهمان";

    localStorage.setItem(
        "username",
        username
    );

}


/* =========================================================
   ROOM
========================================================= */

const ROOM_NAME =
    "asal-chat";


const messagesRef =
    ref(
        db,
        "rooms/" +
        ROOM_NAME +
        "/messages"
    );


/* =========================================================
   SAFE USER ID
========================================================= */

let safeUser =
    username
        .replace(
            /[.#$[\]/]/g,
            "_"
        )
        .substring(
            0,
            40
        );


/* =========================================================
   ONLINE REF
========================================================= */

const onlineRef =
    ref(
        db,
        "rooms/" +
        ROOM_NAME +
        "/online/" +
        safeUser
    );


const onlineUsersRef =
    ref(
        db,
        "rooms/" +
        ROOM_NAME +
        "/online"
    );


/* =========================================================
   CONNECTION
========================================================= */

const connectedRef =
    ref(
        db,
        ".info/connected"
    );


onValue(
    connectedRef,
    async function(snapshot){

        if(
            snapshot.val() === true
        ){

            onlineStatus.textContent =
                "آنلاین";

            connectionStatus.textContent =
                "متصل شد";

            connectionStatus.classList.add(
                "show",
                "online"
            );


            setTimeout(
                function(){

                    connectionStatus.classList.remove(
                        "show"
                    );

                },
                1500
            );


            try{

                await set(
                    onlineRef,
                    {
                        name:
                            username,

                        avatar:
                            localStorage.getItem(
                                "profileAvatar"
                            ) || "",

                        time:
                            serverTimestamp()
                    }
                );


                onDisconnect(
                    onlineRef
                ).remove();

            }catch(error){

                console.error(
                    "Online error:",
                    error
                );

            }

        }else{

            onlineStatus.textContent =
                "قطع اتصال";

            connectionStatus.textContent =
                "اتصال به سرور قطع شد";

            connectionStatus.classList.add(
                "show",
                "offline"
            );

        }

    }
);


/* =========================================================
   ONLINE USERS
========================================================= */

onValue(
    onlineUsersRef,
    function(snapshot){

        const data =
            snapshot.val() || {};

        const users =
            Object.entries(
                data
            );


        if(
            users.length === 0
        ){

            onlineStatus.textContent =
                "آنلاین";

        }else{

            onlineStatus.textContent =
                users.length +
                " نفر آنلاین";

        }


        renderUsers(
            users
        );

    }
);


/* =========================================================
   RENDER USERS
========================================================= */

function renderUsers(users){

    usersList.innerHTML =
        "";


    if(
        users.length === 0
    ){

        usersList.innerHTML =
            '<div class="no-users">' +
            'کاربری آنلاین نیست.' +
            '</div>';

        return;

    }


    users.forEach(
        function(item){

            const data =
                item[1] || {};


            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "user-item";


            const avatar =
                document.createElement(
                    "div"
                );

            avatar.className =
                "user-avatar";


            if(
                data.avatar
            ){

                const img =
                    document.createElement(
                        "img"
                    );

                img.src =
                    data.avatar;

                img.alt =
                    "";

                avatar.appendChild(
                    img
                );

            }else{

                avatar.textContent =
                    (
                        data.name ||
                        "م"
                    ).charAt(0);

            }


            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "user-name";

            name.textContent =
                data.name ||
                "مهمان";


            const dot =
                document.createElement(
                    "div"
                );

            dot.className =
                "user-online";


            row.appendChild(
                avatar
            );

            row.appendChild(
                name
            );

            row.appendChild(
                dot
            );


            usersList.appendChild(
                row
            );

        }
    );

}


/* =========================================================
   INPUT RESIZE
========================================================= */

function resizeInput(){

    messageInput.style.height =
        "auto";

    messageInput.style.height =
        Math.min(
            messageInput.scrollHeight,
            110
        ) +
        "px";

}


messageInput.addEventListener(
    "input",
    resizeInput
);


/* =========================================================
   BUTTON STATE
========================================================= */

function updateSendButton(){

    sendBtn.disabled =
        messageInput.value
            .trim()
            .length === 0;

}

messageInput.addEventListener(
    "input",
    updateSendButton
);

updateSendButton();


/* =========================================================
   ENTER SEND
========================================================= */

messageInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

    const text =
        messageInput.value.trim();


    if(!text){
        return;
    }


    if(
        text.length > 2000
    ){

        alert(
            "پیام خیلی طولانی است."
        );

        return;

    }


    sendBtn.disabled =
        true;


    try{

        await push(
            messagesRef,
            {

                type:
                    "text",

                name:
                    username,

                text:
                    text,

                avatar:
                    localStorage.getItem(
                        "profileAvatar"
                    ) || "",

                time:
                    serverTimestamp(),

                createdAt:
                    Date.now()

            }
        );


        messageInput.value =
            "";

        resizeInput();

        updateSendButton();


    }catch(error){

        console.error(
            "Send error:",
            error
        );

        alert(
            "پیام ارسال نشد.\n" +
            "قوانین Realtime Database یا اتصال Firebase را بررسی کن."
        );

        updateSendButton();

    }

}


/* =========================================================
   RECEIVE
========================================================= */

onChildAdded(
    messagesRef,
    function(snapshot){

        const data =
            snapshot.val();


        if(!data){
            return;
        }


        renderMessage(
            data
        );

    }
);


/* =========================================================
   RENDER MESSAGE
========================================================= */

function renderMessage(data){

    const empty =
        messages.querySelector(
            ".empty-chat"
        );


    if(empty){

        empty.remove();

    }


    const mine =
        data.name === username;


    const row =
        document.createElement(
            "div"
        );

    row.className =
        "message-row " +
        (
            mine
                ? "me"
                : "other"
        );


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "message-bubble";


    const name =
        document.createElement(
            "div"
        );

    name.className =
        "message-name";

    name.textContent =
        data.name ||
        "مهمان";


    bubble.appendChild(
        name
    );


    if(
        data.type === "image" &&
        data.image
    ){

        const img =
            document.createElement(
                "img"
            );

        img.className =
            "chat-image";

        img.src =
            data.image;

        img.alt =
            "تصویر";

        img.loading =
            "lazy";


        img.addEventListener(
            "click",
            function(){

                window.open(
                    data.image,
                    "_blank"
                );

            }
        );


        bubble.appendChild(
            img
        );

    }else{

        const text =
            document.createElement(
                "div"
            );

        text.className =
            "message-text";

        text.textContent =
            data.text ||
            "";

        bubble.appendChild(
            text
        );

    }


    const time =
        document.createElement(
            "div"
        );

    time.className =
        "message-time";


    let date;


    if(
        typeof data.time ===
        "number"
    ){

        date =
            new Date(
                data.time
            );

    }else{

        date =
            new Date(
                data.createdAt ||
                Date.now()
            );

    }


    time.textContent =
        date.toLocaleTimeString(
            "fa-IR",
            {
                hour:
                    "2-digit",

                minute:
                    "2-digit"
            }
        );


    bubble.appendChild(
        time
    );


    row.appendChild(
        bubble
    );


    messages.appendChild(
        row
    );


    requestAnimationFrame(
        function(){

            messages.scrollTop =
                messages.scrollHeight;

        }
    );

}


/* =========================================================
   SEND CLICK
========================================================= */

sendBtn.addEventListener(
    "click",
    sendMessage
);


/* =========================================================
   IMAGE SELECT
========================================================= */

const imageInput =
    document.createElement(
        "input"
    );

imageInput.type =
    "file";

imageInput.accept =
    "image/*";

imageInput.style.display =
    "none";

document.body.appendChild(
    imageInput
);


/* =========================================================
   ATTACH BUTTON
========================================================= */

attachBtn.addEventListener(
    "click",
    function(){

        imageInput.click();

    }
);


/* =========================================================
   SEND IMAGE
========================================================= */

imageInput.addEventListener(
    "change",
    async function(){

        const file =
            imageInput.files[0];


        if(!file){
            return;
        }


        if(
            !file.type.startsWith(
                "image/"
            )
        ){

            alert(
                "فقط فایل تصویری انتخاب کنید."
            );

            imageInput.value =
                "";

            return;

        }


        if(
            file.size >
            10 * 1024 * 1024
        ){

            alert(
                "حجم عکس نباید بیشتر از ۱۰ مگابایت باشد."
            );

            imageInput.value =
                "";

            return;

        }


        attachBtn.disabled =
            true;


        try{

            const fileName =
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .substring(
                        2,
                        9
                    ) +
                "_" +
                file.name;


            const fileRef =
                storageRef(
                    storage,
                    "chatImages/" +
                    ROOM_NAME +
                    "/" +
                    fileName
                );


            const result =
                await uploadBytes(
                    fileRef,
                    file
                );


            const url =
                await getDownloadURL(
                    result.ref
                );


            await push(
                messagesRef,
                {

                    type:
                        "image",

                    name:
                        username,

                    image:
                        url,

                    avatar:
                        localStorage.getItem(
                            "profileAvatar"
                        ) || "",

                    time:
                        serverTimestamp(),

                    createdAt:
                        Date.now()

                }
            );


        }catch(error){

            console.error(
                "Image upload error:",
                error
            );


            alert(
                "ارسال عکس انجام نشد.\n" +
                "مطمئن شو Firebase Storage فعال است و قوانین آن اجازه آپلود می‌دهند."
            );

        }finally{

            attachBtn.disabled =
                false;

            imageInput.value =
                "";

        }

    }
);


/* =========================================================
   PROFILE OPEN
========================================================= */

profileOpen.addEventListener(
    "click",
    function(){

        profileName.value =
            username;

        updateAvatarLetter();

        profileOverlay.classList.add(
            "show"
        );

    }
);


/* =========================================================
   PROFILE CLOSE
========================================================= */

function closeProfile(){

    profileOverlay.classList.remove(
        "show"
    );

}


/* =========================================================
   PROFILE CANCEL
========================================================= */

profileCancel.addEventListener(
    "click",
    closeProfile
);


/* =========================================================
   PROFILE CLICK OUTSIDE
========================================================= */

profileOverlay.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            profileOverlay
        ){

            closeProfile();

        }

    }
);


/* =========================================================
   PROFILE NAME
========================================================= */

profileName.addEventListener(
    "input",
    updateAvatarLetter
);


function updateAvatarLetter(){

    const name =
        profileName.value.trim() ||
        username ||
        "م";


    if(
        !profileAvatar.querySelector(
            "img"
        )
    ){

        avatarLetter.textContent =
            name.charAt(0);

    }

}


/* =========================================================
   PROFILE PHOTO INPUT
========================================================= */

const avatarInput =
    document.createElement(
        "input"
    );

avatarInput.type =
    "file";

avatarInput.accept =
    "image/*";

avatarInput.style.display =
    "none";

document.body.appendChild(
    avatarInput
);


profileAvatar.addEventListener(
    "click",
    function(){

        avatarInput.click();

    }
);


/* =========================================================
   SHOW AVATAR
========================================================= */

function showAvatar(url){

    if(!url){
        return;
    }


    let img =
        profileAvatar.querySelector(
            "img"
        );


    if(!img){

        img =
            document.createElement(
                "img"
            );

        profileAvatar.insertBefore(
            img,
            avatarLetter
        );

    }


    img.src =
        url;

    avatarLetter.style.display =
        "none";

}


/* =========================================================
   LOAD AVATAR
========================================================= */

const savedAvatar =
    localStorage.getItem(
        "profileAvatar"
    );


if(savedAvatar){

    showAvatar(
        savedAvatar
    );

}


/* =========================================================
   AVATAR CHANGE
========================================================= */

avatarInput.addEventListener(
    "change",
    async function(){

        const file =
            avatarInput.files[0];


        if(!file){
            return;
        }


        if(
            !file.type.startsWith(
                "image/"
            )
        ){

            alert(
                "فقط عکس انتخاب کنید."
            );

            return;

        }


        if(
            file.size >
            5 * 1024 * 1024
        ){

            alert(
                "حجم عکس پروفایل نباید بیشتر از ۵ مگابایت باشد."
            );

            avatarInput.value =
                "";

            return;

        }


        profileAvatar.style.opacity =
            ".5";


        try{

            const fileName =
                "avatar_" +
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .substring(
                        2,
                        8
                    ) +
                ".jpg";


            const fileRef =
                storageRef(
                    storage,
                    "avatars/" +
                    ROOM_NAME +
                    "/" +
                    fileName
                );


            const result =
                await uploadBytes(
                    fileRef,
                    file
                );


            const url =
                await getDownloadURL(
                    result.ref
                );


            localStorage.setItem(
                "profileAvatar",
                url
            );


            showAvatar(
                url
            );


            await set(
                onlineRef,
                {
                    name:
                        username,

                    avatar:
                        url,

                    time:
                        serverTimestamp()
                }
            );


        }catch(error){

            console.error(
                "Avatar error:",
                error
            );


            alert(
                "آپلود عکس پروفایل انجام نشد.\n" +
                "Firebase Storage را بررسی کن."
            );

        }finally{

            profileAvatar.style.opacity =
                "1";

            avatarInput.value =
                "";

        }

    }
);


/* =========================================================
   SAVE PROFILE
========================================================= */

profileSave.addEventListener(
    "click",
    async function(){

        let newName =
            profileName.value.trim();


        if(!newName){

            alert(
                "لطفاً یک نام وارد کنید."
            );

            return;

        }


        if(
            newName.length < 2
        ){

            alert(
                "نام باید حداقل ۲ حرف باشد."
            );

            return;

        }


        if(
            newName.length > 30
        ){

            alert(
                "نام نمی‌تواند بیشتر از ۳۰ حرف باشد."
            );

            return;

        }


        const oldOnlineRef =
            onlineRef;


        username =
            newName;


        localStorage.setItem(
            "username",
            username
        );


        const newSafeUser =
            username
                .replace(
                    /[.#$[\]/]/g,
                    "_"
                )
                .substring(
                    0,
                    40
                );


        const newOnlineRef =
            ref(
                db,
                "rooms/" +
                ROOM_NAME +
                "/online/" +
                newSafeUser
            );


        try{

            await remove(
                oldOnlineRef
            );


            await set(
                newOnlineRef,
                {

                    name:
                        username,

                    avatar:
                        localStorage.getItem(
                            "profileAvatar"
                        ) || "",

                    time:
                        serverTimestamp()

                }
            );


            onDisconnect(
                newOnlineRef
            ).remove();


        }catch(error){

            console.error(
                "Profile update:",
                error
            );

        }


        closeProfile();


        alert(
            "پروفایل با موفقیت ذخیره شد ✓"
        );

    }
);


/* =========================================================
   USERS PANEL
========================================================= */

usersBtn.addEventListener(
    "click",
    function(){

        usersOverlay.classList.add(
            "show"
        );

    }
);


closeUsers.addEventListener(
    "click",
    function(){

        usersOverlay.classList.remove(
            "show"
        );

    }
);


usersOverlay.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            usersOverlay
        ){

            usersOverlay.classList.remove(
                "show"
            );

        }

    }
);


/* =========================================================
   EXIT
========================================================= */

exitBtn.addEventListener(
    "click",
    async function(){

        const ok =
            confirm(
                "آیا می‌خواهید از عسل چت خارج شوید؟"
            );


        if(!ok){
            return;
        }


        try{

            await remove(
                onlineRef
            );

        }catch(error){

            console.error(
                "Exit:",
                error
            );

        }


        localStorage.removeItem(
            "username"
        );


        localStorage.removeItem(
            "profileAvatar"
        );


        window.location.href =
            "index.html";

    }
);


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            closeProfile();

            usersOverlay.classList.remove(
                "show"
            );

        }

    }
);


/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    async function(){

        if(
            document.visibilityState ===
            "visible"
        ){

            try{

                await set(
                    onlineRef,
                    {

                        name:
                            username,

                        avatar:
                            localStorage.getItem(
                                "profileAvatar"
                            ) || "",

                        time:
                            serverTimestamp()

                    }
                );

            }catch(error){

                console.error(
                    "Visibility:",
                    error
                );

            }

        }

    }
);

);

console.log(

);
