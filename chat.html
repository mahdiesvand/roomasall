<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="theme-color" content="#0b0c0b">

<title>عسل چت 🍯</title>

<style>

/* ==================================================
   RESET
================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background:#080908;
    color:#fff;

    -webkit-tap-highlight-color:transparent;
}

/* ==================================================
   APP
================================================== */

#app{
    width:100%;
    height:100dvh;

    display:flex;
    flex-direction:column;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(255,193,7,.08),
            transparent 38%
        ),
        #080908;
}

/* ==================================================
   HEADER
================================================== */

.chat-header{
    height:64px;
    min-height:64px;

    display:flex;
    align-items:center;

    padding:0 14px;

    background:
        linear-gradient(
            135deg,
            #171712,
            #0e0f0d
        );

    border-bottom:1px solid rgba(255,193,7,.15);

    box-shadow:
        0 3px 18px rgba(0,0,0,.45);

    position:relative;
    z-index:10;
}

/* ==================================================
   LOGO
================================================== */

.logo{
    width:42px;
    height:42px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:23px;

    background:
        linear-gradient(
            145deg,
            #ffc107,
            #d99500
        );

    box-shadow:
        0 0 18px rgba(255,193,7,.25);

    margin-left:10px;
}

/* ==================================================
   HEADER TITLE
================================================== */

.header-info{
    flex:1;
    min-width:0;
}

.header-title{
    font-size:17px;
    font-weight:bold;

    color:#ffd45a;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.header-status{
    margin-top:4px;

    font-size:11px;

    color:#8f948d;

    display:flex;
    align-items:center;
    gap:5px;
}

.online-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#42d96b;

    box-shadow:
        0 0 8px rgba(66,217,107,.65);
}

/* ==================================================
   HEADER BUTTONS
================================================== */

.header-actions{
    display:flex;
    align-items:center;
    gap:6px;
}

.header-btn{
    width:38px;
    height:38px;

    border:none;
    outline:none;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#ddd;

    background:rgba(255,255,255,.05);

    font-size:18px;

    cursor:pointer;

    transition:.2s;
}

.header-btn:active{
    transform:scale(.9);

    background:
        rgba(255,193,7,.14);
}

/* ==================================================
   CHAT AREA
================================================== */

.chat-area{
    flex:1;

    position:relative;

    overflow:hidden;

    display:flex;
    flex-direction:column;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,193,7,.025),
            transparent 25%
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(255,193,7,.018),
            transparent 28%
        ),
        #090a09;
}

/* ==================================================
   HONEY BACKGROUND
================================================== */

.honey-bg{
    position:absolute;
    inset:0;

    pointer-events:none;

    opacity:.7;

    background-image:
        radial-gradient(
            circle,
            rgba(255,193,7,.045) 1px,
            transparent 1.5px
        );

    background-size:28px 28px;
}

/* ==================================================
   MESSAGES
================================================== */

#messages{
    flex:1;

    overflow-y:auto;
    overflow-x:hidden;

    padding:
        14px
        10px
        90px;

    position:relative;
    z-index:2;

    scroll-behavior:smooth;
}

/* scrollbar */

#messages::-webkit-scrollbar{
    width:4px;
}

#messages::-webkit-scrollbar-track{
    background:transparent;
}

#messages::-webkit-scrollbar-thumb{
    background:#383a34;
    border-radius:10px;
}

/* ==================================================
   EMPTY MESSAGE
================================================== */

.empty-chat{
    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    color:#777b73;

    padding:30px;
}

.empty-box{
    max-width:280px;
}

.empty-icon{
    font-size:48px;
    margin-bottom:12px;
}

.empty-title{
    font-size:17px;
    color:#d0d0ca;
    margin-bottom:7px;
}

.empty-text{
    font-size:12px;
    line-height:2;
    color:#777b73;
}

/* ==================================================
   MESSAGE ROW
================================================== */

.message-row{
    width:100%;

    display:flex;

    margin-bottom:8px;

    animation:
        messageIn .2s ease;
}

.message-row.me{
    justify-content:flex-start;
}

.message-row.other{
    justify-content:flex-end;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(5px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ==================================================
   MESSAGE BUBBLE
================================================== */

.message-bubble{
    max-width:78%;

    padding:
        9px
        12px;

    border-radius:15px;

    position:relative;

    word-break:break-word;

    line-height:1.7;

    font-size:14px;
}

.message-row.me .message-bubble{
    background:
        linear-gradient(
            145deg,
            #272820,
            #1d1e1a
        );

    border-bottom-right-radius:4px;

    border:1px solid
        rgba(255,255,255,.035);
}

.message-row.other .message-bubble{
    background:
        linear-gradient(
            145deg,
            #5b4208,
            #3c2d08
        );

    border-bottom-left-radius:4px;

    border:1px solid
        rgba(255,193,7,.10);
}

/* ==================================================
   MESSAGE NAME
================================================== */

.message-name{
    font-size:11px;

    color:#ffc928;

    margin-bottom:3px;

    font-weight:bold;
}

/* ==================================================
   MESSAGE TEXT
================================================== */

.message-text{
    color:#f0f0eb;

    white-space:pre-wrap;
}

/* ==================================================
   MESSAGE TIME
================================================== */

.message-time{
    font-size:9px;

    color:#888b84;

    margin-top:3px;

    text-align:left;
}

/* ==================================================
   TYPING AREA
================================================== */

.input-area{
    position:absolute;

    right:0;
    bottom:0;
    left:0;

    z-index:20;

    padding:
        8px
        9px
        calc(8px + env(safe-area-inset-bottom));

    background:
        linear-gradient(
            to top,
            #080908 75%,
            transparent
        );
}

.input-box{
    width:100%;

    min-height:48px;

    display:flex;
    align-items:flex-end;

    gap:7px;

    padding:6px;

    border-radius:25px;

    background:
        #171914;

    border:1px solid
        rgba(255,193,7,.13);

    box-shadow:
        0 5px 25px rgba(0,0,0,.45);
}

/* ==================================================
   INPUT BUTTON
================================================== */

.input-btn{
    flex:0 0 38px;

    width:38px;
    height:38px;

    border:none;
    outline:none;

    border-radius:50%;

    background:
        rgba(255,255,255,.045);

    color:#aaa;

    font-size:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:.2s;
}

.input-btn:active{
    transform:scale(.9);

    background:
        rgba(255,193,7,.14);

    color:#ffc107;
}

/* ==================================================
   TEXT INPUT
================================================== */

#messageInput{
    flex:1;

    min-width:0;

    max-height:110px;

    min-height:36px;

    resize:none;

    border:none;
    outline:none;

    background:transparent;

    color:#fff;

    font-family:inherit;

    font-size:14px;

    line-height:1.6;

    padding:
        7px
        5px;

    overflow-y:auto;
}

#messageInput::placeholder{
    color:#6f726b;
}

#messageInput::-webkit-scrollbar{
    width:3px;
}

#messageInput::-webkit-scrollbar-thumb{
    background:#41433c;
    border-radius:10px;
}

/* ==================================================
   SEND BUTTON
================================================== */

.send-btn{
    flex:0 0 40px;

    width:40px;
    height:40px;

    border:none;
    outline:none;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #ffc107,
            #d99500
        );

    color:#16130a;

    font-size:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    box-shadow:
        0 3px 12px
        rgba(255,193,7,.22);

    transition:.2s;
}

.send-btn:active{
    transform:scale(.9);
}

.send-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

/* ==================================================
   CONNECTION STATUS
================================================== */

.connection-status{
    position:absolute;

    top:10px;
    left:50%;

    transform:translateX(-50%);

    z-index:30;

    padding:
        5px
        12px;

    border-radius:20px;

    font-size:10px;

    color:#aaa;

    background:
        rgba(20,21,18,.9);

    border:
        1px solid
        rgba(255,255,255,.05);

    backdrop-filter:blur(8px);

    opacity:0;

    pointer-events:none;

    transition:.3s;
}

.connection-status.show{
    opacity:1;
}

.connection-status.online{
    color:#55d978;
}

.connection-status.offline{
    color:#ff6969;
}

/* ==================================================
   RESPONSIVE
================================================== */

@media(max-width:360px){

    .chat-header{
        height:58px;
        min-height:58px;
        padding:0 9px;
    }

    .logo{
        width:38px;
        height:38px;
        font-size:20px;
    }

    .header-title{
        font-size:15px;
    }

    .message-bubble{
        max-width:84%;
        font-size:13px;
    }

    .input-area{
        padding-left:6px;
        padding-right:6px;
    }
}

/* ==================================================
   SAFE AREA
================================================== */

@supports(padding:max(0px)){

    .input-area{
        padding-bottom:
            max(
                8px,
                env(safe-area-inset-bottom)
            );
    }

}

/* ==================================================
   SELECTION
================================================== */

::selection{
    background:#9d7600;
    color:#fff;
}

</style>
</head>

<body>

<div id="app">

    <header class="chat-header">

        <div class="logo">
            🍯
        </div>

        <div class="header-info">

            <div class="header-title">
                عسل چت
            </div>

            <div class="header-status">
                <span class="online-dot"></span>
                <span id="onlineStatus">
                    در حال اتصال...
                </span>
            </div>

        </div>

        <div class="header-actions">

            <button
                class="header-btn"
                id="usersBtn"
                type="button">
                👥
            </button>

            <button
                class="header-btn"
                id="exitBtn"
                type="button">
                ⎋
            </button>

        </div>

    </header>


    <main class="chat-area">

        <div class="honey-bg"></div>

        <div
            id="connectionStatus"
            class="connection-status">
            در حال اتصال...
        </div>

        <div id="messages">

            <div class="empty-chat">

                <div class="empty-box">

                    <div class="empty-icon">
                        🍯
                    </div>

                    <div class="empty-title">
                        به عسل چت خوش آمدید
                    </div>

                    <div class="empty-text">
                        پیام خود را بنویسید و گفتگو را شروع کنید.
                    </div>

                </div>

            </div>

        </div>


        <div class="input-area">

            <div class="input-box">

                <button
                    class="input-btn"
                    id="attachBtn"
                    type="button">
                    📎
                </button>

                <textarea
                    id="messageInput"
                    rows="1"
                    maxlength="2000"
                    placeholder="پیام خود را بنویسید..."
                    autocomplete="off">
                </textarea>

                <button
                    class="send-btn"
                    id="sendBtn"
                    type="button">
                    ➤
                </button>

            </div>

        </div>

    </main>

</div>


<script>

/* ==================================================
   BASIC ELEMENTS
================================================== */

const messageInput =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const messages =
    document.getElementById("messages");

const onlineStatus =
    document.getElementById("onlineStatus");

const connectionStatus =
    document.getElementById("connectionStatus");

const exitBtn =
    document.getElementById("exitBtn");

const attachBtn =
    document.getElementById("attachBtn");


/* ==================================================
   USER
================================================== */

let username =
    localStorage.getItem("username");

if(!username){

    username = "مهمان";

}


/* ==================================================
   AUTO RESIZE INPUT
================================================== */

function resizeInput(){

    messageInput.style.height = "auto";

    messageInput.style.height =
        Math.min(
            messageInput.scrollHeight,
            110
        ) + "px";

}

messageInput.addEventListener(
    "input",
    resizeInput
);


/* ==================================================
   SEND BUTTON STATE
================================================== */

function updateSendButton(){

    sendBtn.disabled =
        messageInput.value.trim().length === 0;

}

messageInput.addEventListener(
    "input",
    updateSendButton
);

updateSendButton();


/* ==================================================
   ENTER TO SEND
================================================== */

messageInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* ==================================================
   SEND MESSAGE
================================================== */

function sendMessage(){

    const text =
        messageInput.value.trim();

    if(!text){
        return;
    }

    addMessage(
        username,
        text,
        true
    );

    messageInput.value = "";

    resizeInput();

    updateSendButton();

}


/* ==================================================
   ADD MESSAGE
================================================== */

function addMessage(
    name,
    text,
    mine = false
){

    const empty =
        messages.querySelector(".empty-chat");

    if(empty){
        empty.remove();
    }

    const row =
        document.createElement("div");

    row.className =
        "message-row " +
        (mine ? "me" : "other");


    const bubble =
        document.createElement("div");

    bubble.className =
        "message-bubble";


    const nameEl =
        document.createElement("div");

    nameEl.className =
        "message-name";

    nameEl.textContent =
        name;


    const textEl =
        document.createElement("div");

    textEl.className =
        "message-text";

    textEl.textContent =
        text;


    const timeEl =
        document.createElement("div");

    timeEl.className =
        "message-time";

    timeEl.textContent =
        new Date().toLocaleTimeString(
            "fa-IR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );


    bubble.appendChild(nameEl);

    bubble.appendChild(textEl);

    bubble.appendChild(timeEl);

    row.appendChild(bubble);

    messages.appendChild(row);


    messages.scrollTop =
        messages.scrollHeight;

}


/* ==================================================
   SEND CLICK
================================================== */

sendBtn.addEventListener(
    "click",
    sendMessage
);


/* ==================================================
   EXIT
================================================== */

exitBtn.addEventListener(
    "click",
    function(){

        if(
            confirm(
                "آیا می‌خواهید از چت خارج شوید؟"
            )
        ){

            localStorage.removeItem(
                "username"
            );

            window.location.href =
                "index.html";

        }

    }
);


/* ==================================================
   ATTACHMENT
================================================== */

attachBtn.addEventListener(
    "click",
    function(){

        alert(
            "ارسال عکس و فایل را در قسمت بعدی فعال می‌کنیم 🍯"
        );

    }
);


/* ==================================================
   DEMO CONNECTION
================================================== */

setTimeout(
    function(){

        onlineStatus.textContent =
            "آنلاین";

        connectionStatus.textContent =
            "متصل شد";

        connectionStatus.classList.add(
            "show",
            "online"
        );

        setTimeout(
            function(){

                connectionStatus.classList.remove(
                    "show"
                );

            },
            1800
        );

    },
    700
);

</script>

</body>
      </html>

      <script type="module">

/* ==================================================
   FIREBASE IMPORTS
================================================== */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    onChildAdded,
    onValue,
    serverTimestamp,
    onDisconnect,
    set,
    remove
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* ==================================================
   FIREBASE CONFIG
   این اطلاعات را با اطلاعات Firebase خودت جایگزین کن
================================================== */

const firebaseConfig = {

    apiKey: "اینجا_API_KEY_خودت",

    authDomain:
        "اینجا_AUTH_DOMAIN_خودت",

    databaseURL:
        "اینجا_DATABASE_URL_خودت",

    projectId:
        "اینجا_PROJECT_ID_خودت",

    storageBucket:
        "اینجا_STORAGE_BUCKET_خودت",

    messagingSenderId:
        "اینجا_MESSAGING_SENDER_ID_خودت",

    appId:
        "اینجا_APP_ID_خودت"

};


/* ==================================================
   FIREBASE START
================================================== */

const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);


/* ==================================================
   ELEMENTS
================================================== */

const messageInput =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const messages =
    document.getElementById("messages");

const onlineStatus =
    document.getElementById("onlineStatus");

const connectionStatus =
    document.getElementById("connectionStatus");

const exitBtn =
    document.getElementById("exitBtn");

const attachBtn =
    document.getElementById("attachBtn");

const usersBtn =
    document.getElementById("usersBtn");


/* ==================================================
   USERNAME
================================================== */

let username =
    localStorage.getItem("username");

if(!username || !username.trim()){

    username = "مهمان";

    localStorage.setItem(
        "username",
        username
    );

}


/* ==================================================
   ROOM
================================================== */

const ROOM_NAME =
    "asal-chat";

const messagesRef =
    ref(
        db,
        "rooms/" +
        ROOM_NAME +
        "/messages"
    );


/* ==================================================
   CONNECTION
================================================== */

const connectedRef =
    ref(
        db,
        ".info/connected"
    );


onValue(
    connectedRef,
    function(snapshot){

        if(snapshot.val() === true){

            onlineStatus.textContent =
                "آنلاین";

            connectionStatus.textContent =
                "متصل شد";

            connectionStatus.classList.add(
                "show",
                "online"
            );

            setTimeout(
                function(){

                    connectionStatus.classList.remove(
                        "show"
                    );

                },
                1500
            );

        }else{

            onlineStatus.textContent =
                "قطع اتصال";

            connectionStatus.textContent =
                "اتصال به سرور قطع شد";

            connectionStatus.classList.add(
                "show",
                "offline"
            );

        }

    }
);


/* ==================================================
   ONLINE USER
================================================== */

const safeUser =
    username
        .replace(/[.#$[\]/]/g,"_")
        .substring(0,40);

const onlineRef =
    ref(
        db,
        "rooms/" +
        ROOM_NAME +
        "/online/" +
        safeUser
    );


onValue(
    connectedRef,
    function(snapshot){

        if(snapshot.val() !== true){
            return;
        }


        set(
            onlineRef,
            {
                name: username,
                time: serverTimestamp()
            }
        );


        onDisconnect(
            onlineRef
        ).remove();

    }
);


/* ==================================================
   ONLINE COUNT
================================================== */

const onlineUsersRef =
    ref(
        db,
        "rooms/" +
        ROOM_NAME +
        "/online"
    );


onValue(
    onlineUsersRef,
    function(snapshot){

        const data =
            snapshot.val();

        let count = 0;

        if(data){

            count =
                Object.keys(data).length;

        }


        if(count === 0){

            onlineStatus.textContent =
                "آنلاین";

        }else{

            onlineStatus.textContent =
                count +
                " نفر آنلاین";

        }

    }
);


/* ==================================================
   INPUT RESIZE
================================================== */

function resizeInput(){

    messageInput.style.height =
        "auto";

    messageInput.style.height =
        Math.min(
            messageInput.scrollHeight,
            110
        ) + "px";

}


messageInput.addEventListener(
    "input",
    resizeInput
);


/* ==================================================
   SEND BUTTON STATE
================================================== */

function updateSendButton(){

    sendBtn.disabled =
        messageInput.value
            .trim()
            .length === 0;

}


messageInput.addEventListener(
    "input",
    updateSendButton
);


updateSendButton();


/* ==================================================
   ENTER SEND
================================================== */

messageInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* ==================================================
   SEND MESSAGE TO FIREBASE
================================================== */

async function sendMessage(){

    const text =
        messageInput.value.trim();


    if(!text){
        return;
    }


    if(text.length > 2000){

        alert(
            "پیام خیلی طولانی است."
        );

        return;

    }


    sendBtn.disabled =
        true;


    try{

        await push(
            messagesRef,
            {

                name:
                    username,

                text:
                    text,

                time:
                    serverTimestamp(),

                createdAt:
                    Date.now()

            }
        );


        messageInput.value =
            "";

        resizeInput();

        updateSendButton();


    }catch(error){

        console.error(
            "Firebase send error:",
            error
        );


        alert(
            "پیام ارسال نشد.\n" +
            "اتصال Firebase یا قوانین Database را بررسی کن."
        );


        updateSendButton();

    }

}


/* ==================================================
   RECEIVE MESSAGES
================================================== */

onChildAdded(
    messagesRef,
    function(snapshot){

        const data =
            snapshot.val();


        if(!data){
            return;
        }


        addFirebaseMessage(
            data.name || "مهمان",
            data.text || "",
            data.time,
            data.createdAt || Date.now()
        );

    }
);


/* ==================================================
   RENDER FIREBASE MESSAGE
================================================== */

function addFirebaseMessage(
    name,
    text,
    firebaseTime,
    createdAt
){

    const empty =
        messages.querySelector(
            ".empty-chat"
        );


    if(empty){

        empty.remove();

    }


    const mine =
        name === username;


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message-row " +
        (
            mine
                ? "me"
                : "other"
        );


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "message-bubble";


    const nameEl =
        document.createElement(
            "div"
        );


    nameEl.className =
        "message-name";


    nameEl.textContent =
        name;


    const textEl =
        document.createElement(
            "div"
        );


    textEl.className =
        "message-text";


    textEl.textContent =
        text;


    const timeEl =
        document.createElement(
            "div"
        );


    timeEl.className =
        "message-time";


    let messageDate;


    if(
        firebaseTime &&
        typeof firebaseTime === "number"
    ){

        messageDate =
            new Date(
                firebaseTime
            );

    }else{

        messageDate =
            new Date(
                createdAt
            );

    }


    timeEl.textContent =
        messageDate.toLocaleTimeString(
            "fa-IR",
            {
                hour:
                    "2-digit",

                minute:
                    "2-digit"
            }
        );


    bubble.appendChild(
        nameEl
    );

    bubble.appendChild(
        textEl
    );

    bubble.appendChild(
        timeEl
    );


    row.appendChild(
        bubble
    );


    messages.appendChild(
        row
    );


    requestAnimationFrame(
        function(){

            messages.scrollTop =
                messages.scrollHeight;

        }
    );

}
