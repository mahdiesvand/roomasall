<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>چت روم</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:tahoma;
}

.header{
    background:#cc0033;
    padding:15px;
    text-align:center;
}

#messages{
    height:400px;
    overflow:auto;
    padding:15px;
}

.box{
    position:fixed;
    bottom:10px;
    width:100%;
    text-align:center;
}

input{
    width:70%;
    padding:12px;
    border-radius:8px;
    border:0;
}

button{
    padding:12px;
    background:#cc0033;
    color:white;
    border:0;
    border-radius:8px;
}
</style>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e5ddd5;
}

.chat-box {
    max-width: 600px;
    height: 100vh;
    margin: auto;
    display: flex;
    flex-direction: column;
    background: #fff;
}

.header {
    background: #128c7e;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 20px;
}

#messages {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    background: #efeae2;
}

.message {
    background: white;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 10px;
    max-width: 75%;
    box-shadow: 0 1px 2px #aaa;
}

.input-area {
    display: flex;
    padding: 10px;
    background: #ddd;
}

#messageInput {
    flex: 1;
    padding: 12px;
    border-radius: 20px;
    border: none;
    outline: none;
}

button {
    margin-left: 8px;
    padding: 12px 20px;
    border: none;
    border-radius: 20px;
    background: #128c7e;
    color: white;
}
</style>
</head>

<body>

<div class="header">
چت روم
</div>


<div id="messages">
</div>


<div class="box">
<input id="message" placeholder="پیام بنویس...">
<button onclick="send()">ارسال</button>
</div>


<script>

let user=localStorage.getItem("username");

if(!user){
window.location="index.html";
}


function send(){

let text=document.getElementById("message").value;

if(text=="") return;


document.getElementById("messages").innerHTML +=
"<p><b>"+user+"</b>: "+text+"</p>";


document.getElementById("message").value="";

}

</script>


</body>
</html>
