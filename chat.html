<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عسل چت</title>

<style>

*{
box-sizing:border-box;
font-family:Tahoma;
}

body{
margin:0;
height:100vh;
background:#080808;
color:white;
display:flex;
justify-content:center;
align-items:center;
}


.chat{

width:100%;
max-width:450px;
height:95vh;
background:#111;
border-radius:25px;
overflow:hidden;
display:flex;
flex-direction:column;
box-shadow:0 0 40px #000;

}


.header{

padding:18px;
background:#1d1d1d;
color:#e8b84b;
font-size:22px;
text-align:center;

}


#online{

font-size:13px;
color:#00ff88;
margin-top:5px;

}



.messages{

flex:1;
padding:15px;
overflow-y:auto;

}



.msg{

background:#222;
padding:12px 16px;
border-radius:18px;
margin:10px 0;
width:max-content;
max-width:80%;

}



.me{

background:#d6a436;
color:#000;
margin-right:auto;

}



.send{

display:flex;
padding:15px;
gap:10px;
background:#151515;

}



.send input{

flex:1;
padding:13px;
border-radius:20px;
border:none;
background:#222;
color:white;
outline:none;

}



button{

border:none;
border-radius:20px;
padding:10px 18px;
background:#d6a436;
cursor:pointer;

}



</style>

</head>


<body>


<div class="chat">


<div class="header">

🍯 عسل چت

<div id="online">
در حال اتصال...
</div>

</div>



<div class="messages" id="messages">

</div>



<div class="send">

<input id="text" placeholder="پیام بنویس...">

<butt
ارسال
</<button id="sendBtn">
ارسال
</button>


</div>


</div>



<script type="module" src="script.js"></script>


</body>
<script>
document.getElementById("online").innerHTML="اتصال تست شد";
</script>
</html>
