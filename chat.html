<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عسل چت</title>

<style>

*{
box-sizing:border-box;
}


body{

margin:0;
height:100vh;
font-family:tahoma;
background:
radial-gradient(circle at top,#4a3500,#080808 60%);
color:white;

}



.chat{

height:100vh;
max-width:600px;
margin:auto;
display:flex;
flex-direction:column;
background:rgba(255,255,255,0.06);
backdrop-filter:blur(15px);

}




.header{

height:70px;
display:flex;
align-items:center;
justify-content:center;

font-size:25px;
font-weight:bold;

background:
linear-gradient(90deg,#b8860b,#ffd700,#b8860b);

color:#111;

box-shadow:0 5px 25px #000;

}




.messages{

flex:1;
padding:15px;
overflow-y:auto;

}




.message{

background:
rgba(255,255,255,0.12);

border:1px solid rgba(255,215,0,.3);

padding:14px;

border-radius:20px;

margin-bottom:12px;

width:fit-content;

max-width:85%;

box-shadow:
0 5px 15px rgba(0,0,0,.4);

animation:show .3s;

}



.message b{

color:#ffd700;

}



@keyframes show{

from{

opacity:0;
transform:translateY(20px);

}

to{

opacity:1;
transform:translateY(0);

}

}




.input{

display:flex;

padding:12px;

background:rgba(0,0,0,.5);

}



.input input{

flex:1;

padding:15px;

border:none;

outline:none;

border-radius:30px;

background:#222;

color:white;

font-size:16px;

}




.input button{

margin-right:10px;

width:60px;

height:50px;

border:none;

border-radius:50%;

background:
linear-gradient(135deg,#ffd700,#b8860b);

font-size:22px;

cursor:pointer;

}




.input button:active{

transform:scale(.9);

}
.message{
    position:relative;
}

.message small{
    display:block;
    text-align:left;
    font-size:11px;
    margin-top:8px;
    opacity:.7;
}


/* پیام خودم */

.message.mine{

    margin-left:auto;

    background:
    linear-gradient(135deg,#ffd700,#b8860b);

    color:#111;

    border-bottom-right-radius:5px;

}


.message.mine b{

    color:#000;

}



/* پیام دیگران */

.message.other{

    margin-right:auto;

    background:
    rgba(255,255,255,.12);

    border-bottom-left-radius:5px;

} 
.header span{

display:block;

font-size:12px;

margin-top:5px;

font-weight:normal;

} 
</style>

#profile{

font-size:13px;
margin-top:5px;
color:#222;

}
    
</head>



<body>



<div class="chat">


<div class="header">

🍯 عسل چت

<div id="profile"></div>

<span id="online">
🟢 آنلاین
</span>

</div>


<div class="profile-box">

<input id="newName" placeholder="نام جدید">

<select id="avatar">
<option>🙂</option>
<option>😎</option>
<option>🤖</option>
<option>🔥</option>
<option>🍯</option>
<option>👑</option>
</select>

<button onclick="saveProfile()">
ذخیره
</button>

</div>



<div class="messages" id="messages">

</div>




<div class="input">

<input 
type="file" 
id="imageInput" 
accept="image/*"
style="display:none"
>


<button onclick="document.getElementById('imageInput').click()">
📷
</button>


<input id="text" placeholder="پیام بنویسید...">


<button onclick="sendMessage()">
➤
</button>


</div>


</div>



</div>



<script>

let user = localStorage.getItem("username");

if(!user){

window.location.href="index.html";

}

</script>

<script type="module" src="online.js"></script>
 <script>

function saveProfile(){

let name =
document.getElementById("newName").value;


let avatar =
document.getElementById("avatar").value;


if(name){

localStorage.setItem("username",name);

}


localStorage.setItem("avatar",avatar);


location.reload();

}



let oldName =
localStorage.getItem("username") || "کاربر";


let oldAvatar =
localStorage.getItem("avatar") || "🙂";


document.getElementById("profile").innerHTML =
oldAvatar + " " + oldName;


 </script>   
<script type="module" src="app.js"></script>


</body>

</html>
