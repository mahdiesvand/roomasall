<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>عسل چت 🍯</title>

<style>

/* =========================
RESET
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{

    font-family:
    Tahoma,
    Arial,
    sans-serif;

    background:#0c0b09;

    color:#fff;
}


/* =========================
APP
========================= */

.app{

    width:100%;
    height:100vh;

    display:flex;

    flex-direction:column;

    background:
    radial-gradient(
        circle at 30% 20%,
        rgba(255,193,7,.06),
        transparent 35%
    );

}


/* =========================
HEADER
========================= */

.header{

    height:60px;

    min-height:60px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 15px;

    background:
    linear-gradient(
        135deg,
        #211d14,
        #11100d
    );

    border-bottom:
    1px solid
    rgba(255,193,7,.16);

    z-index:10;
}

.header-title{

    display:flex;

    align-items:center;

    gap:10px;
}

.logo{

    width:40px;
    height:40px;

    border-radius:13px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
    linear-gradient(
        145deg,
        #ffd84d,
        #b87700
    );

    font-size:21px;

    box-shadow:
    0 5px 15px
    rgba(255,193,7,.2);
}

.title{

    display:flex;

    flex-direction:column;

    gap:3px;
}

.title strong{

    font-size:16px;
}

.status{

    display:flex;

    align-items:center;

    gap:5px;

    font-size:10px;

    color:#999;
}

.status-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#35d05b;

    box-shadow:
    0 0 8px
    rgba(53,208,91,.6);
}

.exit{

    width:38px;
    height:38px;

    border:0;

    border-radius:12px;

    background:
    rgba(255,255,255,.06);

    color:#aaa;

    font-size:18px;
}


/* =========================
MAIN LAYOUT
========================= */

.main{

    flex:1;

    min-height:0;

    display:flex;

    flex-direction:row-reverse;

}


/* =========================
RIGHT USERS PANEL
========================= */

.users-panel{

    width:220px;

    min-width:220px;

    height:100%;

    background:
    linear-gradient(
        180deg,
        #181611,
        #100f0c
    );

    border-left:
    1px solid
    rgba(255,193,7,.13);

    display:flex;

    flex-direction:column;

    overflow:hidden;
}


/* PANEL HEADER */

.users-header{

    padding:15px 13px 12px;

    border-bottom:
    1px solid
    rgba(255,255,255,.06);
}

.users-title{

    display:flex;

    align-items:center;

    justify-content:space-between;

    color:#e6b82e;

    font-size:13px;

    font-weight:bold;
}

.users-number{

    min-width:25px;

    height:22px;

    padding:0 7px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:8px;

    background:
    rgba(255,193,7,.1);

    color:#e4b52a;

    font-size:10px;
}


/* USER LIST */

.users-list{

    flex:1;

    overflow-y:auto;

    padding:8px;
}

.users-list::-webkit-scrollbar{

    width:4px;
}

.users-list::-webkit-scrollbar-thumb{

    background:#4a3914;

    border-radius:10px;
}


/* USER */

.user{

    display:flex;

    align-items:center;

    gap:9px;

    padding:9px 7px;

    margin-bottom:3px;

    border-radius:12px;

    transition:.2s;
}

.user:hover{

    background:
    rgba(255,193,7,.06);
}

.avatar{

    width:34px;
    height:34px;

    min-width:34px;

    border-radius:11px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
    linear-gradient(
        145deg,
        #e8b72e,
        #805600
    );

    color:#fff;

    font-size:13px;

    font-weight:bold;
}

.user-info{

    min-width:0;

    flex:1;
}

.user-name{

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;

    font-size:12px;

    color:#ddd;
}

.user-state{

    margin-top:2px;

    font-size:9px;

    color:#777;
}

.user-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#39d353;

    box-shadow:
    0 0 7px
    rgba(57,211,83,.55);
}


/* =========================
CHAT AREA
========================= */

.chat-area{

    flex:1;

    min-width:0;

    display:flex;

    flex-direction:column;

    position:relative;

    background:

    radial-gradient(
        circle at 15% 20%,
        rgba(255,193,7,.025),
        transparent 30%
    ),

    radial-gradient(
        circle at 80% 70%,
        rgba(255,193,7,.02),
        transparent 35%
    );

}


/* =========================
CHAT
========================= */

.chat{

    flex:1;

    min-height:0;

    overflow-y:auto;

    padding:

    18px
    15px
    80px;

    display:flex;

    flex-direction:column;

    gap:8px;
}

.chat::-webkit-scrollbar{

    width:4px;
}

.chat::-webkit-scrollbar-thumb{

    background:#443614;

    border-radius:10px;
}


/* =========================
EMPTY
========================= */

.empty{

    margin:auto;

    text-align:center;

    color:#777;

    font-size:13px;

    line-height:2;
}

.empty-icon{

    font-size:45px;

    margin-bottom:5px;
}


/* =========================
MESSAGES
========================= */

.message{

    max-width:75%;

    display:flex;

    flex-direction:column;

    animation:
    messageIn .2s ease;
}

@keyframes messageIn{

    from{

        opacity:0;

        transform:
        translateY(6px);
    }

    to{

        opacity:1;

        transform:
        translateY(0);
    }
}

.message.mine{

    align-self:flex-start;

    align-items:flex-start;
}

.message.other{

    align-self:flex-end;

    align-items:flex-end;
}

.sender{

    color:#d7a82a;

    font-size:10px;

    margin:
    0 7px 3px;
}

.bubble{

    padding:
    8px 12px;

    border-radius:16px;

    line-height:1.7;

    font-size:13px;

    word-break:break-word;

    box-shadow:
    0 3px 10px
    rgba(0,0,0,.18);
}

.mine .bubble{

    background:
    linear-gradient(
        135deg,
        #70500e,
        #503705
    );

    border-bottom-left-radius:5px;
}

.other .bubble{

    background:#211f1a;

    border:
    1px solid
    rgba(255,255,255,.05);

    border-bottom-right-radius:5px;
}

.time{

    color:#777;

    font-size:8px;

    margin:
    3px 7px 0;
}


/* =========================
IMAGE
========================= */

.message-image{

    display:block;

    width:auto;

    max-width:230px;

    max-height:300px;

    border-radius:12px;

    object-fit:cover;
}


/* =========================
INPUT
========================= */

.input-area{

    position:absolute;

    bottom:0;

    left:0;

    right:0;

    padding:
    8px 10px;

    background:
    linear-gradient(
        180deg,
        transparent,
        #0c0b09 30%
    );

    z-index:5;
}

.input-box{

    min-height:50px;

    display:flex;

    align-items:center;

    gap:6px;

    padding:5px 6px;

    border-radius:17px;

    background:#1b1915;

    border:
    1px solid
    rgba(255,193,7,.12);

    box-shadow:
    0 -4px 20px
    rgba(0,0,0,.25);
}

.message-input{

    flex:1;

    min-width:0;

    min-height:38px;

    max-height:100px;

    resize:none;

    outline:none;

    border:0;

    background:transparent;

    color:#fff;

    font-family:inherit;

    font-size:13px;

    padding:
    9px 6px;
}

.message-input::placeholder{

    color:#777;
}

.icon-button{

    width:38px;
    height:38px;

    min-width:38px;

    border:0;

    border-radius:11px;

    background:
    rgba(255,255,255,.05);

    color:#bbb;

    font-size:17px;
}

.send-button{

    width:40px;
    height:40px;

    min-width:40px;

    border:0;

    border-radius:13px;

    background:
    linear-gradient(
        145deg,
        #ffd54a,
        #bd7b00
    );

    color:#17120a;

    font-size:18px;

    font-weight:bold;
}


/* =========================
PREVIEW
========================= */

.preview{

    display:none;

    position:absolute;

    right:12px;

    bottom:65px;

    width:105px;

    height:105px;

    padding:4px;

    border-radius:13px;

    background:#171511;

    border:
    1px solid
    rgba(255,193,7,.2);

    z-index:20;
}

.preview img{

    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:10px;
}

.preview-close{

    position:absolute;

    top:-8px;

    left:-8px;

    width:23px;
    height:23px;

    border:0;

    border-radius:50%;

    background:#333;

    color:#fff;
}


/* =========================
LOADING
========================= */

.loading{

    position:fixed;

    inset:0;

    z-index:100;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:12px;

    background:#0c0b09;
}

.loading-icon{

    font-size:45px;
}

.loading-text{

    color:#c69a24;

    font-size:12px;
}


/* =========================
TOAST
========================= */

.toast{

    position:fixed;

    top:70px;

    left:50%;

    transform:
    translate(-50%,-15px);

    opacity:0;

    pointer-events:none;

    padding:
    8px 15px;

    border-radius:11px;

    background:#242019;

    color:#fff;

    font-size:11px;

    border:
    1px solid
    rgba(255,193,7,.15);

    transition:.25s;

    z-index:200;
}

.toast.show{

    opacity:1;

    transform:
    translate(-50%,0);
}


/* =========================
MOBILE
========================= */

@media(max-width:700px){

    .users-panel{

        width:145px;

        min-width:145px;
    }

    .users-header{

        padding:12px 9px;
    }

    .users-title{

        font-size:11px;
    }

    .user{

        padding:8px 4px;

        gap:6px;
    }

    .avatar{

        width:30px;
        height:30px;

        min-width:30px;

        font-size:11px;
    }

    .user-name{

        font-size:10px;
    }

    .message{

        max-width:82%;
    }

    .bubble{

        font-size:12px;
    }

    .logo{

        width:36px;
        height:36px;
    }

    .title strong{

        font-size:14px;
    }

}


/* =========================
VERY SMALL
========================= */

@media(max-width:400px){

    .users-panel{

        width:125px;

        min-width:125px;
    }

    .user-state{

        display:none;
    }

    .message{

        max-width:78%;
    }

}

</style>

</head>


<body>


<div class="app">


    <!-- HEADER -->

    <header class="header">

        <div class="header-title">

            <div class="logo">
                🍯
            </div>

            <div class="title">

                <strong>
                    عسل چت
                </strong>

                <div class="status">

                    <span class="status-dot"></span>

                    <span id="onlineCount">
                        0 نفر آنلاین
                    </span>

                </div>

            </div>

        </div>


        <button
            class="exit"
            id="exitBtn">

            ↪

        </button>

    </header>



    <!-- MAIN -->

    <div class="main">


        <!-- =====================
             RIGHT USERS
        ====================== -->

        <aside class="users-panel">


            <div class="users-header">

                <div class="users-title">

                    <span>
                        👥 کاربران آنلاین
                    </span>

                    <span
                        class="users-number"
                        id="usersNumber">

                        0

                    </span>

                </div>

            </div>


            <div
                class="users-list"
                id="onlineUsers">

                <div
                    style="
                    color:#777;
                    text-align:center;
                    padding:15px;
                    font-size:10px;
                    ">

                    در حال اتصال...

                </div>

            </div>


        </aside>



        <!-- =====================
             CHAT
        ====================== -->

        <section class="chat-area">


            <main
                class="chat"
                id="chat">


                <div
                    class="empty"
                    id="empty">

                    <div class="empty-icon">
                        🍯
                    </div>

                    هنوز پیامی نیست

                    <br>

                    اولین پیام رو بفرست ❤️

                </div>


            </main>



            <!-- IMAGE PREVIEW -->

            <div
                class="preview"
                id="preview">

                <button
                    class="preview-close"
                    id="previewClose">

                    ×

                </button>

                <img
                    id="previewImage">

            </div>



            <!-- INPUT -->

            <div class="input-area">

                <div class="input-box">


                    <input
                        type="file"
                        id="imageInput"
                        accept="image/*"
                        hidden>


                    <button
                        class="icon-button"
                        id="imageButton">

                        📷

                    </button>


                    <textarea
                        class="message-input"
                        id="messageInput"
                        placeholder="پیامت رو بنویس..."
                        rows="1"></textarea>


                    <button
                        class="send-button"
                        id="sendButton">

                        ➤

                    </button>


                </div>

            </div>


        </section>


    </div>


</div>



<!-- LOADING -->

<div
    class="loading"
    id="loading">

    <div class="loading-icon">
        🍯
    </div>

    <div class="loading-text">
        در حال اتصال به عسل چت...
    </div>

</div>



<!-- TOAST -->

<div
    class="toast"
    id="toast">
</div>



<script type="module">


/* =====================================
   FIREBASE
===================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
    getDatabase,
    ref,
    push,
    set,
    onValue,
    onChildAdded,
    onDisconnect,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";


import {
    getStorage,
    ref as storageRef,
    uploadBytes,
    getDownloadURL
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-storage.js";



/* =====================================
   FIREBASE CONFIG
===================================== */

const firebaseConfig = {

    apiKey:
    "YOUR_API_KEY",

    authDomain:
    "YOUR_PROJECT.firebaseapp.com",

    databaseURL:
    "https://YOUR_PROJECT-default-rtdb.firebaseio.com",

    projectId:
    "YOUR_PROJECT",

    storageBucket:
    "YOUR_PROJECT.firebasestorage.app",

    messagingSenderId:
    "YOUR_SENDER_ID",

    appId:
    "YOUR_APP_ID"

};



/* =====================================
   INIT
===================================== */

const app =
initializeApp(
    firebaseConfig
);

const db =
getDatabase(app);

const storage =
getStorage(app);



/* =====================================
   USER
===================================== */

const username =
localStorage.getItem(
    "username"
);


if(!username){

    window.location.href =
    "index.html";

}



/* =====================================
   ELEMENTS
===================================== */

const chat =
document.getElementById(
    "chat"
);

const input =
document.getElementById(
    "messageInput"
);

const sendButton =
document.getElementById(
    "sendButton"
);

const imageButton =
document.getElementById(
    "imageButton"
);

const imageInput =
document.getElementById(
    "imageInput"
);

const preview =
document.getElementById(
    "preview"
);

const previewImage =
document.getElementById(
    "previewImage"
);

const previewClose =
document.getElementById(
    "previewClose"
);

const onlineUsers =
document.getElementById(
    "onlineUsers"
);

const onlineCount =
document.getElementById(
    "onlineCount"
);

const usersNumber =
document.getElementById(
    "usersNumber"
);

const loading =
document.getElementById(
    "loading"
);

const toast =
document.getElementById(
    "toast"
);

const empty =
document.getElementById(
    "empty"
);

const exitBtn =
document.getElementById(
    "exitBtn"
);



/* =====================================
   DATABASE
===================================== */

const messagesRef =
ref(
    db,
    "messages"
);

const onlineRef =
ref(
    db,
    "online/" +
    encodeURIComponent(
        username
    )
);



/* =====================================
   ONLINE
===================================== */

async function goOnline(){

    try{

        await set(
            onlineRef,
            {
                name:
                username,

                time:
                serverTimestamp()
            }
        );

        onDisconnect(
            onlineRef
        ).remove();

    }

    catch(error){

        console.error(
            error
        );

    }

}

goOnline();



/* =====================================
   USERS
===================================== */

onValue(
    ref(
        db,
        "online"
    ),

    snapshot => {

        onlineUsers.innerHTML =
        "";

        let count = 0;


        snapshot.forEach(
            child => {

                const data =
                child.val();

                if(!data)
                    return;


                count++;


                const user =
                document.createElement(
                    "div"
                );

                user.className =
                "user";


                const avatar =
                document.createElement(
                    "div"
                );

                avatar.className =
                "avatar";

                avatar.textContent =
                (
                    data.name ||
                    "?"
                )
                .charAt(0);


                const info =
                document.createElement(
                    "div"
                );

                info.className =
                "user-info";


                const name =
                document.createElement(
                    "div"
                );

                name.className =
                "user-name";

                name.textContent =
                data.name ||
                "کاربر";


                const state =
                document.createElement(
                    "div"
                );

                state.className =
                "user-state";

                state.textContent =
                "آنلاین";


                info.appendChild(
                    name
                );

                info.appendChild(
                    state
                );


                const dot =
                document.createElement(
                    "div"
                );

                dot.className =
                "user-dot";


                user.appendChild(
                    avatar
                );

                user.appendChild(
                    info
                );

                user.appendChild(
                    dot
                );


                onlineUsers.appendChild(
                    user
                );

            }
        );


        onlineCount.textContent =
        count +
        " نفر آنلاین";


        usersNumber.textContent =
        count;

    }
);



/* =====================================
   ADD MESSAGE
===================================== */

function addMessage(
    data
){

    if(!data)
        return;


    empty.style.display =
    "none";


    const wrapper =
    document.createElement(
        "div"
    );


    const mine =
    data.name ===
    username;


    wrapper.className =
    "message " +
    (
        mine
        ? "mine"
        : "other"
    );


    if(!mine){

        const sender =
        document.createElement(
            "div"
        );

        sender.className =
        "sender";

        sender.textContent =
        data.name ||
        "کاربر";

        wrapper.appendChild(
            sender
        );

    }


    const bubble =
    document.createElement(
        "div"
    );

    bubble.className =
    "bubble";


    if(data.image){

        const img =
        document.createElement(
            "img"
        );

        img.className =
        "message-image";

        img.src =
        data.image;

        img.alt =
        "تصویر";

        bubble.appendChild(
            img
        );

    }


    if(data.text){

        const text =
        document.createElement(
            "div"
        );

        text.textContent =
        data.text;

        bubble.appendChild(
            text
        );

    }


    const time =
    document.createElement(
        "div"
    );

    time.className =
    "time";


    if(data.time){

        const date =
        new Date(
            data.time
        );

        if(
            !isNaN(
                date.getTime()
            )
        ){

            time.textContent =
            date.toLocaleTimeString(
                "fa-IR",
                {
                    hour:
                    "2-digit",

                    minute:
                    "2-digit"
                }
            );

        }

    }


    wrapper.appendChild(
        bubble
    );

    wrapper.appendChild(
        time
    );


    chat.appendChild(
        wrapper
    );


    chat.scrollTop =
    chat.scrollHeight;

}



/* =====================================
   RECEIVE
===================================== */

onChildAdded(
    messagesRef,

    snapshot => {

        addMessage(
            snapshot.val()
        );

    }
);



/* =====================================
   SEND TEXT
===================================== */

async function sendMessage(){

    const text =
    input.value.trim();


    if(!text)
        return;


    try{

        await push(
            messagesRef,
            {

                name:
                username,

                text:
                text,

                time:
                Date.now()

            }
        );


        input.value =
        "";

        input.style.height =
        "38px";

    }

    catch(error){

        console.error(
            error
        );

        showToast(
            "ارسال پیام ناموفق بود"
        );

    }

}



sendButton.addEventListener(
    "click",
    sendMessage
);



/* =====================================
   ENTER
===================================== */

input.addEventListener(
    "keydown",

    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);



/* =====================================
   AUTO HEIGHT
===================================== */

input.addEventListener(
    "input",

    () => {

        input.style.height =
        "38px";

        input.style.height =
        Math.min(
            input.scrollHeight,
            100
        ) + "px";

    }
);



/* =====================================
   IMAGE BUTTON
===================================== */

imageButton.addEventListener(
    "click",

    () => {

        imageInput.click();

    }
);



/* =====================================
   IMAGE PREVIEW
===================================== */

imageInput.addEventListener(
    "change",

    () => {

        const file =
        imageInput.files[0];

        if(!file)
            return;


        const reader =
        new FileReader();


        reader.onload =
        event => {

            previewImage.src =
            event.target.result;

            preview.style.display =
            "block";

        };


        reader.readAsDataURL(
            file
        );

    }
);



/* =====================================
   UPLOAD IMAGE
===================================== */

imageInput.addEventListener(
    "change",

    async () => {

        const file =
        imageInput.files[0];

        if(!file)
            return;


        try{

            showToast(
                "در حال ارسال عکس..."
            );


            const fileName =
            Date.now() +
            "_" +
            file.name;


            const imageRef =
            storageRef(
                storage,
                "chat-images/" +
                fileName
            );


            await uploadBytes(
                imageRef,
                file
            );


            const url =
            await getDownloadURL(
                imageRef
            );


            await push(
                messagesRef,
                {

                    name:
                    username,

                    image:
                    url,

                    time:
                    Date.now()

                }
            );


            imageInput.value =
            "";

            preview.style.display =
            "none";


            showToast(
                "عکس ارسال شد ✓"
            );

        }

        catch(error){

            console.error(
                error
            );

            showToast(
                "ارسال عکس ناموفق بود"
            );

        }

    }
);



/* =====================================
   PREVIEW CLOSE
===================================== */

previewClose.addEventListener(
    "click",

    () => {

        imageInput.value =
        "";

        preview.style.display =
        "none";

    }
);



/* =====================================
   EXIT
===================================== */

exitBtn.addEventListener(
    "click",

    async () => {

        try{

            await set(
                onlineRef,
                null
            );

        }

        catch(error){

            console.log(
                error
            );

        }


        localStorage.removeItem(
            "username"
        );


        window.location.href =
        "index.html";

    }
);



/* =====================================
   TOAST
===================================== */

let toastTimer;

function showToast(
    text
){

    toast.textContent =
    text;

    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },

        2500
    );

}



/* =====================================
   CONNECTION
===================================== */

onValue(
    ref(
        db,
        ".info/connected"
    ),

    snapshot => {

        console.log(
            "Firebase:",
            snapshot.val()
        );

    }
);



/* =====================================
   LOADING
===================================== */

setTimeout(
    () => {

        loading.style.display =
        "none";

    },

    700
);

</script>
