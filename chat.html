<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عسل چت</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
height:100vh;
font-family:tahoma;
background:#0e1621;
color:white;

}



.chat{

height:100vh;
max-width:600px;
margin:auto;
display:flex;
flex-direction:column;
background:#17212b;

}



/* هدر */

.header{

height:70px;

display:flex;
flex-direction:column;

align-items:center;
justify-content:center;

background:#202b36;

color:#ffd700;

font-size:23px;

font-weight:bold;

box-shadow:0 3px 10px #000;

}


#profile{

font-size:12px;

color:#ddd;

}


.header span{

font-size:12px;

color:#7cff7c;

font-weight:normal;

}





/* بخش پیام ها */

.messages{

flex:1;

padding:15px;

overflow-y:auto;

background:

linear-gradient(
180deg,
#0e1621,
#101820
);

}





.message{

position:relative;

padding:12px 15px;

border-radius:18px;

margin-bottom:12px;

max-width:80%;

width:fit-content;

font-size:15px;

animation:show .25s;

box-shadow:0 2px 5px #0005;

}



.message b{

display:block;

font-size:13px;

margin-bottom:5px;

color:#ffd700;

}



.message small{

display:block;

text-align:left;

font-size:10px;

opacity:.6;

margin-top:5px;

}



/* پیام من */

.message.mine{

margin-left:auto;

background:#d9fdd3;

color:#111;

border-bottom-right-radius:4px;

}



.message.mine b{

color:#000;

}





/* پیام دیگران */

.message.other{

margin-right:auto;

background:#202b36;

color:white;

border-bottom-left-radius:4px;

}






/* پایین چت */

.input{

display:flex;

padding:10px;

background:#202b36;

align-items:center;

}



.input input{

flex:1;

padding:14px;

border:none;

outline:none;

border-radius:25px;

background:#0e1621;

color:white;

font-size:15px;

}



.input button{

margin-right:8px;

width:48px;

height:48px;

border:none;

border-radius:50%;

background:#ffd700;

font-size:20px;

cursor:pointer;

}



.input button:active{

transform:scale(.9);

}



@keyframes show{

from{

opacity:0;

transform:translateY(15px);

}


to{

opacity:1;

transform:translateY(0);

}

}


</style>


</head>



<body>



<div class="chat">


<div class="header">

🍯 عسل چت

<div id="profile"></div>


<span id="online">
🟢 آنلاین
</span>

</div>





<div class="messages" id="messages">

</div>





<div class="input">


<input 
type="file" 
id="imageInput" 
accept="image/*"
style="display:none"
>


<button onclick="document.getElementById('imageInput').click()">
📷
</button>



<input id="text" placeholder="پیام بنویسید...">



<button onclick="sendMessage()">

➤

</button>


</div>


</div>






<script>

let user = localStorage.getItem("username");

if(!user){

window.location.href="index.html";

}

</script>



<script type="module" src="online.js"></script>

<script type="module" src="app.js"></script>


</body>

</html>
