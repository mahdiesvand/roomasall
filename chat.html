<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عسل چت</title>

<style>
body{
    margin:0;
    font-family:tahoma;
    background:#111;
}

.chat-box{
    max-width:600px;
    height:100vh;
    margin:auto;
    display:flex;
    flex-direction:column;
    background:#eee;
}

.header{
    background:#cc0033;
    color:white;
    padding:15px;
    text-align:center;
    font-size:22px;
}

#messages{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.message{
    background:white;
    padding:10px;
    border-radius:10px;
    margin-bottom:10px;
}

.name{
    color:#cc0033;
    font-weight:bold;
}

.input-area{
    display:flex;
    padding:10px;
    background:#ddd;
}

#message{
    flex:1;
    padding:12px;
    border-radius:20px;
    border:0;
}

button{
    margin-right:10px;
    padding:12px 20px;
    border:0;
    border-radius:20px;
    background:#cc0033;
    color:white;
}
</style>

</head>


<body>


<div class="chat-box">

<div class="header">
عسل چت
</div>


<div id="messages"></div>


<div class="input-area">

<input id="message" placeholder="پیام بنویس...">

<button onclick="sendMessage()">
ارسال
</button>

</div>


</div>



<script type="module">


import { initializeApp } 
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import { 
getDatabase,
ref,
push,
onChildAdded
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";



const firebaseConfig = {

apiKey: "AIzaSyBmV0ikTOiXmtibjuXgJ4PhIbJcTxkhP5A",

authDomain: "roomasal.firebaseapp.com",

databaseURL: "https://roomasal-default-rtdb.firebaseio.com",

projectId: "roomasal",

storageBucket: "roomasal.firebasestorage.app",

messagingSenderId: "74039115594",

appId: "1:74039115594:web:18fb78cfe77207f18c4bb3"

};



const app = initializeApp(firebaseConfig);


const db = getDatabase(app);



let user = localStorage.getItem("username");


if(!user){

user="کاربر";

}



const messagesRef = ref(db,"messages");




// ارسال پیام

window.sendMessage = async function(){

let text = document.getElementById("message").value;

if(text.trim()=="") return;

try {

await push(messagesRef,{
name:user,
text:text,
time:Date.now()
});

alert("پیام ارسال شد");

document.getElementById("message").value="";

} catch(error){

alert("خطا: " + error.message);

}

}



// دریافت زنده پیام‌ها


onChildAdded(messagesRef,(data)=>{


let msg=data.val();


let box=document.getElementById("messages");


box.innerHTML += `

<div class="message">

<div class="name">
${msg.name}
</div>

${msg.text}

</div>

`;


box.scrollTop=box.scrollHeight;


});



</script>


</body>
</html>
