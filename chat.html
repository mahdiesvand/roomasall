<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="theme-color" content="#0b0c0b">

<title>عسل چت 🍯</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background:#080908;
    color:#fff;

    -webkit-tap-highlight-color:transparent;
}

button,
input,
textarea{
    font-family:inherit;
}

#app{
    width:100%;
    height:100dvh;

    display:flex;
    flex-direction:column;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(255,193,7,.10),
            transparent 38%
        ),
        #080908;
}

/* ================= HEADER ================= */

.chat-header{

    height:64px;
    min-height:64px;

    display:flex;
    align-items:center;

    padding:0 12px;

    background:
        linear-gradient(
            135deg,
            #191a14,
            #0e0f0d
        );

    border-bottom:
        1px solid
        rgba(255,193,7,.16);

    box-shadow:
        0 3px 20px
        rgba(0,0,0,.45);

    position:relative;
    z-index:20;
}

.logo{

    width:43px;
    height:43px;
    flex:0 0 43px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #ffc107,
            #c98600
        );

    box-shadow:
        0 0 20px
        rgba(255,193,7,.25);

    font-size:23px;

    cursor:pointer;
    user-select:none;
}

.header-info{

    flex:1;
    min-width:0;
    margin-right:10px;
}

.header-title{

    color:#ffd45a;
    font-size:17px;
    font-weight:bold;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.header-status{

    display:flex;
    align-items:center;

    gap:5px;
    margin-top:4px;

    color:#8d928a;
    font-size:10px;
}

.online-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#42d96b;

    box-shadow:
        0 0 8px
        rgba(66,217,107,.7);
}

.header-actions{

    display:flex;
    gap:6px;
}

.header-btn{

    width:38px;
    height:38px;

    border:0;
    outline:0;

    border-radius:50%;

    background:
        rgba(255,255,255,.05);

    color:#ddd;

    font-size:17px;

    cursor:pointer;
}

.header-btn:active{

    transform:scale(.91);

    background:
        rgba(255,193,7,.15);
}

/* ================= CHAT ================= */

.chat-area{

    flex:1;
    min-height:0;

    position:relative;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(255,193,7,.025),
            transparent 25%
        ),
        radial-gradient(
            circle at 80% 75%,
            rgba(255,193,7,.02),
            transparent 30%
        ),
        #090a09;
}

.honey-bg{

    position:absolute;
    inset:0;

    pointer-events:none;

    opacity:.7;

    background-image:
        radial-gradient(
            circle,
            rgba(255,193,7,.055) 1px,
            transparent 1.6px
        );

    background-size:28px 28px;
}

#messages{

    position:relative;
    z-index:2;

    width:100%;
    height:100%;

    overflow-y:auto;
    overflow-x:hidden;

    padding:
        14px
        10px
        100px;

    scroll-behavior:smooth;
}

#messages::-webkit-scrollbar{
    width:4px;
}

#messages::-webkit-scrollbar-track{
    background:transparent;
}

#messages::-webkit-scrollbar-thumb{
    background:#383a34;
    border-radius:10px;
}

/* ================= EMPTY ================= */

.empty-chat{

    min-height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:30px;
}

.empty-box{
    max-width:280px;
}

.empty-icon{

    font-size:52px;
    margin-bottom:12px;

    filter:
        drop-shadow(
            0 0 15px
            rgba(255,193,7,.15)
        );
}

.empty-title{

    color:#deded8;

    font-size:17px;
    font-weight:bold;

    margin-bottom:8px;
}

.empty-text{

    color:#777b73;

    font-size:12px;
    line-height:2;
}

/* ================= MESSAGE ================= */

.message-row{

    width:100%;

    display:flex;

    margin-bottom:8px;

    animation:
        messageIn
        .2s
        ease;
}

.message-row.me{
    justify-content:flex-start;
}

.message-row.other{
    justify-content:flex-end;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateY(5px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message-bubble{

    max-width:82%;

    padding:
        8px 11px;

    border-radius:15px;

    line-height:1.7;

    font-size:14px;

    word-break:break-word;

    position:relative;
}

.message-row.me .message-bubble{

    background:
        linear-gradient(
            145deg,
            #292a22,
            #1d1e1a
        );

    border:
        1px solid
        rgba(255,255,255,.035);

    border-bottom-right-radius:4px;
}

.message-row.other .message-bubble{

    background:
        linear-gradient(
            145deg,
            #5a4208,
            #3c2d08
        );

    border:
        1px solid
        rgba(255,193,7,.11);

    border-bottom-left-radius:4px;
}

.message-name{

    color:#ffc928;

    font-size:10px;
    font-weight:bold;

    margin-bottom:3px;
}

.message-text{

    color:#f2f2ed;

    white-space:pre-wrap;
}

.message-time{

    color:#858981;

    font-size:9px;

    margin-top:3px;

    text-align:left;
}

/* ================= IMAGE ================= */

.chat-image{

    display:block;

    width:auto;

    max-width:100%;

    max-height:360px;

    border-radius:12px;

    margin-top:5px;

    object-fit:contain;

    cursor:pointer;

    background:#111;
}

/* ================= INPUT ================= */

.input-area{

    position:absolute;

    right:0;
    bottom:0;
    left:0;

    z-index:15;

    padding:
        8px
        8px
        calc(
            8px +
            env(safe-area-inset-bottom)
        );

    background:
        linear-gradient(
            to top,
            #080908 75%,
            transparent
        );
}

.input-box{

    width:100%;

    min-height:50px;

    display:flex;
    align-items:flex-end;

    gap:6px;

    padding:6px;

    border-radius:26px;

    background:#171914;

    border:
        1px solid
        rgba(255,193,7,.14);

    box-shadow:
        0 5px 25px
        rgba(0,0,0,.5);
}

.input-btn,
.send-btn{

    flex:0 0 auto;

    width:39px;
    height:39px;

    border:0;
    outline:0;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    font-size:17px;
}

.input-btn{

    background:
        rgba(255,255,255,.045);

    color:#aaa;
}

.send-btn{

    background:
        linear-gradient(
            145deg,
            #ffc107,
            #d99500
        );

    color:#17130a;

    font-weight:bold;
}

.send-btn:disabled{
    opacity:.4;
}

#messageInput{

    flex:1;
    min-width:0;

    min-height:37px;
    max-height:110px;

    resize:none;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    font-family:inherit;

    font-size:14px;
    line-height:1.6;

    padding:
        7px 5px;

    overflow-y:auto;
}

#messageInput::placeholder{
    color:#6f726b;
}

/* ================= USERS ================= */

.users-overlay{

    position:fixed;
    inset:0;

    z-index:150;

    background:
        rgba(0,0,0,.7);

    backdrop-filter:
        blur(4px);

    opacity:0;
    pointer-events:none;

    transition:.25s;
}

.users-overlay.show{

    opacity:1;
    pointer-events:auto;
}

.users-panel{

    position:absolute;

    top:0;
    right:0;

    width:min(340px,88vw);

    height:100%;

    background:
        linear-gradient(
            160deg,
            #191a14,
            #0c0d0b
        );

    border-left:
        1px solid
        rgba(255,193,7,.13);

    box-shadow:
        -10px 0 40px
        rgba(0,0,0,.55);

    transform:
        translateX(100%);

    transition:.3s;

    display:flex;
    flex-direction:column;
}

.users-overlay.show .users-panel{

    transform:
        translateX(0);
}

.users-header{

    height:64px;
    flex:0 0 64px;

    display:flex;
    align-items:center;

    padding:
        0 14px;

    border-bottom:
        1px solid
        rgba(255,193,7,.12);
}

.users-title{

    flex:1;

    color:#ffd45a;

    font-size:16px;
    font-weight:bold;
}

.users-close{

    width:36px;
    height:36px;

    border:0;
    outline:0;

    border-radius:50%;

    background:
        rgba(255,255,255,.05);

    color:#ddd;

    font-size:18px;
}

#usersList{

    flex:1;

    overflow-y:auto;

    padding:10px;
}

.user-item{

    display:flex;
    align-items:center;

    gap:10px;

    padding:10px;

    margin-bottom:7px;

    border-radius:14px;

    background:
        rgba(255,255,255,.035);
}

.user-avatar{

    width:42px;
    height:42px;

    flex:0 0 42px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            #ffc107,
            #9b6900
        );

    color:#17130a;

    font-weight:bold;
}

.user-avatar img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.user-info{

    min-width:0;
    flex:1;
}

.user-name{

    color:#eee;

    font-size:13px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-online{

    color:#55d978;

    font-size:9px;

    margin-top:3px;
}

.private-btn{

    border:0;

    padding:
        8px 10px;

    border-radius:10px;

    background:
        linear-gradient(
            145deg,
            #ffc107,
            #d99500
        );

    color:#17130a;

    font-size:11px;

    font-weight:bold;

    cursor:pointer;
}

/* ================= PRIVATE CHAT ================= */

.private-overlay{

    position:fixed;

    inset:0;

    z-index:300;

    display:flex;
    flex-direction:column;

    background:#090a09;

    opacity:0;

    pointer-events:none;

    transform:translateY(20px);

    transition:.25s;
}

.private-overlay.show{

    opacity:1;

    pointer-events:auto;

    transform:translateY(0);
}

.private-header{

    height:64px;
    min-height:64px;

    display:flex;
    align-items:center;

    gap:9px;

    padding:
        0 10px;

    background:
        linear-gradient(
            135deg,
            #191a14,
            #0e0f0d
        );

    border-bottom:
        1px solid
        rgba(255,193,7,.16);
}

.private-back{

    width:40px;
    height:40px;

    border:0;

    border-radius:50%;

    background:
        rgba(255,255,255,.06);

    color:#fff;

    font-size:19px;
}

.private-avatar{

    width:40px;
    height:40px;

    border-radius:50%;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #ffc107,
            #9b6900
        );

    color:#17130a;

    font-weight:bold;
}

.private-avatar img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.private-user-info{

    flex:1;
    min-width:0;
}

.private-title{

    color:#ffd45a;

    font-size:15px;
    font-weight:bold;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.private-status{

    color:#55d978;

    font-size:9px;

    margin-top:3px;
}

.private-messages{

    flex:1;

    min-height:0;

    overflow-y:auto;

    padding:
        14px 10px 100px;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,193,7,.025),
            transparent 25%
        ),
        #090a09;
}

.private-input-area{

    position:absolute;

    right:0;
    bottom:0;
    left:0;

    padding:
        8px
        8px
        calc(
            8px +
            env(safe-area-inset-bottom)
        );

    background:
        linear-gradient(
            to top,
            #080908 75%,
            transparent
        );
}

/* ================= PROFILE ================= */

.profile-overlay{

    position:fixed;
    inset:0;

    z-index:400;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        rgba(0,0,0,.75);

    backdrop-filter:
        blur(6px);

    opacity:0;

    pointer-events:none;

    transition:.25s;
}

.profile-overlay.show{

    opacity:1;
    pointer-events:auto;
}

.profile-box{

    width:100%;
    max-width:360px;

    padding:22px 18px;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            #1b1c16,
            #0d0e0c
        );

    border:
        1px solid
        rgba(255,193,7,.17);

    box-shadow:
        0 15px 50px
        rgba(0,0,0,.7);

    text-align:center;
}

.profile-avatar{

    position:relative;

    width:82px;
    height:82px;

    margin:
        0 auto 12px;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #ffc107,
            #9b6900
        );

    color:#17130a;

    font-size:32px;
    font-weight:bold;

    cursor:pointer;
}

.profile-avatar img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.profile-title{

    color:#ffd45a;

    font-size:18px;
    font-weight:bold;

    margin-bottom:18px;
}

.profile-label{

    display:block;

    text-align:right;

    color:#999d94;

    font-size:11px;

    margin-bottom:6px;
}

#profileName{

    width:100%;
    height:45px;

    padding:
        0 13px;

    border-radius:12px;

    border:
        1px solid
        rgba(255,255,255,.08);

    outline:none;

    background:#11120f;

    color:#fff;

    font-size:14px;

    text-align:right;
}

.profile-actions{

    display:flex;

    gap:8px;

    margin-top:16px;
}

.profile-action{

    flex:1;

    height:43px;

    border:0;

    border-radius:12px;

    cursor:pointer;
}

.profile-save{

    background:
        linear-gradient(
            145deg,
            #ffc107,
            #d99500
        );

    color:#18140a;

    font-weight:bold;
}

.profile-cancel{

    background:
        rgba(255,255,255,.06);

    color:#ddd;
}

/* ================= IMAGE VIEWER ================= */

.image-viewer{

    position:fixed;

    inset:0;

    z-index:600;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:15px;

    background:
        rgba(0,0,0,.9);

    opacity:0;

    pointer-events:none;

    transition:.2s;
}

.image-viewer.show{

    opacity:1;
    pointer-events:auto;
}

.image-viewer img{

    max-width:100%;
    max-height:90vh;

    border-radius:12px;

    object-fit:contain;
}

.image-viewer-close{

    position:absolute;

    top:15px;
    left:15px;

    width:42px;
    height:42px;

    border:0;

    border-radius:50%;

    background:
        rgba(255,255,255,.1);

    color:#fff;

    font-size:22px;
}

/* ================= STATUS ================= */

.connection-status{

    position:absolute;

    top:10px;
    left:50%;

    transform:
        translateX(-50%);

    z-index:30;

    padding:
        5px 12px;

    border-radius:20px;

    background:
        rgba(20,21,18,.92);

    color:#aaa;

    font-size:10px;

    opacity:0;

    pointer-events:none;

    transition:.3s;
}

.connection-status.show{
    opacity:1;
}

.connection-status.online{
    color:#55d978;
}

.connection-status.offline{
    color:#ff6969;
}

@media(max-width:360px){

    .chat-header{
        height:58px;
        min-height:58px;
        padding:0 8px;
    }

    .logo{
        width:38px;
        height:38px;
        flex-basis:38px;
        font-size:20px;
    }

    .header-title{
        font-size:15px;
    }

    .message-bubble{
        max-width:86%;
        font-size:13px;
    }

}

::selection{

    background:#9d7600;
    color:#fff;
}

</style>

</head>

<body>

<div id="app">

<header class="chat-header">

    <div
        class="logo"
        id="profileOpen">

        🍯

    </div>

    <div class="header-info">

        <div
            class="header-title"
            id="headerTitle">

            عسل چت

        </div>

        <div class="header-status">

            <span class="online-dot"></span>

            <span id="onlineStatus">
                در حال اتصال...
            </span>

        </div>

    </div>

    <div class="header-actions">

        <button
            class="header-btn"
            id="usersBtn"
            type="button">

            👥

        </button>

        <button
            class="header-btn"
            id="exitBtn"
            type="button">

            ⎋

        </button>

    </div>

</header>


<main class="chat-area">

    <div class="honey-bg"></div>

    <div
        id="connectionStatus"
        class="connection-status">

        در حال اتصال...

    </div>

    <div id="messages">

        <div class="empty-chat">

            <div class="empty-box">

                <div class="empty-icon">
                    🍯
                </div>

                <div class="empty-title">
                    به عسل چت خوش آمدید
                </div>

                <div class="empty-text">
                    پیام خود را بنویسید و گفتگو را شروع کنید.
                </div>

            </div>

        </div>

    </div>


    <div class="input-area">

        <div class="input-box">

            <button
                class="input-btn"
                id="attachBtn"
                type="button">

                📎

            </button>

            <textarea
                id="messageInput"
                rows="1"
                maxlength="2000"
                placeholder="پیام خود را بنویسید..."
                autocomplete="off"></textarea>

            <button
                class="send-btn"
                id="sendBtn"
                type="button">

                ➤

            </button>

        </div>

    </div>

</main>

</div>


<!-- ================= USERS ================= -->

<div
    class="users-overlay"
    id="usersOverlay">

    <div class="users-panel">

        <div class="users-header">

            <div class="users-title">
                کاربران آنلاین
            </div>

            <button
                class="users-close"
                id="usersClose"
                type="button">

                ✕

            </button>

        </div>

        <div id="usersList">

            <div class="no-users">
                در حال دریافت کاربران...
            </div>

        </div>

    </div>

</div>


<!-- ================= PRIVATE CHAT ================= -->

<div
    class="private-overlay"
    id="privateOverlay">

    <div class="private-header">

        <button
            class="private-back"
            id="privateBack"
            type="button">

            ➜

        </button>

        <div
            class="private-avatar"
            id="privateAvatar">

            م

        </div>

        <div class="private-user-info">

            <div
                class="private-title"
                id="privateTitle">

                چت خصوصی

            </div>

            <div class="private-status">
                🔒 گفت‌وگوی خصوصی
            </div>

        </div>

    </div>


    <div
        class="private-messages"
        id="privateMessages">

        <div class="empty-chat">

            <div class="empty-box">

                <div class="empty-icon">
                    🔒
                </div>

                <div class="empty-title">
                    چت خصوصی
                </div>

                <div class="empty-text">
                    این گفتگو فقط بین شما و این کاربر است.
                </div>

            </div>

        </div>

    </div>


    <div class="private-input-area">

        <div class="input-box">

            <button
                class="input-btn"
                id="privateAttachBtn"
                type="button">

                📎

            </button>

            <textarea
                id="privateInput"
                rows="1"
                maxlength="2000"
                placeholder="پیام خصوصی..."
                autocomplete="off"></textarea>

            <button
                class="send-btn"
                id="privateSendBtn"
                type="button">

                ➤

            </button>

        </div>

    </div>

</div>


<!-- ================= PROFILE ================= -->

<div
    class="profile-overlay"
    id="profileOverlay">

    <div class="profile-box">

        <div
            class="profile-avatar"
            id="profileAvatar">

            م

        </div>

/* =====================================================
   IMAGE UPLOAD HELPER
===================================================== */

async function uploadImage(
    file,
    path
){

    const extension =
        file.name
            .split(".")
            .pop()
            .toLowerCase();


    const fileName =
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2,10) +
        "." +
        extension;


    const fileRef =
        storageRef(
            storage,
            path +
            "/" +
            fileName
        );


    const uploaded =
        await uploadBytes(
            fileRef,
            file,
            {
                contentType:
                    file.type
            }
        );


    return await getDownloadURL(
        uploaded.ref
    );

}
