<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>عسل چت 🍯</title>

<meta name="theme-color" content="#11100d">

<style>

/* ================================
   RESET
================================ */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 20% 10%,
            rgba(255,193,7,.08),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 80%,
            rgba(255,170,0,.05),
            transparent 35%
        ),
        #0d0c0a;

    color:#fff;
}


/* ================================
   APP
================================ */

.app{
    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;

    position:relative;
}


/* ================================
   HEADER
================================ */

.header{

    height:62px;
    min-height:62px;

    display:flex;
    align-items:center;

    padding:0 14px;

    background:
        linear-gradient(
            135deg,
            #1c1a16,
            #11100d
        );

    border-bottom:
        1px solid
        rgba(255,193,7,.15);

    box-shadow:
        0 4px 20px
        rgba(0,0,0,.35);

    z-index:10;
}

.header-right{

    display:flex;
    align-items:center;
    gap:10px;

    flex:1;
}

.logo{

    width:42px;
    height:42px;

    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #ffd54a,
            #c88600
        );

    box-shadow:
        0 4px 15px
        rgba(255,193,7,.2);

    font-size:22px;
}

.title-box{
    display:flex;
    flex-direction:column;
    gap:3px;
}

.title{
    font-size:17px;
    font-weight:bold;
    color:#fff;
}

.online-status{

    display:flex;
    align-items:center;
    gap:5px;

    color:#a8a8a8;
    font-size:11px;
}

.online-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#39d353;

    box-shadow:
        0 0 8px
        rgba(57,211,83,.7);
}

.exit-btn{

    border:0;

    width:38px;
    height:38px;

    border-radius:12px;

    background:
        rgba(255,255,255,.06);

    color:#bbb;

    font-size:18px;

    cursor:pointer;
}


/* ================================
   ONLINE USERS
================================ */

.online-panel{

    position:absolute;

    top:70px;
    right:10px;

    width:190px;

    max-height:230px;

    overflow-y:auto;

    background:
        rgba(22,20,16,.97);

    border:
        1px solid
        rgba(255,193,7,.15);

    border-radius:16px;

    padding:10px;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.45);

    z-index:20;
}

.online-title{

    font-size:12px;

    color:#d7a928;

    padding:
        5px 6px 9px;

    border-bottom:
        1px solid
        rgba(255,255,255,.06);
}

.online-user{

    display:flex;

    align-items:center;

    gap:8px;

    padding:8px 5px;

    font-size:12px;

    color:#ddd;
}

.online-avatar{

    width:30px;
    height:30px;

    border-radius:10px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #e5ad25,
            #7c5200
        );

    color:#fff;

    font-weight:bold;
}

.user-online-dot{

    width:6px;
    height:6px;

    border-radius:50%;

    background:#39d353;

    margin-right:auto;
}


/* ================================
   CHAT
================================ */

.chat{

    flex:1;

    overflow-y:auto;

    padding:
        15px
        12px
        85px;

    display:flex;
    flex-direction:column;

    gap:7px;

    background-image:

        radial-gradient(
            circle at 10% 20%,
            rgba(255,193,7,.025) 0 2px,
            transparent 3px
        ),

        radial-gradient(
            circle at 80% 60%,
            rgba(255,193,7,.018) 0 2px,
            transparent 3px
        );
}

.chat::-webkit-scrollbar{
    width:4px;
}

.chat::-webkit-scrollbar-thumb{
    background:#4c3b14;
    border-radius:10px;
}


/* ================================
   MESSAGE
================================ */

.message{

    max-width:82%;

    display:flex;

    flex-direction:column;

    animation:
        messageIn .18s ease;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateY(6px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message.mine{

    align-self:flex-start;
    align-items:flex-start;
}

.message.other{

    align-self:flex-end;
    align-items:flex-end;
}

.sender{

    font-size:10px;

    color:#d6a92b;

    margin:
        0 7px 3px;
}

.bubble{

    padding:
        9px 12px;

    border-radius:16px;

    font-size:14px;

    line-height:1.7;

    word-break:break-word;

    box-shadow:
        0 3px 10px
        rgba(0,0,0,.18);
}

.mine .bubble{

    background:
        linear-gradient(
            135deg,
            #72520d,
            #503805
        );

    border-bottom-left-radius:5px;
}

.other .bubble{

    background:
        #211f1a;

    border:
        1px solid
        rgba(255,255,255,.05);

    border-bottom-right-radius:5px;
}

.time{

    font-size:9px;

    color:#888;

    margin:
        3px 7px 0;
}


/* ================================
   IMAGE MESSAGE
================================ */

.message-image{

    max-width:230px;

    max-height:300px;

    border-radius:13px;

    display:block;

    object-fit:cover;

    border:
        1px solid
        rgba(255,193,7,.15);
}


/* ================================
   EMPTY
================================ */

.empty{

    margin:auto;

    text-align:center;

    color:#777;

    font-size:13px;

    line-height:2;
}

.empty-icon{

    font-size:42px;

    margin-bottom:8px;
}


/* ================================
   INPUT AREA
================================ */

.input-area{

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    padding:
        9px 10px;

    background:
        linear-gradient(
            180deg,
            rgba(13,12,10,.3),
            #0d0c0a 30%
        );

    z-index:15;
}

.input-box{

    min-height:50px;

    display:flex;

    align-items:center;

    gap:7px;

    padding:
        5px 7px;

    border-radius:18px;

    background:
        #1b1915;

    border:
        1px solid
        rgba(255,193,7,.12);

    box-shadow:
        0 -3px 20px
        rgba(0,0,0,.3);
}

.input{

    flex:1;

    border:0;
    outline:0;

    resize:none;

    min-height:38px;
    max-height:100px;

    padding:
        9px 8px;

    background:transparent;

    color:#fff;

    font-family:inherit;

    font-size:14px;
}

.input::placeholder{
    color:#777;
}

.icon-btn{

    width:39px;
    height:39px;

    flex:none;

    border:0;

    border-radius:12px;

    background:
        rgba(255,255,255,.05);

    color:#bbb;

    font-size:18px;

    cursor:pointer;
}

.send-btn{

    width:42px;
    height:42px;

    flex:none;

    border:0;

    border-radius:14px;

    background:
        linear-gradient(
            145deg,
            #ffd54a,
            #bd7900
        );

    color:#17120a;

    font-size:19px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 4px 12px
        rgba(255,193,7,.18);
}

.send-btn:active,
.icon-btn:active,
.exit-btn:active{
    transform:scale(.94);
}


/* ================================
   IMAGE PREVIEW
================================ */

.preview{

    display:none;

    position:absolute;

    bottom:72px;

    right:10px;

    width:120px;

    height:120px;

    background:#171511;

    border:
        1px solid
        rgba(255,193,7,.2);

    border-radius:15px;

    padding:5px;

    z-index:30;
}

.preview img{

    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:11px;
}

.preview-close{

    position:absolute;

    top:-7px;
    left:-7px;

    width:24px;
    height:24px;

    border:0;

    border-radius:50%;

    background:#333;

    color:#fff;
}


/* ================================
   LOADING
================================ */

.loading{

    position:fixed;

    inset:0;

    background:#0d0c0a;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    gap:12px;

    z-index:100;
}

.loading-logo{
    font-size:45px;
}

.loading-text{
    color:#c49a25;
    font-size:13px;
}


/* ================================
   TOAST
================================ */

.toast{

    position:fixed;

    top:75px;
    left:50%;

    transform:
        translateX(-50%)
        translateY(-20px);

    opacity:0;

    pointer-events:none;

    background:#242019;

    color:#fff;

    padding:
        9px 16px;

    border-radius:12px;

    font-size:12px;

    border:
        1px solid
        rgba(255,193,7,.15);

    transition:.25s;

    z-index:200;
}

.toast.show{

    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* ================================
   MOBILE
================================ */

@media(max-width:500px){

    .online-panel{
        width:170px;
    }

    .message{
        max-width:86%;
    }

    .bubble{
        font-size:13px;
    }
}

</style>

</head>


<body>


<div class="app">


    <!-- HEADER -->

    <header class="header">

        <div class="header-right">

            <div class="logo">
                🍯
            </div>

            <div class="title-box">

                <div class="title">
                    عسل چت
                </div>

                <div class="online-status">

                    <span class="online-dot"></span>

                    <span id="onlineCount">
                        0 نفر آنلاین
                    </span>

                </div>

            </div>

        </div>


        <button
            class="exit-btn"
            id="exitBtn"
            title="خروج">
            ↪
        </button>

    </header>



    <!-- ONLINE USERS -->

    <div class="online-panel">

        <div class="online-title">
            👥 کاربران آنلاین
        </div>

        <div id="onlineUsers">

            <div
                style="
                color:#777;
                font-size:11px;
                padding:8px;
                ">
                در حال دریافت...
            </div>

        </div>

    </div>



    <!-- CHAT -->

    <main
        class="chat"
        id="chat">

        <div
            class="empty"
            id="empty">

            <div class="empty-icon">
                🍯
            </div>

            هنوز پیامی ارسال نشده

            <br>

            اولین پیام را بفرست!

        </div>

    </main>



    <!-- PREVIEW -->

    <div
        class="preview"
        id="preview">

        <button
            class="preview-close"
            id="previewClose">
            ×
        </button>

        <img
            id="previewImage"
            alt="preview">

    </div>



    <!-- INPUT -->

    <div class="input-area">

        <div class="input-box">


            <input
                type="file"
                id="imageInput"
                accept="image/*"
                hidden>


            <button
                class="icon-btn"
                id="imageBtn"
                title="ارسال عکس">

                📷

            </button>


            <textarea
                class="input"
                id="messageInput"
                rows="1"
                placeholder="پیامت رو بنویس..."></textarea>


            <button
                class="send-btn"
                id="sendBtn">

                ➤

            </button>

        </div>

    </div>


</div>



<!-- LOADING -->

<div
    class="loading"
    id="loading">

    <div class="loading-logo">
        🍯
    </div>

    <div class="loading-text">
        در حال اتصال به عسل چت...
    </div>

</div>



<!-- TOAST -->

<div
    class="toast"
    id="toast">
</div>



<script type="module">


/* =========================================
   FIREBASE IMPORTS
========================================= */

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
    getDatabase,
    ref,
    push,
    set,
    onValue,
    onChildAdded,
    onDisconnect,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";


import {
    getStorage,
    ref as storageRef,
    uploadBytes,
    getDownloadURL
} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-storage.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

/*
   ⚠️ این قسمت را با Firebase Config
   پروژه خودت جایگزین کن.
*/

const firebaseConfig = {

    apiKey:
        "YOUR_API_KEY",

    authDomain:
        "YOUR_PROJECT.firebaseapp.com",

    databaseURL:
        "https://YOUR_PROJECT-default-rtdb.firebaseio.com",

    projectId:
        "YOUR_PROJECT",

    storageBucket:
        "YOUR_PROJECT.firebasestorage.app",

    messagingSenderId:
        "YOUR_SENDER_ID",

    appId:
        "YOUR_APP_ID"

};


/* =========================================
   INITIALIZE
========================================= */

const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);

const storage =
    getStorage(app);


/* =========================================
   USER
========================================= */

let username =
    localStorage.getItem("username");


/*
   اگر نام کاربر وجود نداشت،
   برگرد به صفحه ورود.
*/

if(!username){

    window.location.href =
        "index.html";

}


/* =========================================
   ELEMENTS
========================================= */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const imageBtn =
    document.getElementById("imageBtn");

const imageInput =
    document.getElementById("imageInput");

const preview =
    document.getElementById("preview");

const previewImage =
    document.getElementById("previewImage");

const previewClose =
    document.getElementById("previewClose");

const onlineUsers =
    document.getElementById("onlineUsers");

const onlineCount =
    document.getElementById("onlineCount");

const loading =
    document.getElementById("loading");

const toast =
    document.getElementById("toast");

const exitBtn =
    document.getElementById("exitBtn");

const empty =
    document.getElementById("empty");


/* =========================================
   DATABASE REFERENCES
========================================= */

const messagesRef =
    ref(db, "messages");

const onlineRef =
    ref(
        db,
        "online/" +
        encodeURIComponent(username)
    );


/* =========================================
   SHOW USER
========================================= */

function showUser(){

    /*
       نام کاربر در localStorage
       از صفحه ورود گرفته می‌شود.
    */

    console.log(
        "User:",
        username
    );

}


/* =========================================
   ONLINE USER
========================================= */

async function setOnline(){

    try{

        await set(
            onlineRef,
            {

                name:
                    username,

                time:
                    serverTimestamp()

            }
        );


        onDisconnect(
            onlineRef
        ).remove();


    }catch(error){

        console.error(
            "Online error:",
            error
        );

    }

}


setOnline();


/* =========================================
   ONLINE LIST
========================================= */

onValue(
    ref(db,"online"),
    snapshot => {

        onlineUsers.innerHTML = "";

        let count = 0;


        snapshot.forEach(
            child => {

                const data =
                    child.val();

                if(!data) return;

                count++;


                const row =
                    document.createElement(
                        "div"
                    );

                row.className =
                    "online-user";


                const avatar =
                    document.createElement(
                        "div"
                    );

                avatar.className =
                    "online-avatar";


                avatar.textContent =
                    (data.name || "?")
                    .charAt(0)
                    .toUpperCase();


                const name =
                    document.createElement(
                        "span"
                    );

                name.textContent =
                    data.name || "کاربر";


                const dot =
                    document.createElement(
                        "span"
                    );

                dot.className =
                    "user-online-dot";


                row.appendChild(
                    avatar
                );

                row.appendChild(
                    name
                );

                row.appendChild(
                    dot
                );


                onlineUsers.appendChild(
                    row
                );

            }
        );


        onlineCount.textContent =
            count +
            " نفر آنلاین";

    }
);


/* =========================================
   ADD MESSAGE
========================================= */

function addMessage(
    data
){

    if(!data) return;


    empty.style.display =
        "none";


    const wrapper =
        document.createElement(
            "div"
        );


    const mine =
        data.name === username;


    wrapper.className =
        "message " +
        (
            mine
            ? "mine"
            : "other"
        );


    if(!mine){

        const sender =
            document.createElement(
                "div"
            );

        sender.className =
            "sender";

        sender.textContent =
            data.name ||
            "کاربر";

        wrapper.appendChild(
            sender
        );

    }


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";


    /*
       اگر پیام عکس باشد
    */

    if(data.image){

        const img =
            document.createElement(
                "img"
            );

        img.className =
            "message-image";

        img.src =
            data.image;

        img.alt =
            "تصویر";

        img.loading =
            "lazy";

        bubble.appendChild(
            img
        );

    }


    /*
       اگر پیام متنی باشد
    */

    if(data.text){

        const text =
            document.createElement(
                "div"
            );

        text.textContent =
            data.text;

        bubble.appendChild(
            text
        );

    }


    const time =
        document.createElement(
            "div"
        );

    time.className =
        "time";


    if(data.time){

        const date =
            new Date(
                data.time
            );

        if(
            !isNaN(
                date.getTime()
            )
        ){

            time.textContent =
                date.toLocaleTimeString(
                    "fa-IR",
                    {
                        hour:
                            "2-digit",

                        minute:
                            "2-digit"
                    }
                );

        }

    }


    wrapper.appendChild(
        bubble
    );

    wrapper.appendChild(
        time
    );


    chat.appendChild(
        wrapper
    );


    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================================
   RECEIVE MESSAGES
========================================= */

onChildAdded(
    messagesRef,
    snapshot => {

        const data =
            snapshot.val();

        addMessage(
            data
        );

    }
);


/* =========================================
   SEND TEXT
========================================= */

async function sendMessage(){

    const text =
        input.value.trim();


    if(!text)
        return;


    try{

        await push(
            messagesRef,
            {

                name:
                    username,

                text:
                    text,

                time:
                    Date.now()

            }
        );


        input.value =
            "";

        input.style.height =
            "38px";


    }catch(error){

        console.error(
            error
        );

        showToast(
            "ارسال پیام ناموفق بود"
        );

    }

}


/* =========================================
   SEND BUTTON
========================================= */

sendBtn.addEventListener(
    "click",
    sendMessage
);


/* =========================================
   ENTER
========================================= */

input.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================
   AUTO RESIZE
========================================= */

input.addEventListener(
    "input",
    () => {

        input.style.height =
            "38px";

        input.style.height =
            Math.min(
                input.scrollHeight,
                100
            ) + "px";

    }
);


/* =========================================
   IMAGE BUTTON
========================================= */

imageBtn.addEventListener(
    "click",
    () => {

        imageInput.click();

    }
);


/* =========================================
   IMAGE SELECT
========================================= */

imageInput.addEventListener(
    "change",
    () => {

        const file =
            imageInput.files[0];

        if(!file)
            return;


        const reader =
            new FileReader();


        reader.onload =
            event => {

                previewImage.src =
                    event.target.result;

                preview.style.display =
                    "block";

            };


        reader.readAsDataURL(
            file
        );

    }
);


/* =========================================
   CLOSE PREVIEW
========================================= */

previewClose.addEventListener(
    "click",
    () => {

        imageInput.value =
            "";

        preview.style.display =
            "none";

    }
);


/* =========================================
   UPLOAD IMAGE
========================================= */

async function uploadImage(
    file
){

    if(!file)
        return;


    try{

        showToast(
            "در حال ارسال عکس..."
        );


        const fileName =
            Date.now() +
            "_" +
            file.name;


        const imageRef =
            storageRef(
                storage,
                "chat-images/" +
                fileName
            );


        await uploadBytes(
            imageRef,
            file
        );


        const url =
            await getDownloadURL(
                imageRef
            );


        await push(
            messagesRef,
            {

                name:
                    username,

                image:
                    url,

                time:
                    Date.now()

            }
        );


        imageInput.value =
            "";

        preview.style.display =
            "none";


        showToast(
            "عکس ارسال شد ✓"
        );


    }catch(error){

        console.error(
            error
        );

        showToast(
            "ارسال عکس ناموفق بود"
        );

    }

}


/* =========================================
   IMAGE SEND
========================================= */

imageInput.addEventListener(
    "change",
    async () => {

        const file =
            imageInput.files[0];

        if(file){

            await uploadImage(
                file
            );

        }

    }
);


/* =========================================
   EXIT
========================================= */

exitBtn.addEventListener(
    "click",
    async () => {

        try{

            await set(
                onlineRef,
                null
            );

        }catch(e){

            console.log(e);

        }


        localStorage.removeItem(
            "username"
        );


        window.location.href =
            "index.html";

    }
);


/* =========================================
   TOAST
========================================= */

let toastTimer;

function showToast(
    text
){

    toast.textContent =
        text;

    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}
