<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عسل چت</title>

<style>

*{
box-sizing:border-box;
font-family:tahoma;
}

body{
margin:0;
height:100vh;
background:#080808;
color:white;
display:flex;
justify-content:center;
align-items:center;
}


.chat{

width:100%;
max-width:450px;
height:95vh;
background:#111;
border-radius:25px;
overflow:hidden;
display:flex;
flex-direction:column;

}


.header{

padding:20px;
background:#1d1d1d;
color:#d6a436;
font-size:22px;
text-align:center;

}


#online{

font-size:13px;
color:#00ff88;

}


.messages{

flex:1;
padding:15px;
overflow-y:auto;

}


.msg{

background:#222;
padding:12px;
border-radius:15px;
margin:10px 0;
width:max-content;
max-width:80%;

}


.send{

display:flex;
padding:15px;
gap:10px;

}


input{

flex:1;
padding:12px;
border-radius:20px;
border:none;
background:#222;
color:white;

}


button{

padding:12px 20px;
border:none;
border-radius:20px;
background:#d6a436;

}

</style>

</head>


<body>


<div class="chat">


<div class="header">

🍯 عسل چت

<div id="online">
در حال اتصال...
</div>

</div>


<div class="messages" id="messages">

</div>


<div class="send">

<input id="text" placeholder="پیام بنویس">

<button id="sendBtn">
ارسال
</button>

</div>


</div>


<script type="module" src="script.js"></script>


</body>

</html>
