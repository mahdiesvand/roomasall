<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>🐝 عسل منچ</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    min-height:100vh;

    background:#101114;

    font-family:
    Tahoma,
    Arial,
    sans-serif;

    color:white;

    display:flex;

    justify-content:center;

}

.game{

    width:100%;

    max-width:600px;

    padding:12px;

}

h1{

    text-align:center;

    margin:8px 0 4px;

    font-size:26px;

}

.subtitle{

    text-align:center;

    color:#999;

    font-size:12px;

    margin-bottom:12px;

}


/* =========================
   تخته
========================= */

.board{

    width:100%;

    aspect-ratio:1;

    background:white;

    border:5px solid #292c33;

    border-radius:18px;

    position:relative;

    overflow:hidden;

}


/* =========================
   چهار خانه
========================= */

.home{

    position:absolute;

    width:40%;

    height:40%;

    display:grid;

    grid-template-columns:1fr 1fr;

    grid-template-rows:1fr 1fr;

    gap:8%;

    padding:8%;

}

.home.red{

    top:0;

    left:0;

    background:#e74c3c;

}

.home.green{

    top:0;

    right:0;

    background:#2ecc71;

}

.home.blue{

    bottom:0;

    left:0;

    background:#3498db;

}

.home.yellow{

    bottom:0;

    right:0;

    background:#f1c40f;

}


.slot{

    background:white;

    border-radius:50%;

    border:3px solid rgba(0,0,0,.25);

}


/* =========================
   مسیر اصلی
========================= */

.path{

    position:absolute;

    left:40%;

    top:0;

    width:20%;

    height:100%;

    display:grid;

    grid-template-rows:
    repeat(7,1fr);

}


.path.right{

    left:60%;

}


.path-left{

    position:absolute;

    left:0;

    top:40%;

    width:40%;

    height:20%;

    display:grid;

    grid-template-columns:
    repeat(7,1fr);

}


.path-right{

    position:absolute;

    right:0;

    top:40%;

    width:40%;

    height:20%;

    display:grid;

    grid-template-columns:
    repeat(7,1fr);

}


.cell{

    background:#fff;

    border:1px solid #aaa;

}


/* =========================
   مرکز
========================= */

.center{

    position:absolute;

    width:20%;

    height:20%;

    left:40%;

    top:40%;

    background:
    conic-gradient(
        #e74c3c 0 25%,
        #2ecc71 0 50%,
        #f1c40f 0 75%,
        #3498db 0
    );

}


/* =========================
   مهره ها
========================= */

.piece{

    width:12%;

    aspect-ratio:1;

    border-radius:50%;

    border:3px solid white;

    position:absolute;

    z-index:10;

    box-shadow:
    0 3px 8px rgba(0,0,0,.5);

}


.red-piece{

    background:#e74c3c;

}

.green-piece{

    background:#2ecc71;

}

.blue-piece{

    background:#3498db;

}

.yellow-piece{

    background:#f1c40f;

}


/* =========================
   کنترل
========================= */

.controls{

    margin-top:12px;

    background:#191b20;

    border:1px solid #292c33;

    border-radius:16px;

    padding:14px;

    text-align:center;

}

.turn{

    color:#aaa;

    font-size:13px;

    margin-bottom:10px;

}

.turn span{

    color:#f5b400;

    font-weight:bold;

}

.dice{

    width:60px;

    height:60px;

    background:white;

    color:#111;

    border-radius:14px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:32px;

    margin:0 auto 10px;

}

.roll{

    width:100%;

    border:0;

    border-radius:12px;

    padding:14px;

    background:#f5b400;

    color:#111;

    font-weight:bold;

    font-size:16px;

}

.message{

    color:#999;

    font-size:12px;

    margin-top:9px;

}


/* =========================
   موبایل
========================= */

@media(max-width:420px){

    .game{

        padding:7px;

    }

    h1{

        font-size:23px;

    }

    .board{

        border-width:3px;

    }

}

</style>

</head>


<body>


<div class="game">


<h1>
🐝 عسل منچ
</h1>


<div class="subtitle">

نسخه ۴.۱ — تخته پایه

</div>



<!-- =========================
     تخته
========================= -->

<div
class="board"
id="board"
>


<!-- قرمز -->

<div class="home red">

<div class="slot"></div>
<div class="slot"></div>
<div class="slot"></div>
<div class="slot"></div>

</div>


<!-- سبز -->

<div class="home green">

<div class="slot"></div>
<div class="slot"></div>
<div class="slot"></div>
<div class="slot"></div>

</div>


<!-- آبی -->

<div class="home blue">

<div class="slot"></div>
<div class="slot"></div>
<div class="slot"></div>
<div class="slot"></div>

</div>


<!-- زرد -->

<div class="home yellow">

<div class="slot"></div>
<div class="slot"></div>
<div class="slot"></div>
<div class="slot"></div>

</div>



<!-- مسیر عمودی -->

<div class="path">

<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>

</div>


<div class="path right">

<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>

</div>



<!-- مسیر افقی -->

<div class="path-left">

<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>

</div>


<div class="path-right">

<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>

</div>



<!-- مرکز -->

<div class="center"></div>



<!-- =========================
     مهره ها
========================= -->


<!-- قرمز -->

<div
class="piece red-piece"
style="left:12%;top:12%;"
></div>

<div
class="piece red-piece"
style="left:25%;top:12%;"
></div>

<div
class="piece red-piece"
style="left:12%;top:25%;"
></div>

<div
class="piece red-piece"
style="left:25%;top:25%;"
></div>



<!-- سبز -->

<div
class="piece green-piece"
style="right:12%;top:12%;"
></div>

<div
class="piece green-piece"
style="right:25%;top:12%;"
></div>

<div
class="piece green-piece"
style="right:12%;top:25%;"
></div>

<div
class="piece green-piece"
style="right:25%;top:25%;"
></div>



<!-- آبی -->

<div
class="piece blue-piece"
style="left:12%;bottom:12%;"
></div>

<div
class="piece blue-piece"
style="left:25%;bottom:12%;"
></div>

<div
class="piece blue-piece"
style="left:12%;bottom:25%;"
></div>

<div
class="piece blue-piece"
style="left:25%;bottom:25%;"
></div>



<!-- زرد -->

<div
class="piece yellow-piece"
style="right:12%;bottom:12%;"
></div>

<div
class="piece yellow-piece"
style="right:25%;bottom:12%;"
></div>

<div
class="piece yellow-piece"
style="right:12%;bottom:25%;"
></div>

<div
class="piece yellow-piece"
style="right:25%;bottom:25%;"
></div>


</div>



<!-- =========================
     کنترل بازی
========================= -->

<div class="controls">


<div class="turn">

نوبت:

<span id="turn">
🔴 قرمز
</span>

</div>


<div
class="dice"
id="dice"
>
🎲
</div>


<button
class="roll"
onclick="rollDice()"
>

🎲 انداختن تاس

</button>


<div
class="message"
id="message"
>

برای شروع تاس بینداز

</div>


</div>


</div>



<script>


let currentPlayer = 0;


const players = [

"🔴 قرمز",

"🟢 سبز",

"🔵 آبی",

"🟡 زرد"

];


const faces = [

"⚀",

"⚁",

"⚂",

"⚃",

"⚄",

"⚅"

];


function rollDice(){

    const number =
    Math.floor(
        Math.random()*6
    );


    document
    .getElementById("dice")
    .textContent =
    faces[number];


    document
    .getElementById("message")
    .textContent =
    "🎉 عدد " +
    (number+1) +
    " آمد!";


    /*
     * فعلاً فقط نوبت را عوض می‌کنیم.
     * حرکت مهره‌ها را در مرحله بعد اضافه می‌کنیم.
     */

    currentPlayer++;


    if(
        currentPlayer >=
        players.length
    ){

        currentPlayer = 0;

    }


    document
    .getElementById("turn")
    .textContent =
    players[currentPlayer];

}


</script>


</body>

    </html>
