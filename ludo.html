<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>عسل‌منچ</title>


<style>

/* =========================
   تنظیمات اصلی
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


body{

    min-height:100vh;

    background:#101114;

    color:white;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    display:flex;

    justify-content:center;

    align-items:center;

}


/* =========================
   صفحه بازی
========================= */

.game-container{

    width:100%;

    max-width:600px;

    padding:15px;

}


/* =========================
   عنوان
========================= */

.header{

    text-align:center;

    margin-bottom:15px;

}


.header h1{

    font-size:28px;

    margin-bottom:6px;

}


.header p{

    color:#999;

    font-size:13px;

}


/* =========================
   صفحه بازی
========================= */

.board-wrapper{

    width:100%;

    aspect-ratio:1 / 1;

    max-width:560px;

    margin:auto;

    padding:8px;

    background:#191b20;

    border-radius:24px;

    border:1px solid #292c33;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.4);

}


/* =========================
   تخته
========================= */

.board{

    width:100%;

    height:100%;

    display:grid;

    grid-template-columns:
        repeat(15,1fr);

    grid-template-rows:
        repeat(15,1fr);

    gap:2px;

    background:#292c33;

    border-radius:18px;

    overflow:hidden;

}


/* =========================
   خانه‌های معمولی
========================= */

.cell{

    background:#e8e8e8;

    position:relative;

}


/* =========================
   خانه قرمز
========================= */

.red-home{

    background:#e74c3c;

}


/* =========================
   خانه سبز
========================= */

.green-home{

    background:#2ecc71;

}


/* =========================
   خانه آبی
========================= */

.blue-home{

    background:#3498db;

}


/* =========================
   خانه زرد
========================= */

.yellow-home{

    background:#f1c40f;

}


/* =========================
   منطقه وسط
========================= */

.center{

    background:
        linear-gradient(
            135deg,
            #e74c3c 0%,
            #e74c3c 25%,
            #f1c40f 25%,
            #f1c40f 50%,
            #3498db 50%,
            #3498db 75%,
            #2ecc71 75%
        );

}


/* =========================
   خانه‌های امن
========================= */

.safe{

    background:#ffffff;

}


.safe::after{

    content:"★";

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#f5b400;

    font-size:12px;

}


/* =========================
   کنترل بازی
========================= */

.controls{

    margin-top:15px;

    background:#191b20;

    border:1px solid #292c33;

    border-radius:18px;

    padding:15px;

    text-align:center;

}


/* =========================
   بازیکن فعلی
========================= */

.turn{

    color:#aaa;

    font-size:13px;

    margin-bottom:12px;

}


.turn strong{

    color:#f5b400;

}


/* =========================
   تاس
========================= */

.dice{

    width:70px;

    height:70px;

    margin:0 auto 12px;

    background:white;

    color:#111;

    border-radius:16px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:35px;

    font-weight:bold;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.3);

}


/* =========================
   دکمه
========================= */

.roll-btn{

    width:100%;

    border:0;

    border-radius:13px;

    padding:14px;

    background:#f5b400;

    color:#111;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

}


.roll-btn:active{

    transform:scale(.97);

}


.roll-btn:disabled{

    opacity:.5;

    cursor:not-allowed;

}


/* =========================
   اطلاعات بازیکنان
========================= */

.players{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:7px;

    margin-top:12px;

}


.player{

    padding:9px 4px;

    border-radius:10px;

    text-align:center;

    font-size:11px;

    background:#111318;

    border:2px solid transparent;

}


.player.red{

    border-color:#e74c3c;

}


.player.green{

    border-color:#2ecc71;

}


.player.blue{

    border-color:#3498db;

}


.player.yellow{

    border-color:#f1c40f;

}


.player.active{

    box-shadow:
        0 0 0 2px
        #f5b400;

}


/* =========================
   موبایل
========================= */

@media(max-width:420px){

    .game-container{

        padding:10px;

    }


    .header h1{

        font-size:24px;

    }


    .board-wrapper{

        padding:5px;

        border-radius:18px;

    }


    .board{

        gap:1px;

        border-radius:13px;

    }


    .dice{

        width:60px;

        height:60px;

        font-size:30px;

    }

}

</style>

</head>


<body>


<div class="game-container">


    <!-- عنوان -->

    <div class="header">

        <h1>
            🐝 عسل‌منچ
        </h1>

        <p>
            بازی چهار نفره عسل
        </p>

    </div>



    <!-- تخته -->

    <div class="board-wrapper">

        <div
            class="board"
            id="board"
        >

            <!-- خانه‌ها توسط JavaScript ساخته می‌شوند -->

        </div>

    </div>



    <!-- کنترل -->

    <div class="controls">


        <div class="turn">

            نوبت:

            <strong id="currentPlayer">
                🔴 قرمز
            </strong>

        </div>


        <div
            class="dice"
            id="dice"
        >
            🎲
        </div>


        <button
            class="roll-btn"
            id="rollButton"
            onclick="rollDice()"
        >

            🎲 انداختن تاس

        </button>



        <!-- بازیکنان -->

        <div class="players">


            <div class="player red active">

                🔴

                <br>

                قرمز

            </div>


            <div class="player green">

                🟢

                <br>

                سبز

            </div>


            <div class="player blue">

                🔵

                <br>

                آبی

            </div>


            <div class="player yellow">

                🟡

                <br>

                زرد

            </div>


        </div>


    </div>


</div>



<script>


/* =========================
   ساخت تخته
========================= */

const board =
    document.getElementById("board");


function createBoard(){

    board.innerHTML = "";


    for(
        let row = 0;
        row < 15;
        row++
    ){

        for(
            let col = 0;
            col < 15;
            col++
        ){

            const cell =
                document.createElement("div");


            cell.className =
                "cell";


            /*
             * چهار خانه اصلی
             */


            // قرمز

            if(
                row < 6 &&
                col < 6
            ){

                cell.classList.add(
                    "red-home"
                );

            }


            // سبز

            if(
                row < 6 &&
                col > 8
            ){

                cell.classList.add(
                    "green-home"
                );

            }


            // آبی

            if(
                row > 8 &&
                col < 6
            ){

                cell.classList.add(
                    "blue-home"
                );

            }


            // زرد

            if(
                row > 8 &&
                col > 8
            ){

                cell.classList.add(
                    "yellow-home"
                );

            }


            /*
             * مرکز
             */

            if(
                row >= 6 &&
                row <= 8 &&
                col >= 6 &&
                col <= 8
            ){

                cell.classList.add(
                    "center"
                );

            }


            board.appendChild(cell);

        }

    }

}


createBoard();



/* =========================
   تاس آزمایشی
========================= */

function rollDice(){

    const dice =
        document.getElementById("dice");


    const number =
        Math.floor(
            Math.random() * 6
        ) + 1;


    const faces = [
        "⚀",
        "⚁",
        "⚂",
        "⚃",
        "⚄",
        "⚅"
    ];


    dice.textContent =
        faces[number - 1];

}


window.rollDice =
    rollDice;


</script>


</body>

</html>
