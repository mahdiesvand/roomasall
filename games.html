<!DOCTYPE html><html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>عسل منچ 3D</title><style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02050a;
    font-family:Tahoma,Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}

.hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:10;
}

.top{
    position:absolute;
    top:14px;
    left:14px;
    right:14px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    padding:11px 16px;

    border-radius:15px;

    background:rgba(5,12,21,.72);
    border:1px solid rgba(255,255,255,.12);

    color:#fff;

    box-shadow:0 10px 30px rgba(0,0,0,.35);

    backdrop-filter:blur(14px);
}

.brand b{
    color:#ffd34d;
}

.info{
    padding:10px 15px;

    border-radius:15px;

    background:rgba(5,12,21,.72);
    border:1px solid rgba(255,255,255,.12);

    color:#d9e5f2;

    font-size:11px;

    backdrop-filter:blur(14px);
}

.turn{
    position:absolute;

    left:50%;
    bottom:22px;

    transform:translateX(-50%);

    min-width:205px;

    padding:9px 10px;

    border-radius:18px;

    display:flex;
    align-items:center;
    gap:10px;

    background:rgba(4,10,18,.86);

    border:1px solid rgba(255,255,255,.13);

    box-shadow:
        0 15px 40px rgba(0,0,0,.5),
        0 0 25px rgba(255,190,50,.08);

    backdrop-filter:blur(18px);
}

.turnText{
    flex:1;
    color:#fff;
    font-size:10px;
}

.turnText small{
    display:block;
    color:#8294a9;
    margin-bottom:4px;
}

.diceButton{
    width:52px;
    height:52px;

    border:0;
    border-radius:15px;

    background:
        linear-gradient(
            145deg,
            #fff,
            #bfcbd8
        );

    color:#162234;

    font-size:25px;

    box-shadow:
        0 7px 18px rgba(0,0,0,.45),
        inset 0 2px 4px rgba(255,255,255,.9);

    cursor:pointer;

    pointer-events:auto;
}

.diceButton.roll{
    animation:roll .6s ease;
}

@keyframes roll{
    0%{
        transform:rotate(0) scale(1);
    }
    35%{
        transform:rotate(140deg) scale(.75);
    }
    70%{
        transform:rotate(290deg) scale(1.12);
    }
    100%{
        transform:rotate(360deg) scale(1);
    }
}

.hint{
    position:absolute;

    left:50%;
    top:85px;

    transform:translateX(-50%);

    padding:9px 16px;

    border-radius:13px;

    background:rgba(4,10,18,.82);

    border:1px solid rgba(255,211,77,.2);

    color:#dce7f3;

    font-size:9px;

    opacity:0;

    transition:.3s;
}

.hint.show{
    opacity:1;
}

.player{
    position:absolute;

    width:145px;

    padding:9px;

    border-radius:16px;

    background:rgba(5,13,22,.78);

    border:1px solid rgba(255,255,255,.10);

    backdrop-filter:blur(15px);

    box-shadow:0 15px 35px rgba(0,0,0,.4);
}

.player.red{
    top:85px;
    left:12px;
}

.player.green{
    top:85px;
    right:12px;
}

.player.yellow{
    bottom:85px;
    right:12px;
}

.player.blue{
    bottom:85px;
    left:12px;
    border-color:rgba(85,190,255,.4);
}

.playerName{
    font-size:10px;
    color:white;
}

.playerStatus{
    margin-top:4px;
    font-size:8px;
    color:#6be58b;
}

@media(max-width:650px){

    .player{
        width:112px;
        padding:7px;
    }

    .player.red,
    .player.green{
        top:75px;
    }

    .player.yellow,
    .player.blue{
        bottom:75px;
    }

    .brand{
        font-size:11px;
    }

    .info{
        font-size:9px;
    }
}
</style></head><body><div id="game"></div><div class="hud"><div class="top">

    <div class="brand">
        🍯 عسل <b>منچ</b>
    </div>

    <div class="info">
        🟢 آنلاین
        &nbsp; • &nbsp;
        4 بازیکن
    </div>

</div>


<div class="player red">
    <div class="playerName">🔴 آرش</div>
    <div class="playerStatus">● آنلاین</div>
</div>

<div class="player green">
    <div class="playerName">🟢 علی</div>
    <div class="playerStatus">● آنلاین</div>
</div>

<div class="player yellow">
    <div class="playerName">🟡 محمد</div>
    <div class="playerStatus">● آنلاین</div>
</div>

<div class="player blue">
    <div class="playerName">🔵 شما</div>
    <div class="playerStatus">● نوبت شما</div>
</div>


<div class="hint" id="hint">
    🎲 تاس را پرتاب کن
</div>


<div class="turn">

    <div class="turnText">
        <small>نوبت بازیکن</small>
        شما — آبی
    </div>

    <button class="diceButton" id="dice">
        ⚀
    </button>

</div>

</div><script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}
</script><script type="module">

import * as THREE from "three";


/* ==================================================
   SCENE
================================================== */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x02060c);

scene.fog =
    new THREE.FogExp2(
        0x02060c,
        0.035
    );


/* ==================================================
   CAMERA
================================================== */

const camera =
    new THREE.PerspectiveCamera(
        42,
        innerWidth / innerHeight,
        0.1,
        100
    );

camera.position.set(
    0,
    13,
    13
);

camera.lookAt(
    0,
    0,
    0
);


/* ==================================================
   RENDERER
================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:"high-performance"
    });

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    1.18;

document
    .getElementById("game")
    .appendChild(renderer.domElement);


/* ==================================================
   LIGHTING
================================================== */

const ambient =
    new THREE.HemisphereLight(
        0xaecfff,
        0x201507,
        2.2
    );

scene.add(ambient);


const key =
    new THREE.DirectionalLight(
        0xffe5b0,
        4.2
    );

key.position.set(
    -7,
    12,
    8
);

key.castShadow = true;

key.shadow.mapSize.width = 2048;
key.shadow.mapSize.height = 2048;

key.shadow.camera.left = -12;
key.shadow.camera.right = 12;
key.shadow.camera.top = 12;
key.shadow.camera.bottom = -12;

scene.add(key);


const blueLight =
    new THREE.PointLight(
        0x338cff,
        10,
        18
    );

blueLight.position.set(
    -5,
    4,
    -4
);

scene.add(blueLight);


const goldLight =
    new THREE.PointLight(
        0xffb52e,
        12,
        15
    );

goldLight.position.set(
    4,
    5,
    3
);

scene.add(goldLight);


/* ==================================================
   FLOOR
================================================== */

const floorGeo =
    new THREE.CylinderGeometry(
        15,
        15,
        .6,
        64
    );

const floorMat =
    new THREE.MeshStandardMaterial({
        color:0x08111a,
        roughness:.38,
        metalness:.5
    });

const floor =
    new THREE.Mesh(
        floorGeo,
        floorMat
    );

floor.position.y = -1;

floor.receiveShadow = true;

scene.add(floor);


/* ==================================================
   TABLE BASE
================================================== */

const tableGeo =
    new THREE.BoxGeometry(
        10,
        .85,
        10
    );

const tableMat =
    new THREE.MeshStandardMaterial({
        color:0x2b1710,
        roughness:.27,
        metalness:.12
    });

const table =
    new THREE.Mesh(
        tableGeo,
        tableMat
    );

table.position.y = -0.25;

table.castShadow = true;
table.receiveShadow = true;

scene.add(table);


/* ==================================================
   BOARD
================================================== */

const boardGeo =
    new THREE.BoxGeometry(
        9.45,
        .28,
        9.45
    );

const boardMat =
    new THREE.MeshStandardMaterial({
        color:0xb88b43,
        roughness:.43,
        metalness:.08
    });

const board =
    new THREE.Mesh(
        boardGeo,
        boardMat
    );

board.position.y = .35;

board.receiveShadow = true;
board.castShadow = true;

scene.add(board);


/* ==================================================
   BOARD FRAME
================================================== */

const frameMat =
    new THREE.MeshStandardMaterial({
        color:0x4b2b18,
        roughness:.3,
        metalness:.15
    });

function frame(
    x,
    z,
    sx,
    sz
){

    const geo =
        new THREE.BoxGeometry(
            sx,
            .45,
            sz
        );

    const mesh =
        new THREE.Mesh(
            geo,
            frameMat
        );

    mesh.position.set(
        x,
        .55,
        z
    );

    mesh.castShadow = true;

    scene.add(mesh);
}

frame(0,-4.75,10,.35);
frame(0,4.75,10,.35);
frame(-4.75,0,.35,10);
frame(4.75,0,.35,10);


/* ==================================================
   HOME AREAS
================================================== */

const homeData = [

    {
        x:-2.9,
        z:-2.9,
        color:0xd8323e
    },

    {
        x:2.9,
        z:-2.9,
        color:0x23a957
    },

    {
        x:2.9,
        z:2.9,
        color:0xe5ae25
    },

    {
        x:-2.9,
        z:2.9,
        color:0x238fd4
    }

];


const homes = [];


for(
    const data of homeData
){

    const geo =
        new THREE.BoxGeometry(
            3.15,
            .18,
            3.15
        );

    const mat =
        new THREE.MeshStandardMaterial({
            color:data.color,
            roughness:.34,
            metalness:.12
        });

    const mesh =
        new THREE.Mesh(
            geo,
            mat
        );

    mesh.position.set(
        data.x,
        .57,
        data.z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    homes.push(mesh);
}


/* ==================================================
   PATH CELLS
================================================== */

const pathCells = [];

const cellSize = .52;

for(
    let row=-5;
    row<=5;
    row++
){

    for(
        let col=-5;
        col<=5;
        col++
    ){

        if(
            Math.abs(row)<=1 &&
            Math.abs(col)<=1
        ){
            continue;
        }

        const edge =
            Math.abs(row)===5 ||
            Math.abs(col)===5;

        if(!edge){
            continue;
        }

        const geo =
            new THREE.BoxGeometry(
                cellSize,
                .12,
                cellSize
            );

        const mat =
            new THREE.MeshStandardMaterial({
                color:0xe5d29a,
                roughness:.55,
                metalness:.03
            });

        const cell =
            new THREE.Mesh(
                geo,
                mat
            );

        cell.position.set(
            col*.73,
            .72,
            row*.73
        );

        cell.castShadow = true;
        cell.receiveShadow = true;

        scene.add(cell);

        pathCells.push(cell);

    }

}


/* ==================================================
   CENTER
================================================== */

const centerGeo =
    new THREE.CylinderGeometry(
        1.35,
        1.35,
        .18,
        64
    );

const centerMat =
    new THREE.MeshStandardMaterial({
        color:0xffbd32,
        roughness:.25,
        metalness:.25,
        emissive:0x4c2600,
        emissiveIntensity:.35
    });

const center =
    new THREE.Mesh(
        centerGeo,
        centerMat
    );

center.position.y = .78;

center.castShadow = true;

scene.add(center);


/* ==================================================
   PAWN FUNCTION
================================================== */

function createPawn(
    color,
    x,
    z
){

    const group =
        new THREE.Group();

    /* body */

    const bodyGeo =
        new THREE.SphereGeometry(
            .28,
            32,
            24
        );

    const bodyMat =
        new THREE.MeshStandardMaterial({
            color:color,
            roughness:.22,
            metalness:.18
        });

    const body =
        new THREE.Mesh(
            bodyGeo,
            bodyMat
        );

    body.scale.y = 1.25;

    body.position.y = .42;

    body.castShadow = true;

    group.add(body);


    /* neck */

    const neckGeo =
        new THREE.CylinderGeometry(
            .18,
            .23,
            .25,
            32
        );

    const neck =
        new THREE.Mesh(
            neckGeo,
            bodyMat
        );

    neck.position.y = .65;

    neck.castShadow = true;

    group.add(neck);


    /* head */

    const headGeo =
        new THREE.SphereGeometry(
            .24,
            32,
            32
        );

    const head =
        new THREE.Mesh(
            headGeo,
            bodyMat
        );

    head.position.y = .88;

    head.castShadow = true;

    group.add(head);


    /* base */

    const baseGeo =
        new THREE.CylinderGeometry(
            .38,
            .44,
            .13,
            48
        );

    const base =
        new THREE.Mesh(
            baseGeo,
            bodyMat
        );

    base.position.y = .08;

    base.castShadow = true;

    group.add(base);


    group.position.set(
        x,
        0,
        z
    );

    scene.add(group);

    return group;

}


/* ==================================================
   PAWNS
================================================== */

const pawnColors = [
    0xe43a45,
    0x2bb65b,
    0xf0bd2c,
    0x2998e5
];

const pawnPositions = [

    [-3.25,-3.25],
    [-2.45,-3.25],
    [-3.25,-2.45],
    [-2.45,-2.45],

    [2.45,-3.25],
    [3.25,-3.25],
    [2.45,-2.45],
    [3.25,-2.45],

    [2.45,2.45],
    [3.25,2.45],
    [2.45,3.25],
    [3.25,3.25],

    [-3.25,2.45],
    [-2.45,2.45],
    [-3.25,3.25],
    [-2.45,3.25]

];


const pawns = [];

for(
    let i=0;
    i<16;
    i++
){

    const color =
        pawnColors[
            Math.floor(i/4)
        ];

    const p =
        pawnPositions[i];

    const pawn =
        createPawn(
            color,
            p[0],
            p[1]
        );

    pawns.push(pawn);

}


/* ==================================================
   DICE
================================================== */

const diceGroup =
    new THREE.Group();

diceGroup.position.set(
    0,
    1.05,
    0
);

scene.add(diceGroup);


const diceGeo =
    new THREE.BoxGeometry(
        .85,
        .85,
        .85,
        4,
        4,
        4
    );

const diceMat =
    new THREE.MeshStandardMaterial({
        color:0xf4f5f7,
        roughness:.17,
        metalness:.05
    });

const diceMesh =
    new THREE.Mesh(
        diceGeo,
        diceMat
    );

diceMesh.castShadow = true;

diceGroup.add(diceMesh);


/* ==================================================
   DICE ROLL
================================================== */

const diceButton =
    document.getElementById(
        "dice"
    );

let rolling = false;

const faces = [
    "⚀",
    "⚁",
    "⚂",
    "⚃",
    "⚄",
    "⚅"
];

diceButton.addEventListener(
    "click",
    ()=>{

        if(rolling)
            return;

        rolling = true;

        diceButton.classList.add(
            "roll"
        );

        let frame = 0;

        const timer =
            setInterval(
                ()=>{

                    diceMesh.rotation.x += .45;
                    diceMesh.rotation.z += .55;

                    diceButton.textContent =
                        faces[
                            Math.floor(
                                Math.random()*6
                            )
                        ];

                    frame++;

                    if(frame>14){

                        clearInterval(timer);

                        const result =
                            Math.floor(
                                Math.random()*6
                            );

                        diceButton.textContent =
                            faces[result];

                        diceMesh.rotation.x =
                            0;

                        diceMesh.rotation.z =
                            0;

                        rolling = false;

                        showHint(
                            "🎲 عدد تاس: "+
                            (result+1)
                        );

                    }

                },
                55
            );

    }
);


/* ==================================================
   HINT
================================================== */

const hint =
    document.getElementById(
        "hint"
    );

function showHint(text){

    hint.textContent = text;

    hint.classList.add(
        "show"
    );

    setTimeout(
        ()=>{
            hint.classList.remove(
                "show"
            );
        },
        1700
    );

}


/* ==================================================
   ANIMATION
================================================== */

const clock =
    new THREE.Clock();

function animate(){

    requestAnimationFrame(
        animate
    );

    const t =
        clock.getElapsedTime();


    /* subtle pawn animation */

    pawns.forEach(
        (pawn,i)=>{

            pawn.rotation.y =
                Math.sin(
                    t*.8+i
                )*.025;

        }
    );


    /* center glow */

    center.material.emissiveIntensity =
        .32 +
        Math.sin(t*2)*.08;


    /* slow camera breathing */

    camera.position.x =
        Math.sin(t*.12)*.35;

    camera.position.z =
        13 +
        Math.sin(t*.16)*.25;

    camera.lookAt(
        0,
        .2,
        0
    );


    renderer.render(
        scene,
        camera
    );

}

animate();


/* ==================================================
   RESIZE
================================================== */

addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

        renderer.setPixelRatio(
            Math.min(
                devicePixelRatio,
                2
            )
        );

    }
);

</script></body>
    </html>
