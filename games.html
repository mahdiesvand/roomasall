<!DOCTYPE html><html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Honey Ludo</title><style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:
        radial-gradient(circle at 50% 40%,#263c59,#0a111c 55%,#02050a);
}

/* =====================================
   APP
===================================== */

.app{
    width:100%;
    height:100vh;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* =====================================
   AMBIENT LIGHT
===================================== */

.light{
    position:absolute;
    width:600px;
    height:600px;
    border-radius:50%;
    background:rgba(68,163,255,.08);
    filter:blur(90px);
    pointer-events:none;
}

/* =====================================
   GAME TABLE
===================================== */

.table{
    position:relative;
    width:min(94vw,760px);
    aspect-ratio:1/1;

    padding:18px;

    border-radius:42px;

    background:
        linear-gradient(
            145deg,
            #172b3d,
            #07111c
        );

    box-shadow:
        0 35px 100px rgba(0,0,0,.65),
        inset 0 2px 0 rgba(255,255,255,.10),
        inset 0 -10px 30px rgba(0,0,0,.35);

    border:1px solid rgba(255,255,255,.08);
}

/* قاب داخلی */

.board{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;

    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            #e8d6a1,
            #b89b5b
        );

    box-shadow:
        inset 0 0 0 3px rgba(72,43,12,.18),
        inset 0 0 45px rgba(55,33,8,.28);
}

/* =====================================
   CENTER BOARD
===================================== */

.center{
    position:absolute;
    left:50%;
    top:50%;

    width:34%;
    height:34%;

    transform:translate(-50%,-50%);

    background:
        linear-gradient(
            145deg,
            #f7e7b0,
            #d5bd7c
        );

    clip-path:polygon(
        0 0,
        100% 0,
        100% 100%,
        0 100%
    );

    box-shadow:
        inset 0 0 25px rgba(70,40,10,.18);

    z-index:5;
}

/* =====================================
   CENTER TRIANGLES
===================================== */

.center:before,
.center:after{
    content:"";
    position:absolute;
    inset:0;
}

.center:before{
    background:
        linear-gradient(
            135deg,
            transparent 49%,
            #edc92e 50%,
            #edc92e 100%
        );
    clip-path:polygon(
        0 0,
        100% 0,
        50% 50%
    );
}

.center:after{
    background:
        linear-gradient(
            45deg,
            transparent 49%,
            #ff5151 50%,
            #ff5151 100%
        );
    clip-path:polygon(
        0 100%,
        100% 100%,
        50% 50%
    );
}

/* =====================================
   PLAYER ZONES
===================================== */

.zone{
    position:absolute;
    width:38%;
    height:38%;

    border-radius:24px;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        inset 0 0 25px rgba(0,0,0,.12),
        0 5px 12px rgba(0,0,0,.10);

    border:3px solid rgba(255,255,255,.4);
}

.zone.red{
    top:2%;
    left:2%;
    background:
        linear-gradient(
            145deg,
            #ff6868,
            #c72828
        );
}

.zone.green{
    top:2%;
    right:2%;
    background:
        linear-gradient(
            145deg,
            #70e88a,
            #149d48
        );
}

.zone.yellow{
    bottom:2%;
    right:2%;
    background:
        linear-gradient(
            145deg,
            #ffe66a,
            #d99d16
        );
}

.zone.blue{
    bottom:2%;
    left:2%;
    background:
        linear-gradient(
            145deg,
            #61c8ff,
            #1873d1
        );
}

/* =====================================
   HOME CIRCLES
===================================== */

.home{
    width:68%;
    height:68%;

    border-radius:20px;

    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;

    gap:12px;

    padding:14px;

    background:
        rgba(255,255,255,.22);

    box-shadow:
        inset 0 3px 12px rgba(255,255,255,.18),
        inset 0 -8px 20px rgba(0,0,0,.12);
}

/* =====================================
   PAWNS
===================================== */

.pawn-slot{
    display:flex;
    align-items:center;
    justify-content:center;
}

.pawn{
    position:relative;

    width:clamp(25px,6vw,44px);
    aspect-ratio:1;

    border-radius:50%;

    border:3px solid rgba(255,255,255,.75);

    box-shadow:
        inset 0 5px 5px rgba(255,255,255,.4),
        inset 0 -7px 9px rgba(0,0,0,.28),
        0 7px 10px rgba(0,0,0,.3);

    transform:
        translateY(-3px);

    transition:.2s;
}

.pawn:before{
    content:"";
    position:absolute;

    width:45%;
    height:25%;

    left:18%;
    top:12%;

    border-radius:50%;

    background:rgba(255,255,255,.5);

    filter:blur(2px);
}

.red .pawn{
    background:
        radial-gradient(
            circle at 35% 25%,
            #ffb0b0,
            #e72e2e 45%,
            #8d1010
        );
}

.green .pawn{
    background:
        radial-gradient(
            circle at 35% 25%,
            #c2ffd0,
            #23b957 45%,
            #08752e
        );
}

.yellow .pawn{
    background:
        radial-gradient(
            circle at 35% 25%,
            #fff8b0,
            #f2c52b 45%,
            #a56d00
        );
}

.blue .pawn{
    background:
        radial-gradient(
            circle at 35% 25%,
            #c6efff,
            #2699e8 45%,
            #084b91
        );
}

/* =====================================
   PATH
===================================== */

.path{
    position:absolute;
    inset:0;

    z-index:3;

    pointer-events:none;
}

.cell{
    position:absolute;

    width:6.1%;
    height:6.1%;

    border-radius:7px;

    background:
        linear-gradient(
            145deg,
            #fff6d4,
            #d9c58c
        );

    border:1px solid rgba(88,59,19,.2);

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,.6),
        0 2px 3px rgba(0,0,0,.12);
}

/* =====================================
   COLORED PATH CELLS
===================================== */

.cell.red{
    background:
        linear-gradient(
            145deg,
            #ff8d8d,
            #d92f2f
        );
}

.cell.green{
    background:
        linear-gradient(
            145deg,
            #8af09f,
            #24b957
        );
}

.cell.yellow{
    background:
        linear-gradient(
            145deg,
            #fff080,
            #e3ad22
        );
}

.cell.blue{
    background:
        linear-gradient(
            145deg,
            #7bd8ff,
            #2489db
        );
}

/* =====================================
   DECORATION
===================================== */

.table::after{
    content:"";

    position:absolute;
    inset:7px;

    border-radius:37px;

    border:1px solid rgba(255,255,255,.06);

    pointer-events:none;
}

/* =====================================
   DICE
===================================== */

.dice-wrap{
    position:absolute;

    z-index:20;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);
}

.dice{
    width:76px;
    height:76px;

    border-radius:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #d8e2ee
        );

    box-shadow:
        0 15px 35px rgba(0,0,0,.35),
        inset 0 3px 5px rgba(255,255,255,.8);

    font-size:30px;
    font-weight:900;

    color:#172238;

    cursor:pointer;

    user-select:none;

    transition:
        transform .2s;
}

.dice:active{
    transform:
        scale(.9)
        rotate(8deg);
}

/* =====================================
   PLAYER LABEL
===================================== */

.player-label{
    position:absolute;

    z-index:30;

    padding:7px 12px;

    border-radius:12px;

    font-size:10px;
    font-weight:bold;

    color:white;

    background:
        rgba(0,0,0,.35);

    backdrop-filter:blur(8px);

    border:1px solid rgba(255,255,255,.12);
}

.label-red{
    top:3%;
    left:4%;
}

.label-green{
    top:3%;
    right:4%;
}

.label-yellow{
    bottom:3%;
    right:4%;
}

.label-blue{
    bottom:3%;
    left:4%;
}

/* =====================================
   MOBILE
===================================== */

@media(max-width:600px){

    .table{
        width:96vw;
        padding:11px;
        border-radius:29px;
    }

    .board{
        border-radius:22px;
    }

    .zone{
        border-radius:17px;
    }

    .home{
        gap:7px;
        padding:8px;
    }

    .dice{
        width:63px;
        height:63px;
        border-radius:16px;
        font-size:25px;
    }
}
</style></head><body><div class="app"><div class="light"></div>

<div class="table">

    <div class="board">

        <!-- RED -->
        <div class="zone red">

            <div class="home">

                <div class="pawn-slot">
                    <div class="pawn"></div>
                </div>

                <div class="pawn-slot">
                    <div class="pawn"></div>
                </div>

                <div class="pawn-slot">
                    <div class="pawn"></div>
                </div>

                <div class="pawn-slot">
                    <div class="pawn"></div>
                </div>

            </div>

        </div>


        <!-- GREEN -->
        <div class="zone green">

            <div class="home">

                <div class="pawn-slot">
                    <div class="pawn"></div>
                </div>

                <div class="pawn-slot">
                    <div class="pawn"></div>
                </div>

                <div class="pawn-slot">
                    <div class="pawn"></div>
                </div>

                <div class="pawn-slot">
                    <div class="pawn"></div>
                </div>

            </div>

        </div>


        <!-- YELLOW -->
        <div class="zone yellow">

            <div class="home">

                <div class="pawn-slot">
                    <div class="pawn"></div>
                </div>

                <div class="pawn-slot">
                    <div class="pawn"></div>
                </div>

                <div class="pawn-slot">
                    <div class="pawn"></div>
                </div>

                <div class="pawn-slot">
                    <div class="pawn"></div>
                </div>

            </div>

        </div>


        <!-- BLUE -->
        <div class="zone blue">

            <div class="home">

                <div class="pawn-slot">
                    <div class="pawn"></div>
                </div>

                <div class="pawn-slot">
                    <div class="pawn"></div>
                </div>

                <div class="pawn-slot">
                    <div class="pawn"></div>
                </div>

                <div class="pawn-slot">
                    <div class="pawn"></div>
                </div>

            </div>

        </div>


        <!-- CENTER -->

        <div class="center"></div>


        <!-- DICE -->

        <div class="dice-wrap">

            <div
                class="dice"
                id="dice">
                ⚄
            </div>

        </div>


        <!-- PLAYER LABELS -->

        <div class="player-label label-red">
            بازیکن ۱
        </div>

        <div class="player-label label-green">
            بازیکن ۲
        </div>

        <div class="player-label label-yellow">
            بازیکن ۳
        </div>

        <div class="player-label label-blue">
            شما
        </div>

    </div>

</div>

</div><script>

/* =====================================
   DICE
===================================== */

const dice =
    document.getElementById("dice");

const faces = [
    "⚀",
    "⚁",
    "⚂",
    "⚃",
    "⚄",
    "⚅"
];

dice.addEventListener(
    "click",
    ()=>{

        dice.style.transform =
            "rotate(360deg) scale(.9)";

        setTimeout(()=>{

            const number =
                Math.floor(
                    Math.random()*6
                );

            dice.textContent =
                faces[number];

            dice.style.transform =
                "rotate(0deg) scale(1)";

        },350);

    }
);

</script></body>
                        </html>
