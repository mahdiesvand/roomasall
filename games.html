*{

html,
body{
    width:100%;

/* ================================
   LOADING
================================ */

.loading{

    flex-direction:column;

    align-items:center;
    justify-content:center;

}

.loading-title{

.loading-title span{

}

.loading-bar{

    border-radius:10px;

    overflow:hidden;

    background:
        rgba(255,255,255,.08);
}

.loading-progress{
    width:0%;
    height:100%;

    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            #ff9d19,
            #ffe56b
        );

    transition:
        width .25s;
}

/* ================================
   HUD
================================ */

.hud{
    position:fixed;
    inset:0;

    z-index:20;

    pointer-events:none;
}

/* TOP */

.topbar{
    position:absolute;

    top:14px;
    left:14px;
    right:14px;

    align-items:center;
    justify-content:space-between;
}

.logo{

    padding:
        10px
        15px;

    border-radius:15px;

    color:white;

    background:
        rgba(5,12,21,.78);

    border:
        1px solid
        rgba(255,255,255,.1);

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.35);

    backdrop-filter:
        blur(14px);
}

.logo b{
    color:#ffd34d;
}

.status{

    padding:
        9px
        13px;

    border-radius:15px;

    color:#cbd7e5;

    font-size:10px;

    background:
        rgba(5,12,21,.78);

    border:
        1px solid
        rgba(255,255,255,.1);

        blur(14px);
}

.status-dot{
    display:inline-block;

    width:7px;
    height:7px;

    margin-left:4px;

        0 0 10px

}

/* ================================
   PLAYER CARDS
================================ */

.player{

    position:absolute;

    width:145px;

    padding:9px;

    border-radius:16px;

    color:white;

    background:
        rgba(5,13,22,.78);

    border:
        1px solid

    box-shadow:

        rgba(0,0,0,.4);

    backdrop-filter:
        blur(15px);

}

.player.red{
    top:82px;
    left:12px;
}

.player.green{
    top:82px;
    right:12px;
}

.player.yellow{
    bottom:80px;
    right:12px;
}

.player.blue{
    bottom:80px;
    left:12px;

    border-color:
        rgba(75,180,255,.45);
}

.player-name{
    font-size:10px;
    font-weight:bold;
}

.player-state{
    margin-top:4px;

    font-size:8px;

    color:#68e68a;
}

/* ================================
   BOTTOM PANEL
================================ */

.bottom{

    position:absolute;

    left:50%;
    bottom:16px;

    transform:
        translateX(-50%);

    display:flex;

    align-items:center;

    gap:10px;

    min-width:205px;

    padding:9px;

    border-radius:18px;

    background:
        rgba(4,10,18,.88);

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.5);

    backdrop-filter:
        blur(18px);

}

.turn{
    flex:1;

    color:white;

    font-size:10px;
}

.turn small{
    display:block;

    margin-bottom:4px;

    color:#8294a9;
}

.dice{

    width:54px;
    height:54px;

    border:0;

    border-radius:15px;

    font-size:25px;

    cursor:pointer;

    pointer-events:auto;

    color:#162234;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #c2ccd7
        );

    box-shadow:
        0 8px 20px
        rgba(0,0,0,.45),

        inset 0 2px 4px
        rgba(255,255,255,.9);

}

.dice.rolling{
    animation:
        diceRoll .65s
        ease;
}

@keyframes diceRoll{

    0%{
        transform:
            rotate(0)
            scale(1);
    }

    30%{
        transform:
            rotate(120deg)
            scale(.75);
    }

    60%{
        transform:
            rotate(270deg)
            scale(1.1);
    }

    100%{
        transform:
            rotate(360deg)
            scale(1);
    }

}

/* ================================
   MESSAGE
================================ */

.message{

    position:absolute;

    top:82px;
    left:50%;

    transform:
        translateX(-50%);

    padding:
        9px
        15px;

    border-radius:13px;

    font-size:9px;

    color:#dbe7f3;

    background:
        rgba(5,12,21,.85);

    border:
        1px solid
        rgba(255,205,70,.2);

    opacity:0;

    transition:.3s;

}

.message.show{
    opacity:1;
}

/* ================================
   MOBILE
================================ */

@media(max-width:650px){

        width:110px;
    }

    .player-name{

    }

    .player-state{

    }

        font-size:11px;
    }

        font-size:8px;
    }

}

</script><!-- =====================================================
     MAIN GAME
===================================================== --><script type="module">

import * as THREE
from "three";

import {
    GLTFLoader
}
from "three/addons/loaders/GLTFLoader.js";


/* =====================================================
   CONFIG
===================================================== */

const CONFIG = {

    /* محل مدل Blender */

    models:{

        board:
        "./models/board.glb",

        pawn:
        "./models/pawn.glb",

        dice:
        "./models/dice.glb"

    },

    /* Firebase را در مرحله بعد
       اینجا قرار می‌دهیم */

    firebase:{

        enabled:false,

        databaseURL:"",

        projectId:""

    }

};


/* =====================================================
   SCENE
===================================================== */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(
    0x03070d
);

scene.fog =
new THREE.FogExp2(
    0x03070d,
    .035
);


/* =====================================================
   CAMERA
===================================================== */

const camera =
new THREE.PerspectiveCamera(

    42,

    innerWidth /
    innerHeight,

    .1,

    100

);

camera.position.set(
    0,
    12,
    12
);

camera.lookAt(
    0,
    0,
    0
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
new THREE.WebGLRenderer({

    antialias:true,

    powerPreference:
    "high-performance"

});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled =
true;

renderer.shadowMap.type =
THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
THREE.SRGBColorSpace;

renderer.toneMapping =
THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
1.15;


document
.getElementById("game")
.appendChild(
    renderer.domElement
);


/* =====================================================
   LIGHT
===================================================== */

const ambient =
new THREE.HemisphereLight(

    0xbad6ff,

    0x241609,

    2

);

scene.add(
    ambient
);


const sun =
new THREE.DirectionalLight(

    0xffe3ad,

    4

);

sun.position.set(
    -7,
    12,
    8
);

sun.castShadow =
true;

sun.shadow.mapSize.width =
2048;

sun.shadow.mapSize.height =
2048;

scene.add(
    sun
);


const blueLight =
new THREE.PointLight(

    0x258cff,

    8,

    18

);

blueLight.position.set(
    -5,
    4,
    -4
);

scene.add(
    blueLight
);


const goldLight =
new THREE.PointLight(

    0xffae20,

    10,

    15

);

goldLight.position.set(
    4,
    4,
    3
);

scene.add(
    goldLight
);


/* =====================================================
   FLOOR
===================================================== */

const floorGeometry =
new THREE.CylinderGeometry(

    15,
    15,
    .6,
    64

);

const floorMaterial =
new THREE.MeshStandardMaterial({

    color:
    0x08111a,

    roughness:
    .38,

    metalness:
    .45

});

const floor =
new THREE.Mesh(

    floorGeometry,

    floorMaterial

);

floor.position.y =
-1;

floor.receiveShadow =
true;

scene.add(
    floor
);


/* =====================================================
   TEMPORARY BOARD
   بعداً board.glb جایگزین می‌شود
===================================================== */

const boardGeometry =
new THREE.BoxGeometry(

    9,
    .45,
    9

);

const boardMaterial =
new THREE.MeshStandardMaterial({

    color:
    0x9d7337,

    roughness:
    .38,

    metalness:
    .12

});

const board =
new THREE.Mesh(

    boardGeometry,

    boardMaterial

);

board.position.y =
.1;

board.castShadow =
true;

board.receiveShadow =
true;

scene.add(
    board
);


/* =====================================================
   CENTER
===================================================== */

const centerGeometry =
new THREE.CylinderGeometry(

    1.3,
    1.3,
    .18,
    64

);

const centerMaterial =
new THREE.MeshStandardMaterial({

    color:
    0xffbc30,

    roughness:
    .25,

    metalness:
    .2,

    emissive:
    0x4b2500,

    emissiveIntensity:
    .4

});

const center =
new THREE.Mesh(

    centerGeometry,

    centerMaterial

);

center.position.y =
.38;

center.castShadow =
true;

scene.add(
    center
);


/* =====================================================
   TEMPORARY PAWNS
   بعداً pawn.glb جایگزین می‌شود
===================================================== */

function createPawn(
    color,
    x,
    z
){

    const group =
    new THREE.Group();


    const material =
    new THREE.MeshStandardMaterial({

        color:color,

        roughness:.22,

        metalness:.18

    });


    const body =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .35,
            32,
            24
        ),

        material

    );

    body.scale.y =
    1.25;

    body.position.y =
    .55;

    body.castShadow =
    true;

    group.add(
        body
    );


    const head =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .27,
            32,
            32
        ),

        material

    );

    head.position.y =
    .98;

    head.castShadow =
    true;

    group.add(
        head
    );


    const base =
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            .42,
            .48,
            .15,
            40
        ),

        material

    );

    base.position.y =
    .12;

    base.castShadow =
    true;

    group.add(
        base
    );


    group.position.set(
        x,
        0,
        z
    );


    scene.add(
        group
    );


    return group;

}


const pawnColors = [

    0xe23b45,
    0x28ad58,
    0xe5b82d,
    0x2998df

];


const pawnPositions = [

    [-2.9,-2.9],
    [-2.1,-2.9],
    [-2.9,-2.1],
    [-2.1,-2.1],

    [2.1,-2.9],
    [2.9,-2.9],
    [2.1,-2.1],
    [2.9,-2.1],

    [2.1,2.1],
    [2.9,2.1],
    [2.1,2.9],
    [2.9,2.9],

    [-2.9,2.1],
    [-2.1,2.1],
    [-2.9,2.9],
    [-2.1,2.9]

];


const pawns = [];


for(
    let i=0;
    i<pawnPositions.length;
    i++
){

    const color =
    pawnColors[
        Math.floor(i/4)
    ];

    const pos =
    pawnPositions[i];

    pawns.push(

        createPawn(
            color,
            pos[0],
            pos[1]
        )

    );

}


/* =====================================================
   GLB LOADER
===================================================== */

const loader =
new GLTFLoader();


function loadGLB(
    path,
    onLoaded
){

    loader.load(

        path,

        gltf=>{

            const model =
            gltf.scene;

            model.traverse(
                object=>{

                    if(
                        object.isMesh
                    ){

                        object.castShadow =
                        true;

                        object.receiveShadow =
                        true;

                    }

                }
            );

            onLoaded(
                model
            );

        },

        xhr=>{

            if(xhr.total){

                const percent =
                Math.round(
                    xhr.loaded /
                    xhr.total *
                    100
                );

                setProgress(
                    percent
                );

            }

        },

        error=>{

            console.log(
                "GLB not loaded:",
                path
            );

        }

    );

}


/* =====================================================
   GLB READY FUNCTIONS
===================================================== */

function useBoardGLB(
    model
){

    /* وقتی board.glb آماده شد،
       اینجا مدل واقعی را جایگزین
       تخته موقت می‌کنیم */

    model.scale.set(
        1,
        1,
        1
    );

    model.position.y =
    .3;

    scene.add(
        model
    );

    board.visible =
    false;

}


function usePawnGLB(
    model
){

    /*
      مدل حرفه‌ای مهره Blender
      در مرحله بعد به سیستم
      حرکت مهره متصل می‌شود.
    */

    model.scale.set(
        .8,
        .8,
        .8
    );

}


/* =====================================================
   LOADING
===================================================== */

const loading =
document.getElementById(
    "loading"
);

const progress =
document.getElementById(
    "progress"
);


function setProgress(
    value
){

    progress.style.width =
    value+"%";

}


setProgress(
    25
);


/* =====================================================
   DICE
===================================================== */

const dice =
document.getElementById(
    "dice"
);

const faces = [

    "⚀",
    "⚁",
    "⚂",
    "⚃",
    "⚄",
    "⚅"

];

let rolling =
false;


dice.addEventListener(
    "click",
    ()=>{

        if(rolling)
            return;

        rolling =
        true;

        dice.classList.add(
            "rolling"
        );

        let count =
        0;

        const interval =
        setInterval(
            ()=>{

                dice.textContent =
                faces[
                    Math.floor(
                        Math.random()*6
                    )
                ];

                count++;

                if(
                    count>=10
                ){

                    clearInterval(
                        interval
                    );

                    const result =
                    Math.floor(
                        Math.random()*6
                    );

                    dice.textContent =
                    faces[result];

                    dice.classList.remove(
                        "rolling"
                    );

                    rolling =
                    false;

                    showMessage(

                        "🎲 عدد تاس: "+
                        (result+1)

                    );

                }

            },
            70
        );

    }
);


/* =====================================================
   MESSAGE
===================================================== */

const message =
document.getElementById(
    "message"
);


function showMessage(
    text
){

    message.textContent =
    text;

    message.classList.add(
        "show"
    );

    setTimeout(
        ()=>{

            message.classList.remove(
                "show"
            );

        },
        1600
    );

}


/* =====================================================
   ANIMATION
===================================================== */

const clock =
new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );

    const time =
    clock.getElapsedTime();


    center.rotation.y =
    time*.25;


    center.material.emissiveIntensity =
    .35 +
    Math.sin(
        time*2
    )*.08;


    pawns.forEach(
        (pawn,index)=>{

            pawn.rotation.y =
            Math.sin(
                time*.7+
                index
            )*.03;

        }
    );


    camera.position.x =
    Math.sin(
        time*.12
    )*.25;

    camera.position.z =
    12 +
    Math.sin(
        time*.15
    )*.2;

    camera.lookAt(
        0,
        .2,
        0
    );


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
        innerWidth /
        innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );


        renderer.setPixelRatio(

            Math.min(
                devicePixelRatio,
                2
            )

        );

    }
);


/* =====================================================
   START
===================================================== */

setProgress(
    100
);


setTimeout(
    ()=>{

        loading.classList.add(
            "hide"
        );

    },
    700
);

   FIREBASE PLACEHOLDER
===================================================== */
