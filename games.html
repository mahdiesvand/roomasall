<!DOCTYPE html><html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>عسل منچ | Honey Ludo</title><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden}
body{
font-family:Tahoma,Arial,sans-serif;
background:
radial-gradient(circle at 50% 45%,#28435b 0,#0b1724 45%,#02060b 100%);
color:#fff;
}

.app{
width:100%;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
position:relative;
overflow:hidden;
}

.app:before{
content:"";
position:absolute;
width:650px;height:650px;
border-radius:50%;
background:rgba(44,155,255,.08);
filter:blur(100px);
}

/* TABLE */

.table{
position:relative;
width:min(94vw,720px);
aspect-ratio:1;
padding:15px;
border-radius:40px;
background:
linear-gradient(145deg,#263e4d,#07111a 70%);
border:1px solid rgba(255,255,255,.12);
box-shadow:
0 40px 100px rgba(0,0,0,.7),
inset 0 2px 2px rgba(255,255,255,.12),
inset 0 -15px 35px rgba(0,0,0,.45);
}

.board{
position:relative;
width:100%;
height:100%;
overflow:hidden;
border-radius:29px;
background:
linear-gradient(145deg,#f5dfa9,#b99553);
box-shadow:
inset 0 0 35px rgba(70,40,10,.3),
inset 0 0 0 3px rgba(80,45,10,.18);
}

/* BOARD GRID */

.board:before{
content:"";
position:absolute;
inset:0;
opacity:.18;
background-image:
linear-gradient(rgba(90,50,10,.15) 1px,transparent 1px),
linear-gradient(90deg,rgba(90,50,10,.15) 1px,transparent 1px);
background-size:24px 24px;
pointer-events:none;
}

/* ZONES */

.zone{
position:absolute;
width:38%;
height:38%;
border-radius:24px;
display:flex;
align-items:center;
justify-content:center;
z-index:2;
border:3px solid rgba(255,255,255,.38);
box-shadow:
inset 0 5px 15px rgba(255,255,255,.2),
inset 0 -12px 25px rgba(0,0,0,.16),
0 5px 12px rgba(0,0,0,.1);
}

.red{top:2%;left:2%;background:linear-gradient(145deg,#ff6868,#b91f27)}
.green{top:2%;right:2%;background:linear-gradient(145deg,#7bea92,#119346)}
.yellow{bottom:2%;right:2%;background:linear-gradient(145deg,#ffe66d,#d39712)}
.blue{bottom:2%;left:2%;background:linear-gradient(145deg,#6bd0ff,#166dc8)}

.home{
width:67%;
height:67%;
padding:12px;
display:grid;
grid-template-columns:1fr 1fr;
grid-template-rows:1fr 1fr;
gap:10px;
border-radius:19px;
background:rgba(255,255,255,.20);
box-shadow:inset 0 2px 10px rgba(255,255,255,.2);
}

.home-slot{
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
background:rgba(255,255,255,.18);
box-shadow:inset 0 3px 7px rgba(0,0,0,.15);
}

/* PAWNS */

.pawn{
width:clamp(23px,5.5vw,40px);
height:clamp(23px,5.5vw,40px);
border-radius:50%;
border:3px solid rgba(255,255,255,.78);
box-shadow:
inset 4px 5px 7px rgba(255,255,255,.45),
inset -6px -7px 9px rgba(0,0,0,.32),
0 7px 10px rgba(0,0,0,.32);
position:relative;
cursor:pointer;
z-index:15;
transition:.2s;
}

.pawn:before{
content:"";
position:absolute;
width:42%;height:25%;
left:18%;top:10%;
border-radius:50%;
background:rgba(255,255,255,.6);
filter:blur(1px);
}

.pawn.redPawn{background:radial-gradient(circle at 35% 25%,#ffc1c1,#e83238 48%,#8e1119)}
.pawn.greenPawn{background:radial-gradient(circle at 35% 25%,#d2ffda,#20b956 48%,#08702d)}
.pawn.yellowPawn{background:radial-gradient(circle at 35% 25%,#fffbc1,#f1c62e 48%,#9c6500)}
.pawn.bluePawn{background:radial-gradient(circle at 35% 25%,#d2f4ff,#269ce9 48%,#084a8d)}

.pawn.movable{
animation:pulse .8s infinite alternate;
}

@keyframes pulse{
from{transform:scale(1)}
to{transform:scale(1.15);filter:brightness(1.25)}
}

.pawn.moving{
transform:scale(1.25);
z-index:50;
}

/* PATH */

.path{
position:absolute;
inset:0;
z-index:8;
pointer-events:none;
}

.cell{
position:absolute;
width:6.15%;
height:6.15%;
border-radius:7px;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(145deg,#fff5cf,#d4bd82);
border:1px solid rgba(80,45,10,.22);
box-shadow:
inset 0 1px 2px rgba(255,255,255,.8),
0 2px 4px rgba(0,0,0,.12);
font-size:7px;
}

.cell.safe:after{
content:"★";
color:rgba(100,75,25,.5);
font-size:11px;
}

.cell.redPath{background:linear-gradient(145deg,#ff9797,#dc3838)}
.cell.greenPath{background:linear-gradient(145deg,#a1f4ac,#30ba59)}
.cell.yellowPath{background:linear-gradient(145deg,#fff391,#e8b72b)}
.cell.bluePath{background:linear-gradient(145deg,#9ae0ff,#399ddd)}

.finish{
position:absolute;
left:50%;
top:50%;
width:33%;
height:33%;
transform:translate(-50%,-50%);
z-index:4;
background:#ead69e;
box-shadow:inset 0 0 20px rgba(70,40,10,.15);
clip-path:polygon(50% 50%,0 0,100% 0,100% 100%,0 100%);
}

.finish.redFinish{
background:linear-gradient(135deg,#ff5454 0 25%,transparent 25%);
}
.finish.greenFinish{
background:
linear-gradient(45deg,transparent 0 50%,#34ba61 50%);
}
.finish.yellowFinish{
background:
linear-gradient(135deg,transparent 0 50%,#e6b52a 50%);
}
.finish.blueFinish{
background:
linear-gradient(45deg,#2d91dd 0 50%,transparent 50%);
}

.center{
position:absolute;
z-index:12;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:15%;
height:15%;
border-radius:50%;
background:
radial-gradient(circle at 35% 25%,#fff,#ffe36a 30%,#ff9c20 70%,#bd5010);
border:3px solid rgba(255,255,255,.8);
box-shadow:
0 0 25px rgba(255,171,30,.55),
0 10px 20px rgba(0,0,0,.25);
display:flex;
align-items:center;
justify-content:center;
font-size:clamp(15px,4vw,27px);
z-index:30;
}

/* PLAYER LABELS */

.label{
position:absolute;
z-index:35;
padding:6px 10px;
border-radius:10px;
font-size:9px;
font-weight:bold;
background:rgba(0,0,0,.35);
border:1px solid rgba(255,255,255,.15);
backdrop-filter:blur(6px);
}

.lred{top:3%;left:4%}
.lgreen{top:3%;right:4%}
.lyellow{bottom:3%;right:4%}
.lblue{bottom:3%;left:4%}

/* DICE PANEL */

.dicePanel{
position:absolute;
z-index:80;
left:50%;
bottom:12px;
transform:translateX(-50%);
display:flex;
align-items:center;
gap:10px;
padding:7px 9px;
border-radius:17px;
background:rgba(3,10,18,.82);
border:1px solid rgba(255,255,255,.13);
box-shadow:0 10px 25px rgba(0,0,0,.3);
backdrop-filter:blur(10px);
}

.dice{
width:55px;
height:55px;
border-radius:14px;
background:linear-gradient(145deg,#fff,#cdd9e5);
color:#152238;
display:flex;
align-items:center;
justify-content:center;
font-size:27px;
font-weight:900;
cursor:pointer;
box-shadow:
0 8px 20px rgba(0,0,0,.3),
inset 0 3px 5px rgba(255,255,255,.8);
transition:.25s;
}

.dice.rolling{
animation:roll .55s ease;
}

@keyframes roll{
0%{transform:rotate(0) scale(1)}
30%{transform:rotate(120deg) scale(.8)}
65%{transform:rotate(250deg) scale(1.12)}
100%{transform:rotate(360deg) scale(1)}
}

.turn{
font-size:10px;
color:#c4d3e8;
min-width:70px;
text-align:center;
}

.turn strong{
display:block;
margin-top:3px;
font-size:11px;
color:#fff;
}

/* TOP BAR */

.top{
position:absolute;
z-index:100;
top:10px;
left:10px;
right:10px;
display:flex;
justify-content:space-between;
align-items:center;
pointer-events:none;
}

.status{
padding:8px 12px;
border-radius:13px;
background:rgba(2,9,17,.72);
border:1px solid rgba(255,255,255,.1);
font-size:10px;
backdrop-filter:blur(10px);
}

.status b{color:#ffd34e}

.back{
pointer-events:auto;
border:0;
width:40px;
height:40px;
border-radius:13px;
background:rgba(2,9,17,.72);
color:white;
font-size:18px;
border:1px solid rgba(255,255,255,.1);
}

/* OVERLAY */

.overlay{
position:absolute;
inset:0;
z-index:200;
display:flex;
align-items:center;
justify-content:center;
background:rgba(1,5,10,.74);
backdrop-filter:blur(14px);
}

.card{
width:min(340px,88%);
padding:27px 22px;
border-radius:27px;
text-align:center;
background:linear-gradient(145deg,#17314b,#07111d);
border:1px solid rgba(255,255,255,.12);
box-shadow:0 35px 90px rgba(0,0,0,.65);
}

.logo{
width:72px;height:72px;
margin:auto auto 15px;
border-radius:23px;
display:flex;
align-items:center;
justify-content:center;
font-size:36px;
background:linear-gradient(145deg,#ffe568,#f2911b);
box-shadow:0 0 35px rgba(255,167,29,.25);
}

.card h1{
font-size:25px;
margin-bottom:8px;
}

.card h1 span{color:#ffd34e}

.card p{
font-size:11px;
line-height:2;
color:#94a7c0;
}

.start{
margin-top:19px;
width:100%;
height:53px;
border:0;
border-radius:16px;
font-family:inherit;
font-size:15px;
font-weight:bold;
background:linear-gradient(135deg,#ffe56a,#ff981d);
color:#17100a;
cursor:pointer;
}

/* WIN */

.win{
display:none;
}

.win.show{
display:flex;
}

/* MOBILE */

@media(max-width:600px){

.table{
width:97vw;
padding:9px;
border-radius:29px;
}

.board{
border-radius:22px;
}

.zone{
border-radius:16px;
}

.home{
gap:6px;
padding:7px;
}

.dicePanel{
bottom:7px;
}

.dice{
width:49px;
height:49px;
font-size:23px;
}

.cell{
border-radius:5px;
}

}
</style></head><body><div class="app"><div class="table"><div class="board"><!-- PLAYER HOMES --><div class="zone red">
<div class="home">
<div class="home-slot"><div class="pawn redPawn" data-color="red" data-index="0"></div></div>
<div class="home-slot"><div class="pawn redPawn" data-color="red" data-index="1"></div></div>
<div class="home-slot"><div class="pawn redPawn" data-color="red" data-index="2"></div></div>
<div class="home-slot"><div class="pawn redPawn" data-color="red" data-index="3"></div></div>
</div>
</div><div class="zone green">
<div class="home">
<div class="home-slot"><div class="pawn greenPawn" data-color="green" data-index="0"></div></div>
<div class="home-slot"><div class="pawn greenPawn" data-color="green" data-index="1"></div></div>
<div class="home-slot"><div class="pawn greenPawn" data-color="green" data-index="2"></div></div>
<div class="home-slot"><div class="pawn greenPawn" data-color="green" data-index="3"></div></div>
</div>
</div><div class="zone yellow">
<div class="home">
<div class="home-slot"><div class="pawn yellowPawn" data-color="yellow" data-index="0"></div></div>
<div class="home-slot"><div class="pawn yellowPawn" data-color="yellow" data-index="1"></div></div>
<div class="home-slot"><div class="pawn yellowPawn" data-color="yellow" data-index="2"></div></div>
<div class="home-slot"><div class="pawn yellowPawn" data-color="yellow" data-index="3"></div></div>
</div>
</div><div class="zone blue">
<div class="home">
<div class="home-slot"><div class="pawn bluePawn" data-color="blue" data-index="0"></div></div>
<div class="home-slot"><div class="pawn bluePawn" data-color="blue" data-index="1"></div></div>
<div class="home-slot"><div class="pawn-slot"><div class="pawn bluePawn" data-color="blue" data-index="2"></div></div></div>
<div class="home-slot"><div class="pawn bluePawn" data-color="blue" data-index="3"></div></div>
</div>
</div><!-- REALISTIC PATH --><div class="path" id="path"></div><div class="finish"></div><div class="center">★</div><div class="label lred">🔴 بازیکن قرمز</div>
<div class="label lgreen">🟢 بازیکن سبز</div>
<div class="label lyellow">🟡 بازیکن زرد</div>
<div class="label lblue">🔵 شما</div><!-- DICE --><div class="dicePanel"><div class="turn">
نوبت
<strong id="turnText">شما 🔵</strong>
</div><div class="dice" id="dice">⚀</div></div></div>
</div><div class="top"><div class="status">
امتیاز:
<b id="score">0</b>
</div><button class="back" id="back">↩</button>

</div><!-- START --><div class="overlay" id="startOverlay"><div class="card"><div class="logo">🎲</div><h1>
عسل <span>منچ</span>
</h1><p>
یک بازی منچ حرفه‌ای با چهار بازیکن.
تاس را بینداز و مهره‌هایت را به خانه برسان.
</p><button class="start" id="start">
شروع بازی
</button></div></div><!-- WIN --><div class="overlay win" id="winOverlay"><div class="card"><div class="logo">🏆</div><h1>برنده شدی!</h1><p>
تبریک! تمام مهره‌های تو به مقصد رسیدند.
</p><button class="start" id="restart">
بازی دوباره
</button></div></div></div><script>

/* =====================================================
   HONEY LUDO ENGINE
===================================================== */

const dice = document.getElementById("dice");
const start = document.getElementById("start");
const restart = document.getElementById("restart");
const startOverlay = document.getElementById("startOverlay");
const winOverlay = document.getElementById("winOverlay");
const path = document.getElementById("path");
const scoreEl = document.getElementById("score");
const turnText = document.getElementById("turnText");
const back = document.getElementById("back");

const faces = ["⚀","⚁","⚂","⚃","⚄","⚅"];

let gameStarted = false;
let rolling = false;
let diceValue = 0;
let score = 0;

const colors = ["blue","red","green","yellow"];

let currentTurn = 0;

/* =====================================================
   STANDARD 52 CELL RING
===================================================== */

const boardCells = [];

/*
  مسیر حلقه‌ای.
  مختصات به صورت درصد از برد هستند.
*/

const coords = [

[43,94],[43,88],[43,82],[43,76],[43,70],
[37,70],[31,70],[25,70],[19,70],[13,70],
[13,64],[13,58],[13,52],[19,52],[25,52],
[31,52],[37,52],[37,46],[37,40],[31,40],
[25,40],[19,40],[13,40],[13,34],[13,28],
[19,28],[25,28],[31,28],[37,28],[37,22],
[37,16],[37,10],[43,10],[49,10],[55,10],
[55,16],[55,22],[55,28],[61,28],[67,28],
[73,28],[79,28],[85,28],[85,34],[85,40],
[79,40],[73,40],[67,40],[61,40],[61,46],
[61,52],[67,52],[73,52],[79,52],[85,52],
[85,58],[85,64],[85,70],[79,70],[73,70],
[67,70],[61,70],[61,76],[61,82],[61,88],
[61,94]
];

/* =====================================================
   CREATE PATH
===================================================== */

coords.forEach((pos,i)=>{

const cell = document.createElement("div");

cell.className = "cell";

cell.style.left = pos[0] + "%";
cell.style.top = pos[1] + "%";

if([1,14,27,40].includes(i)){
cell.classList.add("safe");
}

path.appendChild(cell);

boardCells.push(cell);

});

/* =====================================================
   PAWN STATE
===================================================== */

const pawns = {};

colors.forEach(color=>{

pawns[color] = [];

document
.querySelectorAll(
`.pawn[data-color="${color}"]`
)
.forEach((el,i)=>{

pawns[color].push({
el:el,
index:i,
position:-1,
finished:false
});

});

});

/* =====================================================
   MOVE PAWN VISUALLY
===================================================== */

function movePawn(pawn, steps){

if(pawn.position < 0){

if(steps !== 6){
return false;
}

pawn.position = 0;

}else{

pawn.position += steps;

}

if(pawn.position >= coords.length){

pawn.position = coords.length;

pawn.finished = true;

return true;

}

const p = coords[pawn.position];

pawn.el.style.position = "absolute";

pawn.el.style.left = p[0] + "%";
pawn.el.style.top = p[1] + "%";

pawn.el.style.transform =
"translate(-50%,-50%)";

pawn.el.classList.add("moving");

setTimeout(()=>{
pawn.el.classList.remove("moving");
},300);

return true;
}

/* =====================================================
   AVAILABLE PAWNS
===================================================== */

function showMovable(){

document
.querySelectorAll(".pawn")
.forEach(p=>{
p.classList.remove("movable");
});

if(!gameStarted || rolling)
return;

const list = pawns.blue;

list.forEach(pawn=>{

if(pawn.finished)
return;

if(pawn.position === -1 && diceValue === 6){
pawn.el.classList.add("movable");
}

if(pawn.position >= 0){
pawn.el.classList.add("movable");
}

});

}

/* =====================================================
   PAWN CLICK
===================================================== */

document
.querySelectorAll(".pawn[data-color='blue']")
.forEach((el,index)=>{

el.addEventListener("click",()=>{

if(!gameStarted)
return;

if(rolling)
return;

if(currentTurn !== 0)
return;

const pawn = pawns.blue[index];

if(pawn.position === -1 && diceValue !== 6)
return;

if(pawn.finished)
return;

movePawn(pawn,diceValue);

score += diceValue;

scoreEl.textContent = score;

diceValue = 0;

showMovable();

nextTurn();

});

});

/* =====================================================
   DICE
===================================================== */

dice.addEventListener("click",()=>{

if(!gameStarted)
return;

if(rolling)
return;

if(currentTurn !== 0)
return;

rolling = true;

dice.classList.add("rolling");

let count = 0;

const animation =
setInterval(()=>{

const n =
Math.floor(Math.random()*6);

dice.textContent =
faces[n];

count++;

if(count >= 8){

clearInterval(animation);

diceValue =
Math.floor(Math.random()*6)+1;

dice.textContent =
faces[diceValue-1];

dice.classList.remove("rolling");

rolling = false;

showMovable();

if(diceValue !== 6){

setTimeout(aiTurn,700);

}

}

},75);

});

/* =====================================================
   TURN
===================================================== */

function nextTurn(){

if(diceValue === 6){

turnText.textContent =
"شما 🔵";

currentTurn = 0;

return;

}

currentTurn = 1;

turnText.textContent =
"قرمز 🔴";

setTimeout(aiTurn,700);

}

/* =====================================================
   SIMPLE AI
===================================================== */

function aiTurn(){

if(!gameStarted)
return;

if(currentTurn === 0)
return;

rolling = true;

dice.classList.add("rolling");

setTimeout(()=>{

const value =
Math.floor(Math.random()*6)+1;

diceValue = value;

dice.textContent =
faces[value-1];

dice.classList.remove("rolling");

rolling = false;

const color =
colors[currentTurn];

const list =
pawns[color];

let movable =
list.filter(p=>
!p.finished &&
(p.position >= 0 || value === 6)
);

if(movable.length){

const pawn =
movable[
Math.floor(Math.random()*movable.length)
];

movePawn(pawn,value);

}

if(value === 6){

setTimeout(aiTurn,800);

}else{

currentTurn++;

if(currentTurn >= 4)
currentTurn = 0;

turnText.textContent =
currentTurn === 0
? "شما 🔵"
: (
currentTurn===1
? "قرمز 🔴"
: currentTurn===2
? "سبز 🟢"
: "زرد 🟡"
);

}

},650);

}

/* =====================================================
   START
===================================================== */

start.addEventListener("click",()=>{

gameStarted = true;

startOverlay.style.display =
"none";

currentTurn = 0;

turnText.textContent =
"شما 🔵";

});

/* =====================================================
   RESTART
===================================================== */

restart.addEventListener("click",()=>{

location.reload();

});

/* =====================================================
   BACK
===================================================== */

back.addEventListener("click",()=>{

window.location.href =
"games.html";

});

/* =====================================================
   INIT
===================================================== */

scoreEl.textContent = "0";

</script></body>
    </html>
