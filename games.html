<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>عسل چت | بازی</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#090909;
    font-family:
        Tahoma,
        Arial,
        sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

/* =========================
   GAME CONTAINER
========================= */

.game{
    position:relative;
    width:100%;
    height:100%;
    max-width:600px;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            #5a301f 0%,
            #29150f 65%,
            #100806 100%
        );

    color:white;
}

/* =========================
   WOOD TEXTURE
========================= */

.game::before{
    content:"";
    position:absolute;
    inset:0;

    opacity:.18;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0px,
            rgba(255,255,255,.05) 2px,
            transparent 5px,
            rgba(0,0,0,.08) 9px
        );

    pointer-events:none;
}

/* =========================
   TOP BAR
========================= */

.topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;

    height:92px;

    z-index:20;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:8px 12px;

    background:
        linear-gradient(
            180deg,
            #132a32,
            #102029 70%,
            #0b161b
        );

    border-bottom:
        5px solid #d69b35;

    box-shadow:
        0 5px 15px rgba(0,0,0,.7);
}

/* =========================
   TOP BUTTON
========================= */

.top-btn{
    width:68px;
    height:68px;

    border-radius:18px;

    border:
        2px solid #8e6327;

    background:
        linear-gradient(
            145deg,
            #1d3138,
            #0c171c
        );

    color:#e8ae3c;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    font-size:28px;

    box-shadow:
        inset 0 0 12px rgba(255,190,50,.12),
        0 4px 10px rgba(0,0,0,.5);
}

.top-btn span{
    font-size:11px;
    margin-top:2px;
    color:#e8c477;
}

/* =========================
   TITLE
========================= */

.title{
    position:absolute;
    left:50%;
    transform:translateX(-50%);

    top:7px;

    min-width:210px;

    text-align:center;

    padding:8px 22px;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            #432115,
            #160d0a
        );

    border:
        2px solid #a8752d;

    box-shadow:
        0 0 15px rgba(0,0,0,.7),
        inset 0 0 12px rgba(220,160,50,.15);
}

.title strong{
    display:block;

    color:#f0b83e;

    font-size:25px;

    text-shadow:
        0 2px 3px #000;
}

.title small{
    display:block;

    color:#d8b96e;

    font-size:10px;

    margin-top:1px;
}

/* =========================
   PLAYER PANELS
========================= */

.players{
    position:absolute;

    top:98px;
    left:8px;
    right:8px;

    height:118px;

    z-index:15;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:8px;
}

.player{
    position:relative;

    min-width:0;

    border-radius:18px;

    border:
        2px solid #68431c;

    background:
        linear-gradient(
            145deg,
            rgba(60,32,20,.97),
            rgba(18,10,7,.97)
        );

    box-shadow:
        inset 0 0 15px rgba(255,190,70,.08),
        0 5px 12px rgba(0,0,0,.65);

    overflow:hidden;

    padding:10px 8px;
}

/* PLAYER AVATAR */

.avatar{
    position:absolute;

    width:58px;
    height:58px;

    top:9px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:30px;

    background:
        radial-gradient(
            circle,
            #54258a,
            #180c2c
        );

    border:
        4px solid #d69b2d;

    box-shadow:
        0 0 10px rgba(230,170,45,.5),
        inset 0 0 12px rgba(255,255,255,.1);
}

.player:nth-child(1) .avatar,
.player:nth-child(3) .avatar{
    background:
        radial-gradient(
            circle,
            #239f31,
            #063d12
        );
}

.player:nth-child(2) .avatar{
    background:
        radial-gradient(
            circle,
            #742ca8,
            #21072d
        );
}

.player:nth-child(4) .avatar{
    background:
        radial-gradient(
            circle,
            #c52c27,
            #430b09
        );
}

.player:nth-child(odd) .avatar{
    right:8px;
}

.player:nth-child(even) .avatar{
    left:8px;
}

/* PLAYER INFO */

.player-info{
    position:absolute;

    top:15px;

    right:74px;
    left:8px;

    text-align:right;
}

.player:nth-child(even) .player-info{
    text-align:left;

    left:74px;
    right:8px;
}

.player-name{
    font-size:13px;
    font-weight:bold;

    color:#fff;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.score{
    margin-top:7px;

    color:#f2bd43;

    font-size:13px;
}

.status{
    margin-top:5px;

    font-size:9px;

    color:#69d86a;
}

/* =========================
   BOARD AREA
========================= */

.board-area{
    position:absolute;

    top:215px;
    left:0;
    right:0;
    bottom:105px;

    display:flex;

    align-items:center;
    justify-content:center;

    z-index:5;
}

/* =========================
   BOARD
========================= */

.board{
    position:relative;

    width:min(94vw,570px);
    height:min(94vw,570px);

    max-width:570px;
    max-height:570px;

    border-radius:50%;

    background:

        radial-gradient(
            circle at 50% 45%,
            #d99b55 0%,
            #b96f39 55%,
            #6e351f 100%
        );

    border:
        12px solid #4b2517;

    box-shadow:
        0 0 0 4px #bd7b2d,
        0 0 0 8px #2a150d,
        0 15px 35px rgba(0,0,0,.75),
        inset 0 0 30px rgba(60,20,5,.55);

    overflow:visible;
}

/* WOOD GRAIN */

.board::before{
    content:"";

    position:absolute;
    inset:0;

    border-radius:50%;

    opacity:.25;

    background:
        repeating-radial-gradient(
            ellipse at center,
            transparent 0px,
            transparent 15px,
            rgba(70,30,10,.12) 17px,
            transparent 20px
        );

    pointer-events:none;
}

/* =========================
   TRACK
========================= */

.track{
    position:absolute;

    inset:9%;

    border-radius:50%;

    border:
        4px solid rgba(70,32,15,.7);

    box-shadow:
        inset 0 0 20px rgba(40,10,0,.45);

}

/* =========================
   BOARD CENTER
========================= */

.board-center{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:29%;
    height:29%;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #63351f,
            #25120c
        );

    border:
        8px solid #6b391f;

    box-shadow:
        0 0 0 3px #c48a35,
        inset 0 0 20px #000,
        0 5px 15px rgba(0,0,0,.7);

    z-index:4;

    display:flex;

    align-items:center;
    justify-content:center;
}

/* CENTER ORNAMENT */

.board-center::before{
    content:"✦";

    font-size:45px;

    color:#d39a38;

    text-shadow:
        0 0 10px #f5c557;
}

/* =========================
   PLAYER HOME AREAS
========================= */

.home{
    position:absolute;

    width:29%;
    height:29%;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    border:5px solid rgba(255,255,255,.12);

    box-shadow:
        inset 0 0 20px rgba(0,0,0,.45),
        0 4px 10px rgba(0,0,0,.35);
}

.home.green{
    left:10%;
    top:10%;

    background:
        radial-gradient(
            circle,
            #1b921e,
            #06450b
        );
}

.home.purple{
    right:10%;
    top:10%;

    background:
        radial-gradient(
            circle,
            #7823a1,
            #30083e
        );
}

.home.blue{
    left:10%;
    bottom:10%;

    background:
        radial-gradient(
            circle,
            #1388c7,
            #063d64
        );
}

.home.red{
    right:10%;
    bottom:10%;

    background:
        radial-gradient(
            circle,
            #d6382d,
            #5a0e0a
        );
}

/* =========================
   HOME PAWNS
========================= */

.home-pawns{
    width:72%;
    height:72%;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    grid-template-rows:
        1fr 1fr;

    gap:7px;
}

.pawn-home{
    position:relative;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 25%,
            #ffffff 0%,
            var(--pawn) 13%,
            #111 100%
        );

    border:
        3px solid rgba(255,255,255,.35);

    box-shadow:
        0 5px 8px rgba(0,0,0,.6),
        inset -4px -5px 7px rgba(0,0,0,.4);

    transform:
        translateZ(0);
}

.pawn-home::after{
    content:"";

    position:absolute;

    width:35%;
    height:20%;

    left:20%;
    top:14%;

    border-radius:50%;

    background:
        rgba(255,255,255,.75);

    filter:blur(2px);
}

/* =========================
   MOBILE
========================= */

@media(max-width:420px){

    .topbar{
        height:82px;
    }

    .top-btn{
        width:58px;
        height:58px;
        font-size:24px;
    }

    .title{
        min-width:155px;
        padding:6px 12px;
    }

    .title strong{
        font-size:19px;
    }

    .title small{
        font-size:8px;
    }

    .players{
        top:88px;
        height:100px;
    }

    .player{
        padding:7px;
    }

    .avatar{
        width:48px;
        height:48px;
        font-size:23px;
    }

    .player-info{
        right:60px;
    }

    .player:nth-child(even) .player-info{
        left:60px;
    }

    .player-name{
        font-size:10px;
    }

    .score{
        font-size:10px;
    }

    .board-area{
        top:188px;
        bottom:92px;
    }

}

</style>
</head>

<!-- =========================
     GAME BOARD ENGINE

<style>

/* مسیر اصلی خانه‌ها */
.board-track{
    position:absolute;
    inset:0;

    z-index:3;

    pointer-events:none;
}

/* هر خانه دقیقاً با مختصات خودش */
.track-cell{
    position:absolute;

    width:8.2%;
    aspect-ratio:1/1;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 28%,
            #dca06a,
            #9a5632 65%,
            #4d2418 100%
        );

    border:
        3px solid #542719;

    box-shadow:
        inset 2px 3px 5px rgba(255,255,255,.18),
        inset -3px -4px 7px rgba(0,0,0,.55),
        0 2px 4px rgba(0,0,0,.5);
}

/* خانه‌های رنگی */
.track-cell.green{
    background:
        radial-gradient(
            circle at 35% 28%,
            #7dff62,
            #168b20 55%,
            #063e0c
        );

    border-color:#15591b;

    box-shadow:
        0 0 9px rgba(35,255,45,.5),
        inset 2px 3px 5px rgba(255,255,255,.25),
        inset -3px -4px 7px rgba(0,0,0,.5);
}

.track-cell.purple{
    background:
        radial-gradient(
            circle at 35% 28%,
            #e69aff,
            #8523a7 55%,
            #35043f
        );

    border-color:#5c1873;

    box-shadow:
        0 0 9px rgba(210,60,255,.45),
        inset 2px 3px 5px rgba(255,255,255,.25),
        inset -3px -4px 7px rgba(0,0,0,.5);
}

.track-cell.blue{
    background:
        radial-gradient(
            circle at 35% 28%,
            #9cecff,
            #147fc0 55%,
            #053b63
        );

    border-color:#0c527d;

    box-shadow:
        0 0 9px rgba(20,180,255,.45),
        inset 2px 3px 5px rgba(255,255,255,.25),
        inset -3px -4px 7px rgba(0,0,0,.5);
}

.track-cell.red{
    background:
        radial-gradient(
            circle at 35% 28%,
            #ff9b92,
            #c92d28 55%,
            #5b0908
        );

    border-color:#7e1715;

    box-shadow:
        0 0 9px rgba(255,50,40,.45),
        inset 2px 3px 5px rgba(255,255,255,.25),
        inset -3px -4px 7px rgba(0,0,0,.5);
}


/* =========================
   REAL PAWN
========================= */

.game-pawn{

    position:absolute;

    width:8.8%;
    aspect-ratio:1/1;

    transform:
        translate(-50%,-58%);

    z-index:10;

    border-radius:50% 50% 45% 45%;

    background:
        radial-gradient(
            circle at 34% 18%,
            #ffffff 0%,
            var(--pawn-color) 12%,
            var(--pawn-color) 48%,
            #551000 100%
        );

    border:
        3px solid rgba(255,255,255,.4);

    box-shadow:
        0 5px 8px rgba(0,0,0,.7),
        inset -5px -7px 8px rgba(0,0,0,.45),
        inset 3px 3px 5px rgba(255,255,255,.35);
}

/* تاج بالای مهره */
.game-pawn::before{

    content:"";

    position:absolute;

    width:42%;
    height:23%;

    left:29%;
    top:-17%;

    border-radius:
        50% 50% 30% 30%;

    background:
        linear-gradient(
            180deg,
            #fff,
            var(--pawn-color) 35%,
            #631000
        );

    border:
        2px solid rgba(255,255,255,.35);

    box-shadow:
        0 2px 4px rgba(0,0,0,.5);
}

/* برق روی مهره */
.game-pawn::after{

    content:"";

    position:absolute;

    width:27%;
    height:14%;

    left:18%;
    top:14%;

    border-radius:50%;

    background:#fff;

    opacity:.9;

    filter:blur(1px);
}


/* =========================
   3D DICE
========================= */

.dice-zone{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    z-index:20;

    width:27%;
    aspect-ratio:1/1;

    perspective:700px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.dice{

    width:58%;
    aspect-ratio:1/1;

    position:relative;

    transform-style:preserve-3d;

    transform:
        rotateX(-18deg)
        rotateY(25deg)
        rotateZ(-4deg);

    transition:
        transform .8s cubic-bezier(.2,.8,.2,1);
}

.dice-face{

    position:absolute;

    inset:0;

    border-radius:18%;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #d7d7d7 45%,
            #999
        );

    border:
        2px solid #777;

    box-shadow:
        inset 5px 5px 9px rgba(255,255,255,.8),
        inset -7px -8px 12px rgba(0,0,0,.25),
        0 8px 12px rgba(0,0,0,.6);

    display:grid;

    padding:15%;

    gap:5%;

    grid-template-columns:
        repeat(3,1fr);

    grid-template-rows:
        repeat(3,1fr);
}

/* نقاط تاس */
.dot{

    width:70%;
    aspect-ratio:1/1;

    justify-self:center;
    align-self:center;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #555,
            #050505
        );

    box-shadow:
        inset 2px 2px 3px rgba(255,255,255,.2),
        0 1px 2px rgba(0,0,0,.7);
}

/* حالت سه بعدی */
.dice-face.front{
    transform:
        translateZ(30px);
}

.dice-face.back{
    transform:
        rotateY(180deg)
        translateZ(30px);
}

.dice-face.right{
    transform:
        rotateY(90deg)
        translateZ(30px);
}

.dice-face.left{
    transform:
        rotateY(-90deg)
        translateZ(30px);
}

.dice-face.top{
    transform:
        rotateX(90deg)
        translateZ(30px);
}

.dice-face.bottom{
    transform:
        rotateX(-90deg)
        translateZ(30px);
}


/* =========================
   DICE GLOW
========================= */

.dice-zone::before{

    content:"";

    position:absolute;

    width:130%;
    height:130%;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,185,45,.35),
            transparent 65%
        );

    filter:blur(8px);

    z-index:-1;

    animation:
        diceGlow 2s infinite alternate;
}

@keyframes diceGlow{

    from{
        opacity:.45;
        transform:scale(.92);
    }

    to{
        opacity:.9;
        transform:scale(1.08);
    }
}


/* =========================
   TURN INDICATOR
========================= */

.turn-box{

    position:absolute;

    top:4%;

    left:50%;

    transform:
        translateX(-50%);

    z-index:18;

    min-width:110px;

    padding:6px 18px;

    text-align:center;

    border-radius:14px;

    background:
        linear-gradient(
            145deg,
            #3b2114,
            #120906
        );

   DICE ROLL SYSTEM

*/

        x:-18,
        y:25,
        z:0
    },

        y:25,
        z:0
    },

/* =========================================

function rollDice(){

    if(rolling)
        return;

    rolling = true;

    rollButton.classList.add(
        "pressed"
    );

    diceZone.classList.add(
        "rolling"
    );

        ) + 1;

    */

        diceRotations[diceValue];


    dice.style.transition =
        "transform 1.15s cubic-bezier(.15,.8,.2,1)";


    dice.style.transform = `

        rotateX(
            ${rotation.x + 720}deg
        )

        rotateY(
            ${rotation.y + 720}deg
        )

        rotateZ(
            ${rotation.z + 360}deg
        )

    `;


    setTimeout(()=>{

        dice.style.transform = `

            rotateX(${rotation.x}deg)

            rotateY(${rotation.y}deg)

            rotateZ(${rotation.z}deg)

        `;

    },850);

        rolling = false;

        rollButton.classList.remove(
            "pressed"
        );

        diceZone.classList.remove(
            "rolling"
        );

        showToast(
            "🎲 عدد تاس: " +
            diceValue
        );

            document.querySelector(
                ".game-pawn.selected"
            );

            movePawn(
                selected,
                diceValue
            );

        }

    },1200);

}

/* =========================================
   MOVE PAWN
========================================= */

function movePawn(
    pawn,
    steps
){

    const currentCell =
        findNearestCell(pawn);

    if(
        currentCell < 0
    )
        return;


    const targetIndex =
        (
            currentCell +
            steps
        ) %
        path.length;


    const start =
        currentCell;


    let step = 1;


    function nextStep(){

        if(step > steps){

            pawn.classList.remove(
                "moving"
            );

            showToast(
                "🏁 حرکت انجام شد"
            );

            return;
        }


        const index =
            (
                start +
                step
            ) %
            path.length;


        const position =
            path[index];


        /*
           رد نور هنگام حرکت
        */

        createTrail(
            position[0],
            position[1]
        );


        pawn.style.left =
            position[0] + "%";

        pawn.style.top =
            position[1] + "%";


        step++;


        setTimeout(
            nextStep,
            300
        );

    }


    pawn.classList.add(
        "moving"
    );


    nextStep();

}


/* =========================================
   FIND PAWN CELL
========================================= */

function findNearestCell(pawn){

    const x =
        parseFloat(
            pawn.style.left
        );

    const y =
        parseFloat(
            pawn.style.top
        );


    let nearest = -1;

    let distance =
        Infinity;


    path.forEach(
        (position,index)=>{

            const dx =
                position[0] - x;

            const dy =
                position[1] - y;

            const d =
                Math.sqrt(
                    dx*dx +
                    dy*dy
                );


            if(d < distance){

                distance = d;

                nearest = index;

            }

        }
    );


    return nearest;

}


/* =========================================
   MOVEMENT TRAIL
========================================= */

function createTrail(
    x,
    y
){

    const trail =
        document.createElement(
            "div"
        );

    trail.className =
        "move-trail";

    trail.style.left =
        x + "%";

    trail.style.top =
        y + "%";


    board.appendChild(
        trail
    );


    setTimeout(
        ()=>{
            trail.remove();

        600
    );

}
