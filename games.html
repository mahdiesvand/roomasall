<!DOCTYPE html><html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>بازی | عسل گیم</title><style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:
        Tahoma,
        Arial,
        sans-serif;
    background:
        radial-gradient(circle at 50% 15%,#273c62 0%,#111827 38%,#050811 100%);
    color:#fff;
}

/* =========================
   MAIN GAME CONTAINER
========================= */

.game{
    position:relative;
    width:100%;
    height:100vh;
    min-height:600px;
    overflow:hidden;
    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.04),
            transparent 35%
        );
}

/* نورهای پس زمینه */

.game::before{
    content:"";
    position:absolute;
    width:420px;
    height:420px;
    top:-180px;
    left:50%;
    transform:translateX(-50%);
    border-radius:50%;
    background:rgba(71,155,255,.12);
    filter:blur(60px);
    pointer-events:none;
}

.game::after{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    bottom:-150px;
    right:-100px;
    border-radius:50%;
    background:rgba(255,184,48,.08);
    filter:blur(70px);
    pointer-events:none;
}

/* =========================
   TOP BAR
========================= */

.topbar{
    position:absolute;
    z-index:20;
    top:0;
    left:0;
    right:0;
    height:76px;
    padding:12px 14px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;

    background:
        linear-gradient(
            180deg,
            rgba(7,12,24,.96),
            rgba(7,12,24,.65)
        );

    border-bottom:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(14px);
}

/* کارت های بالا */

.info-box{
    min-width:82px;
    height:50px;
    padding:6px 11px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    border-radius:15px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.10),
            rgba(255,255,255,.035)
        );

    border:1px solid rgba(255,255,255,.09);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.06),
        0 8px 25px rgba(0,0,0,.22);
}

.info-title{
    font-size:10px;
    color:#93a4c3;
    margin-bottom:3px;
}

.info-value{
    font-size:17px;
    font-weight:900;
    color:#fff;
}

/* امتیاز */

.score-box .info-value{
    color:#ffd45c;
}

/* رکورد */

.best-box .info-value{
    color:#70d8ff;
}

/* =========================
   GAME TITLE
========================= */

.game-title{
    position:absolute;
    z-index:10;
    top:88px;
    left:0;
    right:0;

    text-align:center;
    pointer-events:none;
}

.game-title h1{
    font-size:26px;
    font-weight:1000;
    letter-spacing:.5px;

    background:
        linear-gradient(
            180deg,
            #fff,
            #a9c9ff
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    text-shadow:
        0 0 30px rgba(105,170,255,.18);
}

.game-title p{
    margin-top:5px;
    color:#7182a3;
    font-size:11px;
}

/* =========================
   GAME AREA
========================= */

.play-area{
    position:absolute;
    top:150px;
    left:14px;
    right:14px;
    bottom:92px;

    overflow:hidden;

    border-radius:28px;

    background:
        linear-gradient(
            180deg,
            rgba(25,42,70,.92),
            rgba(8,15,29,.97)
        );

    border:1px solid rgba(255,255,255,.10);

    box-shadow:
        0 25px 70px rgba(0,0,0,.42),
        inset 0 1px 0 rgba(255,255,255,.06);
}

/* شبکه داخل زمین */

.grid{
    position:absolute;
    inset:0;

    opacity:.22;

    background-image:
        linear-gradient(
            rgba(255,255,255,.045) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.045) 1px,
            transparent 1px
        );

    background-size:40px 40px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent
        );
}

/* نور مرکزی */

.arena-glow{
    position:absolute;
    width:280px;
    height:280px;
    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(63,146,255,.18),
            transparent 68%
        );

    filter:blur(5px);
}

/* =========================
   PLAYER
========================= */

.player{
    position:absolute;

    left:50%;
    bottom:38px;

    width:74px;
    height:74px;

    transform:translateX(-50%);

    border-radius:22px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #ffe27b,
            #ffad26
        );

    border:3px solid rgba(255,255,255,.85);

    box-shadow:
        0 0 0 7px rgba(255,187,50,.08),
        0 12px 35px rgba(255,164,25,.28);

    z-index:8;

    transition:
        left .12s ease,
        transform .12s ease;
}

.player::before{
    content:"";
    width:30px;
    height:30px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff 0 5%,
            #272727 6% 24%,
            transparent 25%
        );

    box-shadow:
        18px 0 0 -5px #272727;
}

.player.active{
    transform:
        translateX(-50%)
        scale(1.08);
}

/* =========================
   TARGET
========================= */

.target{
    position:absolute;

    width:62px;
    height:62px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff7bf 0 7%,
            #ffd34f 8% 42%,
            #ff8b20 43% 70%,
            #d94d18 71%
        );

    border:3px solid rgba(255,255,255,.72);

    box-shadow:
        0 0 25px rgba(255,170,40,.45);

    z-index:7;

    animation:
        targetFloat 1.4s ease-in-out infinite;
}

.target::after{
    content:"★";

    color:#fff;
    font-size:22px;

    text-shadow:
        0 2px 8px rgba(0,0,0,.3);
}

@keyframes targetFloat{
    0%,100%{
        transform:translateY(0) scale(1);
    }

    50%{
        transform:translateY(-8px) scale(1.04);
    }
}

/* =========================
   START SCREEN
========================= */

.start-screen{
    position:absolute;
    z-index:30;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:25px;

    background:
        rgba(3,8,18,.72);

    backdrop-filter:blur(10px);

    transition:
        opacity .35s ease,
        visibility .35s ease;
}

.start-screen.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.start-card{
    width:min(360px,100%);
    padding:30px 24px;

    text-align:center;

    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(31,49,81,.97),
            rgba(9,17,31,.98)
        );

    border:1px solid rgba(255,255,255,.11);

    box-shadow:
        0 35px 100px rgba(0,0,0,.55);
}

.start-icon{
    width:82px;
    height:82px;

    margin:0 auto 18px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:26px;

    font-size:40px;

    background:
        linear-gradient(
            145deg,
            #ffd85a,
            #ff8c20
        );

    box-shadow:
        0 12px 35px rgba(255,157,30,.25);
}

.start-card h2{
    font-size:25px;
    margin-bottom:8px;
}

.start-card p{
    color:#8e9db9;
    font-size:12px;
    line-height:2;
}

/* =========================
   START BUTTON
========================= */

.start-btn{
    width:100%;
    height:55px;

    margin-top:22px;

    border:0;
    border-radius:17px;

    cursor:pointer;

    font-family:inherit;
    font-size:16px;
    font-weight:900;

    color:#17100a;

    background:
        linear-gradient(
            135deg,
            #ffe36b,
            #ffab25
        );

    box-shadow:
        0 12px 30px rgba(255,169,38,.25);

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}

.start-btn:active{
    transform:scale(.96);
}

/* =========================
   BOTTOM CONTROLS
========================= */

.bottom{
    position:absolute;
    z-index:20;

    bottom:0;
    left:0;
    right:0;

    height:82px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;

    padding:10px 14px;

    background:
        linear-gradient(
            0deg,
            rgba(5,10,20,.98),
            rgba(5,10,20,.72)
        );

    border-top:1px solid rgba(255,255,255,.07);
    backdrop-filter:blur(12px);
}

.control-btn{
    width:56px;
    height:56px;

    border-radius:18px;

    border:1px solid rgba(255,255,255,.09);

    background:
        rgba(255,255,255,.055);

    color:#dbe7ff;

    font-size:21px;

    cursor:pointer;

    transition:
        transform .12s ease,
        background .12s ease;
}

.control-btn:active{
    transform:scale(.9);
}

.pause-btn{
    width:70px;
    background:
        linear-gradient(
            145deg,
            #315d9d,
            #1c355e
        );

    color:#fff;
}

/* =========================
   MOBILE
========================= */

@media(max-width:430px){

    .topbar{
        height:70px;
        padding:10px;
    }

    .info-box{
        min-width:72px;
        height:46px;
    }

    .info-value{
        font-size:15px;
    }

    .game-title{
        top:80px;
    }

    .game-title h1{
        font-size:22px;
    }

    .play-area{
        top:135px;
        bottom:88px;
        left:9px;
        right:9px;
        border-radius:23px;
    }

    .player{
        width:66px;
        height:66px;
        bottom:30px;
    }

    .target{
        width:56px;
        height:56px;
    }
}
</style></head><body><div class="game"><!-- TOP BAR -->

<div class="topbar">

    <div class="info-box score-box">
        <div class="info-title">امتیاز</div>
        <div class="info-value" id="score">0</div>
    </div>

    <div class="info-box">
        <div class="info-title">زمان</div>
        <div class="info-value" id="timer">30</div>
    </div>

    <div class="info-box best-box">
        <div class="info-title">رکورد</div>
        <div class="info-value" id="best">0</div>
    </div>

</div>


<!-- TITLE -->

<div class="game-title">
    <h1>HONEY ARENA</h1>
    <p>هدف‌ها را بگیر و رکورد خودت را بشکن</p>
</div>


<!-- GAME AREA -->

<div class="play-area" id="playArea">

    <div class="grid"></div>
    <div class="arena-glow"></div>

    <div class="target" id="target"></div>

    <div class="player" id="player"></div>

</div>


<!-- START SCREEN -->

<div class="start-screen" id="startScreen">

    <div class="start-card">

        <div class="start-icon">🎮</div>

        <h2>آماده‌ای؟</h2>

        <p>
            هدف‌های داخل زمین را لمس کن،
            امتیاز بگیر و رکوردت را ثبت کن.
        </p>

        <button
            class="start-btn"
            id="startBtn">
            شروع بازی
        </button>

    </div>

</div>


<!-- BOTTOM -->

<div class="bottom">

    <button
        class="control-btn"
        id="backBtn"
        aria-label="بازگشت">
        ↩
    </button>

    <button
        class="control-btn pause-btn"
        id="pauseBtn"
        aria-label="توقف">
        ⏸
    </button>

    <button
        class="control-btn"
        id="soundBtn"
        aria-label="صدا">
        🔊
    </button>

</div>

</div><script>

/* =========================
   GAME VARIABLES
========================= */

let score = 0;
let time = 30;
let best = Number(localStorage.getItem("honeyBest") || 0);

let playing = false;
let paused = false;
let soundOn = true;

let timerInterval = null;


/* =========================
   ELEMENTS
========================= */

const scoreEl =
    document.getElementById("score");

const timerEl =
    document.getElementById("timer");

const bestEl =
    document.getElementById("best");

const target =
    document.getElementById("target");

const player =
    document.getElementById("player");

const playArea =
    document.getElementById("playArea");

const startScreen =
    document.getElementById("startScreen");

const startBtn =
    document.getElementById("startBtn");

const pauseBtn =
    document.getElementById("pauseBtn");

const soundBtn =
    document.getElementById("soundBtn");

const backBtn =
    document.getElementById("backBtn");


bestEl.textContent = best;


/* =========================
   RANDOM TARGET
========================= */

function moveTarget(){

    const rect =
        playArea.getBoundingClientRect();

    const targetSize =
        target.offsetWidth;

    const padding = 18;

    const maxX =
        rect.width -
        targetSize -
        padding;

    const maxY =
        rect.height -
        targetSize -
        padding;

    const x =
        padding +
        Math.random() * Math.max(0,maxX-padding);

    const y =
        padding +
        Math.random() * Math.max(0,maxY-padding);

    target.style.left = x + "px";
    target.style.top = y + "px";
}


/* =========================
   HIT TARGET
========================= */

function hitTarget(){

    if(!playing || paused) return;

    score++;

    scoreEl.textContent = score;

    player.classList.add("active");

    setTimeout(()=>{
        player.classList.remove("active");
    },120);

    moveTarget();
}


/* =========================
   START GAME
========================= */

function startGame(){

    score = 0;
    time = 30;

    playing = true;
    paused = false;

    scoreEl.textContent = score;
    timerEl.textContent = time;

    startScreen.classList.add("hidden");

    pauseBtn.textContent = "⏸";

    moveTarget();

    clearInterval(timerInterval);

    timerInterval =
        setInterval(()=>{

            if(!playing || paused) return;

            time--;

            timerEl.textContent = time;

            if(time <= 0){
                endGame();
            }

        },1000);
}


/* =========================
   END GAME
========================= */

function endGame(){

    playing = false;

    clearInterval(timerInterval);

    if(score > best){

        best = score;

        localStorage.setItem(
            "honeyBest",
            best
        );

        bestEl.textContent = best;
    }

    setTimeout(()=>{

        startBtn.textContent =
            "دوباره بازی کن";

        startScreen.classList.remove(
            "hidden"
        );

    },300);
}


/* =========================
   PAUSE
========================= */

function togglePause(){

    if(!playing) return;

    paused = !paused;

    pauseBtn.textContent =
        paused ? "▶" : "⏸";
}


/* =========================
   SOUND
========================= */

function toggleSound(){

    soundOn = !soundOn;

    soundBtn.textContent =
        soundOn ? "🔊" : "🔇";
}


/* =========================
   EVENTS
========================= */

target.addEventListener(
    "pointerdown",
    hitTarget
);

startBtn.addEventListener(
    "click",
    startGame
);

pauseBtn.addEventListener(
    "click",
    togglePause
);

soundBtn.addEventListener(
    "click",
    toggleSound
);


/* =========================
   BACK BUTTON
========================= */

backBtn.addEventListener(
    "click",
    ()=>{

        /*
         * اگر صفحه بازی‌هایت games.html است
         * همین مسیر را نگه دار.
         */

        window.location.href =
            "games.html";
    }
);


/* =========================
   INITIAL POSITION
========================= */

window.addEventListener(
    "resize",
    ()=>{
        if(!playing){
            moveTarget();
        }
    }
);

moveTarget();

</script></body>
</html>
