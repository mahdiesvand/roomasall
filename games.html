<!DOCTYPE html><html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>عسل منچ | AAA Game UI</title><style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 35%,
            #263f59 0%,
            #0b1726 38%,
            #03070d 75%,
            #010204 100%
        );

    color:white;
}

/* =========================================
   APP
========================================= */

.app{
    width:100%;
    height:100vh;
    position:relative;
    overflow:hidden;
}

/* cinematic light */

.app::before{
    content:"";
    position:absolute;

    width:800px;
    height:800px;

    left:50%;
    top:42%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,190,65,.16),
            rgba(60,130,255,.05) 45%,
            transparent 70%
        );

    filter:blur(30px);

    pointer-events:none;
}

/* =========================================
   TOP HUD
========================================= */

.topbar{
    position:absolute;

    top:14px;
    left:14px;
    right:14px;

    height:62px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    z-index:100;
}

/* logo */

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-icon{
    width:46px;
    height:46px;

    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:25px;

    background:
        linear-gradient(
            145deg,
            #ffe66c,
            #ff8e19
        );

    box-shadow:
        0 8px 25px rgba(255,145,25,.28),
        inset 0 2px 4px rgba(255,255,255,.65);
}

.logo-name{
    font-size:18px;
    font-weight:900;
}

.logo-name span{
    color:#ffd64d;
}

/* currency */

.currency{
    display:flex;
    align-items:center;
    gap:8px;

    padding:8px 12px;

    border-radius:15px;

    background:
        rgba(7,14,24,.76);

    border:
        1px solid rgba(255,255,255,.09);

    backdrop-filter:blur(14px);
}

.coin{
    width:27px;
    height:27px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 30% 25%,
            #fff7a7,
            #ffc928 48%,
            #a76b00
        );

    color:#5c3900;

    font-size:13px;

    box-shadow:
        inset 0 2px 3px rgba(255,255,255,.7),
        0 3px 8px rgba(0,0,0,.35);
}

.currency strong{
    font-size:12px;
}

/* =========================================
   PLAYER CARDS
========================================= */

.player{
    position:absolute;

    z-index:80;

    width:170px;

    padding:10px;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            rgba(18,34,51,.94),
            rgba(5,12,21,.94)
        );

    border:
        1px solid rgba(255,255,255,.10);

    box-shadow:
        0 14px 35px rgba(0,0,0,.35);

    backdrop-filter:blur(15px);

    transition:.3s;
}

.player.active{
    border-color:rgba(255,210,74,.65);

    box-shadow:
        0 0 25px rgba(255,190,40,.17),
        0 15px 35px rgba(0,0,0,.45);
}

.player.red{
    top:88px;
    left:14px;
}

.player.green{
    top:88px;
    right:14px;
}

.player.yellow{
    bottom:85px;
    right:14px;
}

.player.blue{
    bottom:85px;
    left:14px;
}

.player-row{
    display:flex;
    align-items:center;
    gap:9px;
}

.avatar{
    width:40px;
    height:40px;

    border-radius:13px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;

    border:2px solid rgba(255,255,255,.25);

    box-shadow:
        inset 0 2px 5px rgba(255,255,255,.25),
        0 5px 12px rgba(0,0,0,.3);
}

.red .avatar{
    background:linear-gradient(145deg,#ff6262,#a9111b);
}

.green .avatar{
    background:linear-gradient(145deg,#75ef91,#108b40);
}

.yellow .avatar{
    background:linear-gradient(145deg,#ffe66c,#c48a0c);
}

.blue .avatar{
    background:linear-gradient(145deg,#66ceff,#166dc5);
}

.player-info{
    min-width:0;
}

.player-name{
    font-size:11px;
    font-weight:bold;
}

.player-status{
    margin-top:4px;

    font-size:8px;

    color:#8498af;
}

.online{
    color:#65e98b;
}

.player-stats{
    display:flex;

    justify-content:space-between;

    margin-top:9px;

    font-size:8px;

    color:#7f93aa;
}

.player-stats b{
    color:#fff;
}

/* =========================================
   MAIN GAME AREA
========================================= */

.game-area{
    position:absolute;

    left:50%;
    top:50%;

    width:min(74vw,650px);

    aspect-ratio:1;

    transform:translate(-50%,-50%);

    display:flex;
    align-items:center;
    justify-content:center;
}

/* table shadow */

.game-area::before{
    content:"";

    position:absolute;

    inset:5%;

    border-radius:35px;

    background:#000;

    filter:blur(40px);

    opacity:.65;
}

/* =========================================
   3D TABLE
========================================= */

.table{
    position:relative;

    width:100%;
    height:100%;

    border-radius:38px;

    padding:14px;

    background:
        linear-gradient(
            145deg,
            #3d5667,
            #0a121b 65%
        );

    border:
        1px solid rgba(255,255,255,.13);

    box-shadow:
        0 35px 70px rgba(0,0,0,.65),
        inset 0 2px 2px rgba(255,255,255,.12);
}

.board{
    position:relative;

    width:100%;
    height:100%;

    border-radius:28px;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            #e9ce89,
            #b18b45 70%,
            #80612d
        );

    box-shadow:
        inset 0 0 45px rgba(45,25,5,.38),
        inset 0 2px 2px rgba(255,255,255,.4);
}

/* wooden texture */

.board::before{
    content:"";

    position:absolute;
    inset:0;

    opacity:.18;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0 8px,
            rgba(70,40,10,.15) 9px,
            transparent 11px
        );

    pointer-events:none;
}

/* =========================================
   FOUR AREAS
========================================= */

.home-area{
    position:absolute;

    width:36%;
    height:36%;

    border-radius:23px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:3px solid rgba(255,255,255,.28);

    box-shadow:
        inset 0 7px 18px rgba(255,255,255,.2),
        inset 0 -14px 25px rgba(0,0,0,.18);
}

.home-red{
    top:3%;
    left:3%;

    background:
        linear-gradient(
            145deg,
            #ff6c6c,
            #b81925
        );
}

.home-green{
    top:3%;
    right:3%;

    background:
        linear-gradient(
            145deg,
            #72ec8c,
            #128d43
        );
}

.home-yellow{
    bottom:3%;
    right:3%;

    background:
        linear-gradient(
            145deg,
            #ffe66c,
            #c68d0e
        );
}

.home-blue{
    bottom:3%;
    left:3%;

    background:
        linear-gradient(
            145deg,
            #67ceff,
            #176cc3
        );
}

/* =========================================
   PAWN GRID
========================================= */

.pawn-grid{
    width:68%;
    height:68%;

    padding:10px;

    display:grid;

    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;

    gap:9px;

    border-radius:18px;

    background:
        rgba(255,255,255,.18);

    box-shadow:
        inset 0 3px 10px rgba(255,255,255,.18);
}

.pawn-slot{
    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        rgba(0,0,0,.12);
}

/* =========================================
   PAWNS
========================================= */

.pawn{
    width:clamp(24px,4.5vw,39px);
    height:clamp(24px,4.5vw,39px);

    border-radius:50%;

    position:relative;

    border:3px solid rgba(255,255,255,.7);

    box-shadow:
        inset 5px 6px 8px rgba(255,255,255,.5),
        inset -7px -8px 10px rgba(0,0,0,.3),
        0 8px 12px rgba(0,0,0,.35);

    transition:.25s;
}

.pawn::after{
    content:"";

    position:absolute;

    width:38%;
    height:22%;

    left:19%;
    top:10%;

    border-radius:50%;

    background:rgba(255,255,255,.62);

    filter:blur(1px);
}

.pawn-red{
    background:
        radial-gradient(
            circle at 35% 25%,
            #ffd0d0,
            #e92f38 45%,
            #8d1118
        );
}

.pawn-green{
    background:
        radial-gradient(
            circle at 35% 25%,
            #d3ffdc,
            #25bb59 45%,
            #08702e
        );
}

.pawn-yellow{
    background:
        radial-gradient(
            circle at 35% 25%,
            #fffbc4,
            #f0c52c 45%,
            #986500
        );
}

.pawn-blue{
    background:
        radial-gradient(
            circle at 35% 25%,
            #d5f5ff,
            #299be9 45%,
            #084c91
        );
}

/* =========================================
   CENTER
========================================= */

.center{
    position:absolute;

    left:50%;
    top:50%;

    width:25%;
    height:25%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 25%,
            #fff8c4,
            #ffc934 35%,
            #e67c13 70%,
            #873b0c
        );

    border:4px solid rgba(255,255,255,.7);

    box-shadow:
        0 0 35px rgba(255,181,30,.45),
        inset 0 4px 8px rgba(255,255,255,.5),
        0 12px 20px rgba(0,0,0,.35);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:clamp(20px,4vw,34px);
}

/* =========================================
   TURN PANEL
========================================= */

.turn-panel{
    position:absolute;

    left:50%;
    bottom:22px;

    transform:translateX(-50%);

    z-index:120;

    min-width:210px;

    padding:8px 10px;

    border-radius:18px;

    display:flex;
    align-items:center;
    gap:10px;

    background:
        rgba(4,11,19,.88);

    border:
        1px solid rgba(255,255,255,.12);

    box-shadow:
        0 15px 35px rgba(0,0,0,.45);

    backdrop-filter:blur(15px);
}

.turn-avatar{
    width:38px;
    height:38px;

    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #62cbff,
            #176cc5
        );

    font-size:19px;
}

.turn-info{
    flex:1;
}

.turn-info small{
    display:block;

    color:#8194aa;

    font-size:8px;
}

.turn-info strong{
    display:block;

    margin-top:3px;

    font-size:11px;
}

/* =========================================
   DICE
========================================= */

.dice{
    width:58px;
    height:58px;

    border-radius:16px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:28px;

    color:#172337;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #cbd6e2
        );

    box-shadow:
        0 8px 20px rgba(0,0,0,.4),
        inset 0 3px 5px rgba(255,255,255,.9);

    cursor:pointer;

    transition:.2s;
}

.dice:hover{
    transform:translateY(-2px);
}

.dice.roll{
    animation:diceRoll .6s ease;
}

@keyframes diceRoll{
    0%{transform:rotate(0) scale(1)}
    30%{transform:rotate(120deg) scale(.75)}
    60%{transform:rotate(270deg) scale(1.12)}
    100%{transform:rotate(360deg) scale(1)}
}

/* =========================================
   ACTION BUTTONS
========================================= */

.actions{
    position:absolute;

    z-index:110;

    right:50%;

    transform:translateX(50%);

    bottom:92px;

    display:flex;

    gap:8px;
}

.action{
    height:34px;

    padding:0 13px;

    border-radius:11px;

    border:1px solid rgba(255,255,255,.10);

    color:#dce7f3;

    background:
        rgba(8,17,28,.78);

    font-family:inherit;

    font-size:8px;

    cursor:pointer;

    backdrop-filter:blur(10px);
}

.action.primary{
    color:#171008;

    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            #ffe66b,
            #ff971b
        );
}

/* =========================================
   NOTIFICATION
========================================= */

.notification{
    position:absolute;

    left:50%;

    top:82px;

    transform:
        translateX(-50%)
        translateY(-20px);

    z-index:200;

    padding:10px 17px;

    border-radius:14px;

    background:
        rgba(5,13,22,.9);

    border:
        1px solid rgba(255,214,74,.25);

    box-shadow:
        0 15px 35px rgba(0,0,0,.4);

    font-size:10px;

    opacity:0;

    transition:.35s;

    pointer-events:none;
}

.notification.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:700px){

    .game-area{
        width:94vw;
    }

    .player{
        width:135px;
        padding:8px;
    }

    .player.red{
        top:78px;
        left:8px;
    }

    .player.green{
        top:78px;
        right:8px;
    }

    .player.yellow{
        bottom:74px;
        right:8px;
    }

    .player.blue{
        bottom:74px;
        left:8px;
    }

    .player-name{
        font-size:9px;
    }

    .player-stats{
        font-size:7px;
    }

    .avatar{
        width:34px;
        height:34px;
        font-size:17px;
    }

    .topbar{
        top:8px;
        left:8px;
        right:8px;
    }

    .logo-name{
        display:none;
    }

    .turn-panel{
        bottom:12px;
        min-width:190px;
    }

    .actions{
        bottom:76px;
    }

    .action{
        padding:0 10px;
    }
}

@media(max-height:650px){

    .player{
        transform:scale(.82);
        transform-origin:top;
    }

    .player.yellow,
    .player.blue{
        transform-origin:bottom;
    }
}

</div></div><div class="notification" id="notification">
🎲 تاس را پرتاب کن!
</div></div><script>

const dice =
document.getElementById("dice");

const notification =
document.getElementById("notification");

const score =
document.getElementById("myScore");

const faces = [
"⚀",
"⚁",
"⚂",
"⚃",
"⚄",
"⚅"
];

let busy = false;
let points = 0;

dice.addEventListener("click",()=>{

if(busy) return;

busy = true;

dice.classList.add("roll");

let i = 0;

const timer =
setInterval(()=>{

dice.textContent =
faces[
Math.floor(Math.random()*6)
];

i++;

if(i >= 9){

clearInterval(timer);

const result =
Math.floor(Math.random()*6);

dice.textContent =
faces[result];

points += (result + 1) * 10;

score.textContent =
points;

dice.classList.remove("roll");

showNotification(
"🎲 عدد تاس: " + (result+1)
);

setTimeout(()=>{
busy = false;
},500);

}

},70);

});


function showNotification(text){

notification.textContent =
text;

notification.classList.add("show");

setTimeout(()=>{
notification.classList.remove("show");
},1800);

}


document
.getElementById("hint")
.addEventListener("click",()=>{

showNotification(
"💡 تاس را بزن و حرکتت را شروع کن!"
);

});
